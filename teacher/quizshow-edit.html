<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>퀴즈 쇼 만들기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/design.css">
<link rel="stylesheet" href="../assets/css/site.css">
</head>
<body class="doc qse-body">
<div id="app">
  <!-- 세트 목록 -->
  <main class="wrap qse-list-wrap hidden" id="v-list">
    <div class="qse-list-top">
      <a class="icon-btn lift" href="index.html" aria-label="관리로 돌아가기"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg></a>
      <h1>퀴즈 쇼</h1>
      <button type="button" class="btn btn-primary" id="new-set">+ 새 퀴즈</button>
    </div>
    <div class="qse-sets" id="sets"></div>
  </main>

  <!-- 편집 -->
  <div class="qse hidden" id="v-edit">
    <header class="qse-top">
      <a class="icon-btn lift" href="quizshow-edit.html" aria-label="퀴즈 목록으로"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg></a>
      <input class="input qse-title" id="set-title" maxlength="80" placeholder="퀴즈 제목" aria-label="퀴즈 제목">
      <span class="qse-save muted" id="save-state" role="status"></span>
      <button type="button" class="btn btn-line btn-small" id="set-info">설명</button>
      <button type="button" class="btn btn-primary btn-small" id="start">시작</button>
    </header>

    <aside class="qse-side">
      <ol class="qse-items" id="items" aria-label="문제 목록"></ol>
      <div class="qse-side-btns">
        <button type="button" class="btn btn-primary btn-small" id="add">+ 문제 추가</button>
        <button type="button" class="btn btn-line btn-small" id="import">가져오기</button>
      </div>
    </aside>

    <main class="qse-main" id="main"></main>

    <aside class="qse-props" id="props" aria-label="문항 속성"></aside>
  </div>
</div>

<!-- 문제 종류 고르기 -->
<dialog class="sheet" id="type-dlg" aria-labelledby="type-h">
  <div class="card">
    <h2 id="type-h">문제 종류</h2>
    <div class="qse-types" id="type-list"></div>
    <div class="row-actions"><button type="button" class="btn btn-line" data-close>닫기</button></div>
  </div>
</dialog>

<!-- 가져오기 -->
<dialog class="sheet" id="import-dlg" aria-labelledby="import-h">
  <div class="card">
    <h2 id="import-h">가져오기</h2>
    <div class="nd-views" role="tablist">
      <button type="button" class="nd-view on" data-imp="ws" role="tab">학습지에서</button>
      <button type="button" class="nd-view" data-imp="table" role="tab">표 붙여 넣기</button>
    </div>
    <div data-imp-pane="ws">
      <label class="field"><span>차시 학습지</span><select class="input" id="imp-ws"></select></label>
      <p class="muted qse-imp-note" id="imp-ws-note"></p>
    </div>
    <div data-imp-pane="table" class="hidden">
      <label class="field"><span>엑셀·구글 시트에서 복사해 붙여 넣기</span>
        <textarea class="input qse-paste" id="imp-table" rows="8" placeholder="문제	보기1	보기2	보기3	보기4	정답 번호	시간(초)"></textarea></label>
      <p class="muted qse-imp-note">한 줄에 한 문제: 문제, 보기(2~6개), 정답 번호(여럿이면 1,3), 시간(초, 빼도 됨). 보기가 하나면 답 입력, '참'·'거짓'이면 참/거짓.</p>
      <p class="muted qse-imp-note" id="imp-table-note"></p>
    </div>
    <div class="row-actions">
      <button type="button" class="btn btn-primary" id="imp-go">문제 추가</button>
      <button type="button" class="btn btn-line" data-close>닫기</button>
    </div>
  </div>
</dialog>

<!-- 설명 -->
<dialog class="sheet" id="info-dlg" aria-labelledby="info-h">
  <form class="card" method="dialog" id="info-form">
    <h2 id="info-h">설명</h2>
    <label class="field"><span>설명(선택)</span><textarea class="input" name="description" rows="4" maxlength="500"></textarea></label>
    <div class="row-actions"><button class="btn btn-primary" value="ok">확인</button></div>
  </form>
</dialog>

<!-- 시작 -->
<dialog class="sheet" id="start-dlg" aria-labelledby="start-h">
  <div class="card">
    <h2 id="start-h">퀴즈 쇼 시작</h2>
    <p class="muted" id="start-note" style="margin:0"></p>
    <div class="field"><span>방식</span>
      <div class="qse-seg" role="radiogroup">
        <button type="button" class="qse-seg-b on" data-mode="solo" role="radio" aria-checked="true">개인전</button>
        <button type="button" class="qse-seg-b" data-mode="team" role="radio" aria-checked="false">모둠 대항</button>
      </div>
    </div>
    <div class="field"><span>반</span><div class="qse-classes" id="start-classes"></div></div>
    <div class="row-actions"><button type="button" class="btn btn-line" data-close>닫기</button></div>
  </div>
</dialog>

<script type="module" src="../assets/js/pages/quizshow-edit.js"></script>
</body>
</html>
