<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>723 달의 위상 변화 관찰하기</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{--ink:#0D0D0D;--mut:#5D5D5D;--dim:#8A8A8A;--box:#F7F7F7;--pill:#F0F0F0;--line:#ECECEC;--ok:#0F8A5F;--night:#0E1326;
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font-family:var(--font);word-break:keep-all;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased}
body{display:flex;flex-direction:column;overflow:hidden;padding:12px;gap:10px}
button{font:700 15.5px var(--font);color:var(--ink);background:var(--pill);border:0;border-radius:999px;padding:6px 15px;min-height:42px;cursor:pointer;touch-action:manipulation;transition:background .2s,color .2s}
button:hover{background:#E6E6E6}
button:active{background:#DCDCDC;transform:scale(.98)}
button:disabled{color:var(--dim);opacity:.6;cursor:not-allowed}
button.on,button.on:hover{background:var(--ink);color:#fff}
.how{flex:none;margin:0;padding:9px 16px;border-radius:16px;background:var(--box);font-size:16px;line-height:1.5;display:flex;flex-wrap:wrap;gap:2px 16px}
.how span{color:var(--dim);font-weight:500}
.how span.now{color:var(--ink);font-weight:700}
.how span.now b{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.how span.done{color:var(--ok)}
.how span.done::after{content:" ✓";font-weight:900}
.how span.flash{animation:howflash .8s 3;border-radius:6px}
@keyframes howflash{0%,100%{background:transparent}50%{background:#FFE08A}}
.row{flex:1;min-height:0;display:flex;gap:12px}
.stage{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px;position:relative}
.stage canvas{display:block;width:100%;height:100%;min-height:0;touch-action:none;user-select:none;-webkit-user-select:none;border-radius:20px}
.cvbox{flex:1;min-height:0;position:relative}
.ctrl{flex:none;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;font-size:15.5px;font-weight:700}
.ctrl input[type=range]{accent-color:var(--ink);flex:1;min-width:160px;height:34px;touch-action:none}
.ctrl output{font-variant-numeric:tabular-nums;min-width:96px;text-align:center}
.ctrl .st{margin-left:auto;font-size:14.5px;color:var(--mut);font-weight:500}
.ctrl .arw{width:42px;padding:0;font-size:18px}
#qs{flex:0 0 clamp(270px,34%,360px);display:flex;flex-direction:column;gap:8px;overflow:auto;padding:1px}
.q{background:var(--box);border-radius:18px;padding:11px 14px;font-size:16px;font-weight:500;line-height:1.75;transition:background .2s}
.q .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--ink);color:#fff;font-size:13px;font-weight:900;margin-right:7px;vertical-align:1px}
.q .tag{display:inline-block;font-size:12.5px;font-weight:700;color:#8A5300;background:rgba(255,196,77,.3);border-radius:999px;padding:0 8px;margin-right:6px}
.q .opts{display:inline-flex;flex-wrap:wrap;gap:4px;margin:1px 3px;vertical-align:middle;background:#fff;border-radius:999px;padding:3px}
.q .opts button{background:transparent;font-size:15px;min-height:32px;padding:1px 12px;line-height:1.3}
.q .opts button:hover{background:var(--line)}
.q .opts button.on{background:var(--ink);color:#fff}
.q textarea{display:block;width:100%;margin-top:6px;font:500 15.5px var(--font);border:0;border-radius:12px;padding:8px 11px;outline:none;color:var(--ink);background:#fff;box-shadow:inset 0 0 0 1.5px #E3E3E3;resize:none}
.q textarea:focus{box-shadow:inset 0 0 0 2px var(--ink)}
.q .lock{display:none;font-size:14px;font-weight:700;color:var(--mut);line-height:1.5;margin-top:2px}
.q .lock::before{content:"🔒 "}
.q.locked{cursor:pointer}
.q.locked .body{opacity:.45;pointer-events:none}
.q.locked .lock{display:block}
.q .lock.warn{color:#8A3A00;background:#FFF1D6;border-radius:10px;padding:6px 9px}
.q .lock.warn::before{content:""}
.q.locked:has(.lock.warn){box-shadow:inset 0 0 0 2px #F5A524}
.q.nudge{animation:qshake .42s}
@keyframes qshake{0%,100%{transform:none}20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.q.bad{box-shadow:inset 0 0 0 2px #E0471A;background:#FFF4F0}
.q.bad::after{content:'틀렸어요 · 이 문항만 다시 골라 [제출]';display:block;font-size:13.5px;font-weight:700;color:#A23B0B}
.q.good{box-shadow:inset 0 0 0 2px #22C582}
.sub{flex:none;display:flex;flex-direction:column;gap:5px;margin-top:auto}
.sub button{background:var(--ink);color:#fff;font-size:17px;min-height:46px}
.sub button:hover{background:#2B2B2B}
.sub button:disabled{background:var(--pill);color:var(--dim);opacity:1}
.sub .msg{font-size:14px;font-weight:700;color:var(--mut);text-align:center;min-height:20px}
.sub .msg.ok{color:var(--ok)}.sub .msg.bad{color:#A23B0B}
.toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:rgba(13,13,13,.9);color:#fff;font-size:16.5px;font-weight:700;border-radius:16px;padding:8px 18px;pointer-events:none;opacity:0;transition:opacity .25s;z-index:9;width:max-content;max-width:92%;text-align:center;line-height:1.45}
.toast.on{opacity:1}.toast b{color:#FFD65A}
.gohere{animation:gohere .9s 3;position:relative;z-index:4}
.stage.gohere{border-radius:20px}
@keyframes gohere{0%,100%{box-shadow:0 0 0 0 rgba(245,165,36,0)}50%{box-shadow:0 0 0 6px rgba(245,165,36,.85)}}
.cap{position:absolute;font-size:13.5px;font-weight:700;border-radius:999px;padding:4px 11px;background:rgba(255,255,255,.14);color:#fff;pointer-events:none}
@media (max-height:560px) and (min-width:601px){
  body{padding:6px;gap:6px}.how{font-size:14px;padding:5px 12px}
  #qs{gap:5px}.q{padding:6px 11px;font-size:14.5px;line-height:1.6;border-radius:14px}
  .q .opts button{font-size:13.5px;min-height:28px;padding:0 9px}
  .sub button{min-height:38px;font-size:15.5px}.sub .msg{font-size:12.5px;min-height:16px}
  button{min-height:36px;font-size:14.5px}
}
@media (max-width:600px){
  body{overflow:auto;height:auto;min-height:100%}
  .row{flex-direction:column}.stage{flex:none;height:64vh;min-height:320px}
  #qs{flex:none;overflow:visible}
}
@media (prefers-reduced-motion:reduce){.q.nudge,.how span.flash,.gohere{animation:none}}
</style>

<body>
<style>

<script>
(function(){

function progress(){const n=CFG.t.filter(i=>filled[i]).length;Q.tell({type:'sim:progress',n:n,total:CFG.t.length});
  if(ws===6){if(filled[1])P.open(0);if(filled[7])P.open(1);if(filled[3]&&filled[5])P.open(2);if(n===4){P.open(3);H.done(0);Q.toast('(가)~(아) 붙임딱지를 모두 완성했어요');}return;}
  if(filled[CFG.t[0]]){H.done(0);P.open(0);P.open(1);}
  if(filled[CFG.t[1]]){H.done(1);P.open(2);}}
bv.onclick=()=>{const p=snap();if(!view&&(p<0||CFG.t.indexOf(p)<0)){Q.toast('공(달)을 <b>('+NM[next()==null?CFG.t[0]:next()]+')</b>에 먼저 놓아 보자');return;}
  view=!view;bv.classList.toggle('on',view);if(view)vseen[p]=1;anim();};
function anim(){const t0=performance.now(),a0=va,a1=view?1:0;(function f(){const k=Math.min(1,(performance.now()-t0)/900),s=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;va=a0+(a1-a0)*s;Q.redraw();if(k<1)requestAnimationFrame(f);})();}
function geo(w,h){const R=Math.min(w*.24,h*.265),cx=Math.max(w*.56,R+150),cy=h*.5;return {cx,cy,R,r:Math.max(13,R*.16)};}
function rho(){return (e-90)*Math.PI/180*va;}
function T(px,py){const r=rho(),dx=px-G.cx,dy=py-G.cy;return [G.cx+dx*Math.cos(r)-dy*Math.sin(r),G.cy+dx*Math.sin(r)+dy*Math.cos(r)];}
function mp(a,k){const t=a*Math.PI/180,R=G.R*(k||1);return [G.cx+R*Math.cos(t),G.cy-R*Math.sin(t)];}
function at(ev){const r=cv.getBoundingClientRect();return [ev.clientX-r.left,ev.clientY-r.top];}
cv.addEventListener('pointerdown',ev=>{if(!G)return;if(view){view=false;bv.classList.remove('on');anim();return;}
  const p=at(ev),m=mp(e);if(Math.hypot(p[0]-m[0],p[1]-m[1])>G.r+30){Q.toast('공(달)을 잡고 끌어 보자');return;}drag=true;cv.setPointerCapture(ev.pointerId);ev.preventDefault();});
cv.addEventListener('pointermove',ev=>{const p=at(ev);if(!drag){if(G&&!view){const m=mp(e);cv.style.cursor=Math.hypot(p[0]-m[0],p[1]-m[1])<G.r+30?'grab':'default';}return;}
  e=(Math.atan2(G.cy-p[1],p[0]-G.cx)*180/Math.PI+360)%360;Q.redraw();});
function up(){if(!drag)return;drag=false;const b=snap();if(b>=0)e=b*45;Q.redraw();}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
function draw(){const [x,w,h]=Q.fit(cv);G=geo(w,h);const t=e*Math.PI/180,r=rho(),sp=snap();
  x.fillStyle='#0E1326';x.beginPath();x.roundRect(0,0,w,h,20);x.fill();x.save();x.beginPath();x.roundRect(0,0,w,h,20);x.clip();
  x.save();x.translate(G.cx,G.cy);x.rotate(r);x.translate(-G.cx,-G.cy);
  /* 전등(태양)과 빛 */
  const lx=G.cx+G.R*2.05,gl=x.createRadialGradient(lx,G.cy,0,lx,G.cy,G.R*.9);gl.addColorStop(0,'rgba(255,240,190,1)');gl.addColorStop(.18,'rgba(255,214,90,.85)');gl.addColorStop(1,'rgba(255,214,90,0)');
  x.fillStyle=gl;x.beginPath();x.arc(lx,G.cy,G.R*.9,0,7);x.fill();
  for(let i=0;i<3;i++){const y=G.cy+(i-1)*G.R*.62;Q.arrow(x,lx-G.R*.3,y,G.cx+G.R*1.32,y,'rgba(255,214,90,.75)',4,9);}
  x.strokeStyle='rgba(255,255,255,.28)';x.lineWidth=1.5;x.beginPath();x.arc(G.cx,G.cy,G.R,0,7);x.stroke();
  for(let i=0;i<8;i++){const p=mp(i*45);x.fillStyle='#E0503C';x.beginPath();x.arc(p[0],p[1],4.5,0,7);x.fill();}
  /* 카메라를 든 사람: 늘 공을 향한다 */
  x.save();x.translate(G.cx,G.cy);x.rotate(-t);const u=G.R*.13;
  x.fillStyle='#F2A7B8';x.beginPath();x.ellipse(0,0,u*.8,u*1.5,0,0,7);x.fill();
  x.fillStyle='#2A2A2E';x.beginPath();x.arc(0,0,u*.72,0,7);x.fill();
  x.fillStyle='#F2C9A8';x.fillRect(u*.5,-u*.95,u*.9,u*.3);x.fillRect(u*.5,u*.65,u*.9,u*.3);
  x.fillStyle='#111';x.strokeStyle='#fff';x.lineWidth=1.2;x.beginPath();x.roundRect(u*1.3,-u*.6,u*.5,u*1.2,2);x.fill();x.stroke();x.restore();
  x.strokeStyle='rgba(255,255,255,.5)';x.setLineDash([5,5]);x.lineWidth=1.3;const m=mp(e);x.beginPath();x.moveTo(G.cx+Math.cos(t)*u*2,G.cy-Math.sin(t)*u*2);x.lineTo(m[0],m[1]);x.stroke();x.setLineDash([]);
  /* 공(달): 전등 쪽 절반이 밝다 */
  Moon.top(x,m[0],m[1],G.r,0);x.strokeStyle='rgba(200,200,200,.9)';x.lineWidth=2;x.beginPath();x.moveTo(m[0],m[1]+G.r);x.lineTo(m[0],m[1]+G.r+0.1);x.stroke();
  x.restore();
  /* 글자와 붙임딱지 칸은 돌리지 않고 자리에만 맞춘다 */
  const ss=Math.max(34,G.R*.34);
  for(let i=0;i<8;i++){const q=T.apply(null,mp(i*45,1.58)),isT=CFG.t.indexOf(i)>=0;
    x.fillStyle=filled[i]?'#0A0D1A':'rgba(255,255,255,.06)';x.beginPath();x.roundRect(q[0]-ss/2,q[1]-ss/2,ss,ss,9);x.fill();
    if(filled[i]){Moon.draw(x,q[0],q[1],ss*.38,i*45,{dark:.2,ring:i===0?'rgba(255,255,255,.35)':null});
      if(isT&&performance.now()-pulse<700&&sp===i){x.strokeStyle='#3CDC96';x.lineWidth=3;x.beginPath();x.roundRect(q[0]-ss/2,q[1]-ss/2,ss,ss,9);x.stroke();Q.redraw();}}
    else{x.setLineDash([4,4]);x.strokeStyle=isT?(sp===i?'#FFB340':'rgba(255,255,255,.8)'):'rgba(255,255,255,.25)';x.lineWidth=sp===i&&isT?3:1.5;x.beginPath();x.roundRect(q[0]-ss/2,q[1]-ss/2,ss,ss,9);x.stroke();x.setLineDash([]);
      if(isT)Q.txt(x,'?',q[0],q[1],{s:17,c:'rgba(255,255,255,.7)'});}
    const l=T.apply(null,mp(i*45,1.24));Q.txt(x,'('+NM[i]+')',l[0],l[1],{s:15,w:900,c:isT&&!filled[i]?'#FFB340':'#fff',halo:3});}
  const lp=T(lx-G.R*.1,G.cy+G.R*.42);Q.txt(x,'전등(태양)',Math.max(50,Math.min(w-50,lp[0])),Math.max(16,Math.min(h-14,lp[1])),{s:15,w:900,c:'#FFD65A',halo:3});
  const mt=T(m[0],m[1]);Q.txt(x,'공(달)',mt[0]+(va>.5?G.r+30:0),mt[1]+(va>.5?0:(Math.sin(t)<-.3?-G.r-14:G.r+15)),{s:14,w:900,halo:3});
  Q.txt(x,'카메라(지구)',G.cx,G.cy+G.R*.36,{s:14,w:900,halo:3});
  if(va>.02){x.globalAlpha=va;Q.pill(x,'왼쪽',G.cx-G.R*.62,G.cy,{s:15,bg:'rgba(255,255,255,.22)'});Q.pill(x,'오른쪽',G.cx+G.R*.62,G.cy,{s:15,bg:'rgba(255,255,255,.22)'});
    const side=Math.sin(t)>.3?'오른쪽':Math.sin(t)<-.3?'왼쪽':'';if(side)Q.pill(x,'관측자가 볼 때 전등(태양)은 '+side+'에 있다',G.cx,h-22,{s:14.5,bg:'#FFB340',c:'#0D0D0D',w:900});x.globalAlpha=1;}
  else if(sp===4)Q.pill(x,'모형실험에서는 공을 머리보다 조금 높이 들어 그림자에 가려지지 않게 한다.',w/2,h-20,{s:13,bg:'rgba(255,255,255,.14)'});
  /* 카메라에 찍힌 모습 */
  const pw=Math.max(118,Math.min(w*.26,h*.4,190)),px=12,py=12;
  x.fillStyle='#000';x.beginPath();x.roundRect(px,py,pw,pw+26,16);x.fill();x.strokeStyle='rgba(255,255,255,.5)';x.lineWidth=1.5;x.stroke();
  Moon.draw(x,px+pw/2,py+pw/2,pw*.36,e,{dark:.2,ring:'rgba(255,255,255,.14)'});
  Q.txt(x,'왼쪽',px+20,py+pw-10,{s:12,c:'rgba(255,255,255,.6)',w:500});Q.txt(x,'오른쪽',px+pw-24,py+pw-10,{s:12,c:'rgba(255,255,255,.6)',w:500});
  Q.txt(x,'카메라에 찍힌 모습',px+pw/2,py+pw+11,{s:13.5,w:900});
  Q.txt(x,'위에서 내려다본 모습',w-14,h-14,{a:'right',s:12,c:'rgba(255,255,255,.5)',w:500});
  x.restore();
  st.textContent=sp>=0?'공(달)이 ('+NM[sp]+')에 있어요':'공(달)을 끌어 빨간 점에 놓아 보자';}
Q.loop(draw);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>Q.redraw());
})();
</script>
