<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기체의 부피: 그릇 채우기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#fff;font-family:'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
#host{box-sizing:border-box;height:100%;padding:10px;display:flex}
.gs{display:flex;flex-direction:column;gap:10px;width:100%;height:100%;min-height:0}
.gs-stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;border:1px solid #E3E3E8;border-radius:16px;overflow:hidden;background:#FAFAFC}
.gs-stage canvas{display:block;max-width:100%;max-height:100%;width:auto!important;height:auto;touch-action:none}
.gs-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:none}
.gs-btn{font:700 17px "Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color:#0066CC;background:#fff;border:1.5px solid #0066CC;border-radius:999px;padding:8px 16px;cursor:pointer;min-height:42px;touch-action:manipulation}
.gs-btn:active{background:#E8F1FB}
.gs-seg{display:inline-flex;border:1.5px solid #D1D1D6;border-radius:999px;overflow:hidden;background:#fff}
.gs-seg .gs-btn{border:0;border-radius:0;color:#515154;padding:8px 14px}
.gs-seg .gs-btn.on{background:#0066CC;color:#fff}
.gs-sp{flex:1}
.gs-lab{font:700 16px "Noto Sans KR","Noto Sans CJK KR",sans-serif;color:#6E6E73;margin-right:2px}
.gs-step{display:inline-flex;align-items:center;gap:6px;background:#F2F2F7;border-radius:999px;padding:4px 6px 4px 14px}
.gs-step .gs-btn{width:42px;padding:0;font-size:22px}
.gs-step-l{font:800 17px "Noto Sans KR","Noto Sans CJK KR",sans-serif;color:#1D1D1F}
.gs-step-v{font:800 22px "Noto Sans KR","Noto Sans CJK KR",sans-serif;min-width:24px;text-align:center}

</style>
</head>
<body>
<div id="host"></div>
<script>/* 612 기체의 압력과 부피 관계 — 시뮬레이션 모음
   입자는 모두 같은 빠르기로 움직이고, 서로 부딪히면 방향만 바뀐다(온도 개념은 다루지 않음). */
var GAS = (function(){
'use strict';
var FONT = "'Noto Sans KR','Noto Sans CJK KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif";
var R = 7, V = 150, DPR = 2, ARROW_LIFE = 0.55;
var INK='#1D1D1F', MUTED='#6E6E73', LINE='#E3E3E8', BLUE='#0066CC', RED='#FF3B30', OUTBLUE='#0A84FF';

/* ---------- 공통 ---------- */
function el(tag, cls, html){ var e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function setup(host, W, H){
  var box=el('div','gs'); var cv=el('canvas'); cv.width=W*DPR; cv.height=H*DPR;
  cv.style.width='100%'; cv.style.height='auto'; cv.style.aspectRatio=W+'/'+H;
  var stage=el('div','gs-stage'); stage.appendChild(cv); box.appendChild(stage);
  var ctrl=el('div','gs-ctrl'); box.appendChild(ctrl);
  host.appendChild(box);
  var ctx=cv.getContext('2d'); ctx.setTransform(DPR,0,0,DPR,0,0);
  return {box:box, cv:cv, ctx:ctx, ctrl:ctrl, W:W, H:H};
}
function btn(parent, label, fn, cls){ var b=el('button','gs-btn'+(cls?' '+cls:''),label); b.type='button'; b.addEventListener('click',function(e){ e.stopPropagation(); fn(b); b.blur(); }); parent.appendChild(b); return b; }
function seg(parent, items, cur, fn){
  var s=el('div','gs-seg'); parent.appendChild(s);
  var bs=items.map(function(it){ var b=btn(s,it[0],function(){ bs.forEach(function(x){x.classList.toggle('on',x===b);}); fn(it[1]); }); if(it[1]===cur) b.classList.add('on'); return b; });
  return s;
}
function spacer(parent){ parent.appendChild(el('span','gs-sp')); }
function readout(parent){ var r=el('div','gs-read'); parent.appendChild(r); return r; }
function speedSeg(parent, sim){ return seg(parent, [['느리게',0.5],['보통',1],['빠르게',1.8]], 0.5, function(v){ sim.speed=v; }); }
function rr(ctx,x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function arrow(ctx,x,y,dx,dy,len,col,alpha,width){
  var ex=x+dx*len, ey=y+dy*len, a=Math.atan2(dy,dx), hl=Math.max(8,width*2.6);
  ctx.save(); ctx.globalAlpha=alpha; ctx.strokeStyle=col; ctx.fillStyle=col; ctx.lineWidth=width; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(ex-dx*hl*0.6,ey-dy*hl*0.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(ex,ey); ctx.lineTo(ex-hl*Math.cos(a-0.45),ey-hl*Math.sin(a-0.45)); ctx.lineTo(ex-hl*Math.cos(a+0.45),ey-hl*Math.sin(a+0.45)); ctx.closePath(); ctx.fill();
  ctx.restore();
}
function text(ctx,t,x,y,size,weight,col,align){ ctx.save(); ctx.font=(weight||700)+' '+size+'px '+FONT; ctx.fillStyle=col||INK; ctx.textAlign=align||'left'; ctx.textBaseline='alphabetic'; ctx.fillText(t,x,y); ctx.restore(); }
function bg(ctx,W,H){ ctx.clearRect(0,0,W,H); ctx.fillStyle='#FAFAFC'; ctx.fillRect(0,0,W,H); }

/* ---------- 입자 ---------- */
function particle(x,y,reg){ var a=Math.random()*Math.PI*2; return {x:x,y:y,vx:Math.cos(a)*V,vy:Math.sin(a)*V,reg:reg||0}; }
function norm(p){ var s=Math.hypot(p.vx,p.vy)||1; p.vx=p.vx/s*V; p.vy=p.vy/s*V; }
function move(parts,dt){ parts.forEach(function(p){ if(!p.fly){ p.x+=p.vx*dt; p.y+=p.vy*dt; } }); }
function pairs(parts){
  var D=2*R, D2=D*D, n=parts.length;
  for(var i=0;i<n;i++){ var a=parts[i]; if(a.fly) continue;
    for(var j=i+1;j<n;j++){ var b=parts[j]; if(b.fly || b.reg!==a.reg) continue;
      var dx=b.x-a.x, dy=b.y-a.y, d2=dx*dx+dy*dy; if(d2>=D2||d2===0) continue;
      var d=Math.sqrt(d2), nx=dx/d, ny=dy/d, k=(a.vx-b.vx)*nx+(a.vy-b.vy)*ny;
      if(k>0){ a.vx-=k*nx; a.vy-=k*ny; b.vx+=k*nx; b.vy+=k*ny; norm(a); norm(b); }
      var o=(D-d)/2; a.x-=nx*o; a.y-=ny*o; b.x+=nx*o; b.y+=ny*o;
    } }
}
/* 사각형 안에서 튕기기. 벽마다 부딪힌 위치를 onHit(벽, x, y, nx, ny)로 알린다 */
function boxWalls(p, x0,y0,x1,y1, onHit){
  if(p.x<x0+R){ p.x=x0+R; if(p.vx<0){ p.vx=-p.vx; onHit&&onHit('L',x0,p.y,-1,0);} }
  if(p.x>x1-R){ p.x=x1-R; if(p.vx>0){ p.vx=-p.vx; onHit&&onHit('R',x1,p.y,1,0);} }
  if(p.y<y0+R){ p.y=y0+R; if(p.vy<0){ p.vy=-p.vy; onHit&&onHit('T',p.x,y0,0,-1);} }
  if(p.y>y1-R){ p.y=y1-R; if(p.vy>0){ p.vy=-p.vy; onHit&&onHit('B',p.x,y1,0,1);} }
}
function seedBox(parts,n,x0,y0,x1,y1,reg){
  var t=0; while(n>0 && t<5000){ t++; var x=x0+R+2+Math.random()*(x1-x0-2*R-4), y=y0+R+2+Math.random()*(y1-y0-2*R-4);
    var ok=parts.every(function(q){ return Math.hypot(q.x-x,q.y-y)>2*R+2; }); if(!ok && t<4000) continue; parts.push(particle(x,y,reg)); n--; }
}
function drawP(ctx,p,col){
  ctx.fillStyle=col||'#3A3A3C'; ctx.beginPath(); ctx.arc(p.x,p.y,R,0,Math.PI*2); ctx.fill();
  if(!col || col==='#3A3A3C'){ var ux=p.vx/V, uy=p.vy/V; arrow(ctx,p.x+ux*(R+1),p.y+uy*(R+1),ux,uy,10,'#3A3A3C',0.85,2); }
}
/* 부딪힌 횟수 → 1초당 횟수(시뮬레이션 시간 기준, 최근 구간 평균) */
function Rate(win){ this.win=win||4; this.t=[]; }
Rate.prototype.add=function(now){ this.t.push(now); };
Rate.prototype.get=function(now){ var w=this.win; this.t=this.t.filter(function(x){ return now-x<w; }); return this.t.length/Math.min(w,Math.max(0.5,now)); };
Rate.prototype.clear=function(){ this.t=[]; };
function Arrows(){ this.list=[]; }
Arrows.prototype.add=function(x,y,dx,dy,t,col){ this.list.push({x:x,y:y,dx:dx,dy:dy,t:t,col:col||RED}); };
Arrows.prototype.draw=function(ctx,now,len){ this.list=this.list.filter(function(a){ return now-a.t<ARROW_LIFE; });
  this.list.forEach(function(a){ var age=(now-a.t)/ARROW_LIFE; arrow(ctx,a.x,a.y,a.dx,a.dy,len||28,a.col,1-age*age,4); }); };
function meter(ctx,x,y,w,label,val,max,col,valText){
  text(ctx,label,x,y+16,17,700,'#515154');
  var bx=x, by=y+26, bw=w; ctx.fillStyle='#EEEEF2'; rr(ctx,bx,by,bw,20,10); ctx.fill();
  ctx.fillStyle=col; rr(ctx,bx,by,Math.max(20,Math.min(1,val/max)*bw),20,10); ctx.fill();
  if(valText) text(ctx,valText,x+w,y+16,17,800,INK,'right');
}

/* =====================================================================
   ① 압력: 같은 벽돌을 넓은 면 / 좁은 면으로 찰흙 위에 올리기
   ===================================================================== */
function press(host){
  var W=1000,H=440, g=setup(host,W,H), ctx=g.ctx;
  var sim={n:1, t:0, d:[0,0]};
  var BL=180, BS=56, CLAY=320, cx=[260,740];
  function target(i){ return 1150*sim.n/(i===0?BL:BS); }
  seg(g.ctrl, [['추 1개',1],['추 2개',2],['추 3개',3]], 1, function(v){ sim.n=v; drop(); });
  spacer(g.ctrl);
  btn(g.ctrl,'다시 올려놓기',drop);
  function drop(){ sim.d=[0,0]; }
  sim.tick=function(dt){ for(var i=0;i<2;i++){ sim.d[i]+=(target(i)-sim.d[i])*Math.min(1,dt*3); } draw(); };
  function box(x,y,w,h,f,s){ ctx.fillStyle=f; rr(ctx,x,y,w,h,5); ctx.fill(); ctx.strokeStyle=s; ctx.lineWidth=2.5; rr(ctx,x,y,w,h,5); ctx.stroke(); }
  function draw(){
    bg(ctx,W,H);
    ctx.strokeStyle=LINE; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(W/2,20); ctx.lineTo(W/2,H-20); ctx.stroke();
    for(var i=0;i<2;i++){
      var x=cx[i], wide=i===0, bw=wide?BL:BS, bh=wide?BS:BL, d=sim.d[i];
      ctx.fillStyle='#E6CFA8'; ctx.fillRect(x-200,CLAY,400,H-CLAY-20);
      ctx.fillStyle='#D2B486'; ctx.fillRect(x-200,CLAY,400,6);
      ctx.fillStyle='#C9A777'; ctx.fillRect(x-bw/2,CLAY,bw,d+4);
      var top=CLAY+d-bh;
      box(x-bw/2,top,bw,bh,'#D9734E','#A9502F');
      for(var k=0;k<sim.n;k++){ var ty=top-(k+1)*32; box(x-25,ty,50,30,'#48484A','#1C1C1E'); }
      var topY=top-sim.n*32;
      var len=40+22*sim.n;
      arrow(ctx, x+bw/2+40, topY+6, 0,1, len, RED, 1, 7);
      text(ctx,'누르는 힘', x+bw/2+56, topY+len/2+12, 18, 800, RED);
      ctx.strokeStyle=BLUE; ctx.lineWidth=5; ctx.beginPath(); ctx.moveTo(x-bw/2,CLAY+d+3); ctx.lineTo(x+bw/2,CLAY+d+3); ctx.stroke();
      text(ctx, wide?'넓은 면이 닿을 때':'좁은 면이 닿을 때', x, 34, 24, 800, INK, 'center');
      text(ctx,'닿는 면적: '+(wide?'넓다':'좁다'), x, 66, 19, 800, BLUE, 'center');
      text(ctx,'눌린 깊이 '+(d/4).toFixed(1)+' mm', x, H-30, 20, 800, '#7A5A2E', 'center');
    }
    text(ctx,'벽돌과 추는 양쪽이 똑같다',W/2,H-4,15,700,MUTED,'center');
  }
  draw();
  return sim;
}

/* =====================================================================
   ② 기체의 압력: 상자 속 입자와 벽 충돌
   ===================================================================== */
function box(host, opt){
  opt=opt||{};
  var W=1000,H=440, g=setup(host,W,H), ctx=g.ctx;
  var X0=250,Y0=40,X1=750,Y1=400;
  var sim={speed:0.5,t:0,parts:[],arr:new Arrows(),rate:new Rate(4)};
  function reset(){ sim.parts=[]; seedBox(sim.parts,opt.n||10,X0,Y0,X1,Y1); sim.rate.clear(); sim.t=0; }
  btn(g.ctrl,'입자 넣기',function(){ seedBox(sim.parts,4,X0,Y0,X1,Y1); });
  btn(g.ctrl,'입자 빼기',function(){ sim.parts.splice(0,Math.min(4,sim.parts.length)); });
  spacer(g.ctrl); speedSeg(g.ctrl,sim); btn(g.ctrl,'처음부터',reset);
  g.cv.addEventListener('pointerdown',function(e){
    var r=g.cv.getBoundingClientRect(), x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
    if(x>X0+R&&x<X1-R&&y>Y0+R&&y<Y1-R&&sim.parts.length<60) sim.parts.push(particle(x,y));
  });
  sim.tick=function(rdt){
    var dt=rdt*sim.speed; sim.t+=dt;
    move(sim.parts,dt);
    sim.parts.forEach(function(p){ boxWalls(p,X0,Y0,X1,Y1,function(w,x,y,nx,ny){ sim.arr.add(x,y,nx,ny,sim.t); sim.rate.add(sim.t); }); });
    pairs(sim.parts);
    draw();
  };
  function draw(){
    bg(ctx,W,H);
    ctx.fillStyle='rgba(0,102,204,0.05)'; rr(ctx,X0,Y0,X1-X0,Y1-Y0,16); ctx.fill();
    sim.parts.forEach(function(p){ drawP(ctx,p); });
    ctx.strokeStyle='#8E9AAB'; ctx.lineWidth=12; rr(ctx,X0-6,Y0-6,X1-X0+12,Y1-Y0+12,18); ctx.stroke();
    sim.arr.draw(ctx,sim.t);
    var r=sim.rate.get(sim.t);
    text(ctx,'입자 수', 120, 160, 19, 700, MUTED, 'center'); text(ctx, sim.parts.length+'개', 120, 200, 34, 800, INK, 'center');
    text(ctx,'1초에 벽에', 880, 150, 19, 700, MUTED, 'center'); text(ctx,'부딪히는 횟수', 880, 176, 19, 700, MUTED, 'center');
    text(ctx,'약 '+Math.round(r)+'번', 880, 222, 34, 800, RED, 'center');
  }
  reset(); draw();
  return sim;
}

/* =====================================================================
   ③ 부피: 1 cm³ 쌓기나무로 가로 × 세로 × 높이
   ===================================================================== */
function volume(host){
  var W=1000,H=440, g=setup(host,W,H), ctx=g.ctx;
  var sim={a:3,b:2,c:2, shown:12, t:0};
  var S=40;
  function stepper(label,key,min,max){
    var w=el('div','gs-step'); g.ctrl.appendChild(w);
    w.appendChild(el('span','gs-step-l',label));
    var v;
    btn(w,'−',function(){ sim[key]=Math.max(min,sim[key]-1); v.textContent=sim[key]; });
    v=el('span','gs-step-v',sim[key]); w.appendChild(v);
    btn(w,'+',function(){ sim[key]=Math.min(max,sim[key]+1); v.textContent=sim[key]; });
  }
  stepper('가로','a',1,5); stepper('세로','b',1,4); stepper('높이','c',1,4);
  // 등각 투영
  var ox=300, oy=330;
  function place(){ var a=sim.a,b=sim.b,c=sim.c; ox=320-(a-b)*S*0.87/2; var hh=c*S+(a+b)*S/2; oy=(H-40-hh)/2+c*S+6; }
  function P(x,y,z){ return [ox + (x - y)*S*0.87, oy + (x + y)*S*0.5 - z*S]; }
  function face(pts,fill){ ctx.beginPath(); ctx.moveTo(pts[0][0],pts[0][1]); for(var i=1;i<pts.length;i++) ctx.lineTo(pts[i][0],pts[i][1]); ctx.closePath(); ctx.fillStyle=fill; ctx.fill(); ctx.strokeStyle='#0B4A8B'; ctx.lineWidth=1.6; ctx.stroke(); }
  function cube(x,y,z,alpha){
    ctx.save(); ctx.globalAlpha=alpha;
    face([P(x,y,z+1),P(x+1,y,z+1),P(x+1,y+1,z+1),P(x,y+1,z+1)],'#CFE3F8');
    face([P(x+1,y,z),P(x+1,y+1,z),P(x+1,y+1,z+1),P(x+1,y,z+1)],'#8DBBEA');
    face([P(x,y+1,z),P(x+1,y+1,z),P(x+1,y+1,z+1),P(x,y+1,z+1)],'#A9CDF2');
    ctx.restore();
  }
  sim.tick=function(dt){
    var total=sim.a*sim.b*sim.c;
    if(sim.shown<total) sim.shown=Math.min(total, sim.shown+dt*30);
    else sim.shown=total;
    draw();
  };
  function draw(){
    bg(ctx,W,H); place();
    var a=sim.a,b=sim.b,c=sim.c, total=a*b*c, k=0;
    // 그리는 순서: 뒤 → 앞, 아래 → 위
    var list=[];
    for(var z=0;z<c;z++) for(var y=0;y<b;y++) for(var x=0;x<a;x++) list.push([x,y,z]);
    var order=list.slice().sort(function(p,q){ return (p[0]+p[1]-q[0]-q[1]) || (p[2]-q[2]); });
    var filled = list.slice(0,Math.floor(sim.shown)); // 쌓이는 순서: 아래층부터
    var set={}; filled.forEach(function(p){ set[p.join()]=1; });
    // 바닥 윤곽
    ctx.save(); ctx.setLineDash([6,6]); ctx.strokeStyle='#AEAEB2'; ctx.lineWidth=1.5;
    var f=[P(0,0,0),P(a,0,0),P(a,b,0),P(0,b,0)]; ctx.beginPath(); ctx.moveTo(f[0][0],f[0][1]); f.forEach(function(q){ ctx.lineTo(q[0],q[1]); }); ctx.closePath(); ctx.stroke(); ctx.restore();
    order.forEach(function(p){ if(set[p.join()]) cube(p[0],p[1],p[2],1); });
    // 길이 표시
    var A=P(0,b,0), B=P(a,b,0); A=[A[0],A[1]+18]; B=[B[0],B[1]+18];
    dim(P(0,b,0),P(a,b,0),[0,22],'가로 '+a+' cm', RED);
    dim(P(a,0,0),P(a,b,0),[18,10],'세로 '+b+' cm', '#34A853');
    dim(P(a,0,0),P(a,0,c),[22,0],'높이 '+c+' cm', '#AF52DE', true);
    // 식
    var fx=660;
    text(ctx,'부피 = 가로 × 세로 × 높이', fx, 120, 26, 800, INK);
    ctx.save(); ctx.font='800 40px '+FONT; var parts=[[String(a),RED],[' × ',INK],[String(b),'#34A853'],[' × ',INK],[String(c),'#AF52DE'],[' = '+total,INK]];
    var xx=fx; parts.forEach(function(q){ ctx.fillStyle=q[1]; ctx.fillText(q[0],xx,190); xx+=ctx.measureText(q[0]).width; }); ctx.restore();
    text(ctx,'부피 '+total+' cm³', fx, 260, 34, 800, BLUE);
    ctx.fillStyle='#F2F2F7'; rr(ctx,fx,300,300,96,14); ctx.fill();
    ctx.save(); ctx.translate(fx+60-ox-S*0.0, 0); ctx.restore();
    // 작은 정육면체 그림
    var sox=ox, soy=oy; ox=fx+46; oy=372; var sS=S; S=40; cube(0,0,0,1); S=sS; ox=sox; oy=soy;
    text(ctx,'한 칸 = 1 cm³', fx+120, 338, 21, 800, INK);
    text(ctx,'= 1 mL', fx+120, 372, 21, 800, BLUE);
  }
  function dim(p,q,off,label,col,vert){
    var x1=p[0]+off[0], y1=p[1]+off[1], x2=q[0]+off[0], y2=q[1]+off[1];
    ctx.save(); ctx.strokeStyle=col; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); ctx.restore();
    var mx=(x1+x2)/2, my=(y1+y2)/2;
    text(ctx,label, mx+(vert?14:off[0]*0.9), my+(vert?6:off[1]+16), 20, 800, col, vert?'left':'center');
  }
  draw();
  return sim;
}

/* =====================================================================
   ④ 기체는 그릇을 가득 채운다: 벽을 움직여 그릇 키우기
   ===================================================================== */
function fill(host){
  var W=1000,H=440, g=setup(host,W,H), ctx=g.ctx;
  var CM=36, X0=120, Y0=60, HC=8; // 높이 8 cm
  var sim={speed:0.5,t:0,parts:[],wcm:6,wpx:6*CM, arr:new Arrows()};
  var depth=5;
  var vr;
  btn(g.ctrl,'◀ 그릇 작게',function(){ sim.wcm=Math.max(4,sim.wcm-2); });
  btn(g.ctrl,'그릇 크게 ▶',function(){ sim.wcm=Math.min(16,sim.wcm+2); });
  spacer(g.ctrl); speedSeg(g.ctrl,sim);
  btn(g.ctrl,'처음부터',reset);
  function reset(){ sim.wcm=6; sim.wpx=6*CM; sim.parts=[]; seedBox(sim.parts,14,X0,Y0,X0+sim.wpx,Y0+HC*CM); }
  sim.tick=function(rdt){
    var dt=rdt*sim.speed; sim.t+=dt;
    sim.wpx += (sim.wcm*CM-sim.wpx)*Math.min(1,rdt*3);
    var X1=X0+sim.wpx, Y1=Y0+HC*CM;
    move(sim.parts,dt);
    sim.parts.forEach(function(p){ boxWalls(p,X0,Y0,X1,Y1); });
    pairs(sim.parts);
    draw();
  };
  function draw(){
    bg(ctx,W,H);
    // 눈금 종이
    ctx.strokeStyle='#ECECF1'; ctx.lineWidth=1;
    for(var x=X0;x<=X0+16*CM;x+=CM){ ctx.beginPath(); ctx.moveTo(x,Y0); ctx.lineTo(x,Y0+HC*CM); ctx.stroke(); }
    for(var y=Y0;y<=Y0+HC*CM;y+=CM){ ctx.beginPath(); ctx.moveTo(X0,y); ctx.lineTo(X0+16*CM,y); ctx.stroke(); }
    var X1=X0+sim.wpx, Y1=Y0+HC*CM;
    ctx.fillStyle='rgba(0,102,204,0.07)'; ctx.fillRect(X0,Y0,X1-X0,Y1-Y0);
    sim.parts.forEach(function(p){ drawP(ctx,p); });
    ctx.strokeStyle='#8E9AAB'; ctx.lineWidth=10;
    ctx.beginPath(); ctx.moveTo(X1,Y0-5); ctx.lineTo(X0-5,Y0-5); ctx.lineTo(X0-5,Y1+5); ctx.lineTo(X1,Y1+5); ctx.stroke();
    // 움직이는 벽
    ctx.fillStyle='#636366'; rr(ctx,X1,Y0-14,14,Y1-Y0+28,4); ctx.fill();
    // 치수
    ctx.strokeStyle=RED; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(X0,Y1+26); ctx.lineTo(X1,Y1+26); ctx.stroke();
    text(ctx,'가로 '+Math.round(sim.wpx/CM)+' cm',(X0+X1)/2,Y1+52,19,800,RED,'center');
    ctx.strokeStyle='#AF52DE'; ctx.beginPath(); ctx.moveTo(X0-26,Y0); ctx.lineTo(X0-26,Y1); ctx.stroke();
    ctx.save(); ctx.translate(X0-38,(Y0+Y1)/2); ctx.rotate(-Math.PI/2); text(ctx,'높이 8 cm',0,0,19,800,'#AF52DE','center'); ctx.restore();
    // 읽기
    var w=Math.round(sim.wpx/CM);
    var rx=Math.max(X1+40, 740);
    rx=760;
    ctx.fillStyle='rgba(255,255,255,0.92)'; rr(ctx,rx-14,70,250,300,16); ctx.fill(); ctx.strokeStyle=LINE; ctx.lineWidth=1.5; rr(ctx,rx-14,70,250,300,16); ctx.stroke();
    text(ctx,'입자 수',rx,110,19,700,MUTED); text(ctx,sim.parts.length+'개',rx,150,32,800,INK);
    text(ctx,'그릇의 부피',rx,200,19,700,MUTED);
    text(ctx,w+' × '+depth+' × 8',rx,236,24,800,INK);
    text(ctx,'= '+(w*depth*8)+' mL',rx,276,30,800,BLUE);
    text(ctx,'(세로는 '+depth+' cm로 같음)',rx,316,15,700,MUTED);
  }
  reset(); draw();
  return sim;
}

/* =====================================================================
   ⑤⑥ 주사기 — 끝을 막은 주사기의 피스톤 누르기 / 당기기
   opt: particles(입자 보기), gauge(압력계), unit('kPa'|'기압'), vmax, vmin, step, k(압력×부피), presets(기압 단추)
   ===================================================================== */
function syringe(host, opt){
  opt=opt||{};
  var W=1000,H=440, g=setup(host,W,H), ctx=g.ctx;
  var vmax=opt.vmax||20, vmin=opt.vmin||10, step=opt.step||2, k=opt.k||2000, unit=opt.unit||'kPa';
  var TIP=230, YT=150, YB=290, LEN=360, mlpx=LEN/vmax; // 막힌 끝 안쪽 x, 통 안쪽 위·아래
  var sim={speed:0.5,t:0,v:opt.v0||vmax,vx:opt.v0||vmax,parts:[],arr:new Arrows(),rate:new Rate(5)};
  var showP=!!opt.particles;
  function px(v){ return TIP+v*mlpx; }
  function P(v){ return k/v; }
  if(opt.presets){
    var info=el('span','gs-lab','바깥에서 누르는 압력'); g.ctrl.appendChild(info);
    seg(g.ctrl, opt.presets.map(function(p){ return [p+' 기압',p]; }), 1, function(p){ sim.v=k/p; });
  } else {
    btn(g.ctrl,'◀ 누르기',function(){ sim.v=Math.max(vmin,Math.round((sim.v-step)/step)*step); });
    btn(g.ctrl,'당기기 ▶',function(){ sim.v=Math.min(vmax,Math.round((sim.v+step)/step)*step); });
  }
  spacer(g.ctrl);
  if(showP) speedSeg(g.ctrl,sim);
  btn(g.ctrl,'처음부터',reset);
  // 손잡이 끌기
  var drag=null;
  g.cv.addEventListener('pointerdown',function(e){
    if(opt.presets) return;
    var r=g.cv.getBoundingClientRect(), x=(e.clientX-r.left)/r.width*W, y=(e.clientY-r.top)/r.height*H;
    var hx=px(sim.vx)+ROD;
    if(Math.abs(x-hx)<60 && y>YT-40 && y<YB+40){ drag={dx:x-hx}; g.cv.setPointerCapture(e.pointerId); }
  });
  g.cv.addEventListener('pointermove',function(e){ if(!drag) return;
    var r=g.cv.getBoundingClientRect(), x=(e.clientX-r.left)/r.width*W;
    var v=(x-drag.dx-ROD-TIP)/mlpx; v=Math.max(vmin,Math.min(vmax,v)); sim.v=Math.round(v/step)*step; });
  g.cv.addEventListener('pointerup',function(){ drag=null; });
  var ROD=300;
  function reset(){ sim.v=opt.v0||vmax; sim.vx=sim.v; sim.parts=[]; if(showP) seedBox(sim.parts,opt.n||22,TIP,YT,px(sim.vx),YB); sim.rate.clear(); sim.t=0; }
  sim.tick=function(rdt){
    var dt=rdt*sim.speed; sim.t+=dt;
    sim.vx += (sim.v-sim.vx)*Math.min(1,rdt*2.2);
    if(Math.abs(sim.v-sim.vx)<0.01) sim.vx=sim.v;
    if(showP){
      var X1=px(sim.vx);
      move(sim.parts,dt);
      sim.parts.forEach(function(p){
        if(p.x>X1-R){ p.x=X1-R; if(p.vx>0){ p.vx=-p.vx; sim.arr.add(X1,p.y,1,0,sim.t); sim.rate.add(sim.t);} }
        boxWalls(p,TIP,YT,X1+50,YB,function(w,x,y,nx,ny){ if(w!=='R') sim.arr.add(x,y,nx,ny,sim.t,'rgba(255,59,48,0.55)'); });
      });
      pairs(sim.parts);
    }
    draw();
  };
  function draw(){
    bg(ctx,W,H);
    var X1=px(sim.vx), endX=TIP+LEN+50;
    // 통
    ctx.fillStyle='#FFFFFF'; ctx.fillRect(TIP,YT,endX-TIP,YB-YT);
    ctx.fillStyle= showP ? 'rgba(0,102,204,0.05)' : 'rgba(10,132,255,0.16)'; ctx.fillRect(TIP,YT,X1-TIP,YB-YT);
    if(showP){ sim.parts.forEach(function(p){ drawP(ctx,p); }); }
    else {
      // 공기 기둥 표시
      ctx.save(); ctx.globalAlpha=0.5; ctx.fillStyle='#0A84FF';
      for(var i=0;i<18;i++){ var xx=TIP+12+((i*53)%Math.max(20,(X1-TIP-24))), yy=YT+18+((i*37)%(YB-YT-36)); ctx.beginPath(); ctx.arc(xx,yy,3,0,6.3); ctx.fill(); }
      ctx.restore();
      text(ctx,'공기',(TIP+X1)/2,(YT+YB)/2+10,26,800,'#0B4A8B','center');
    }
    // 피스톤 고무
    ctx.fillStyle='#3A3A3C'; rr(ctx,X1,YT+2,20,YB-YT-4,4); ctx.fill();
    // 막대·손잡이
    ctx.fillStyle='#C7C7CC'; ctx.fillRect(X1+20,(YT+YB)/2-9,ROD-20,18);
    ctx.fillStyle='#8E8E93'; rr(ctx,X1+ROD,YT-30,18,YB-YT+60,6); ctx.fill();
    // 통 테두리
    ctx.strokeStyle='#8E9AAB'; ctx.lineWidth=6;
    ctx.beginPath(); ctx.moveTo(endX,YT-3); ctx.lineTo(TIP-3,YT-3); ctx.lineTo(TIP-3,YB+3); ctx.lineTo(endX,YB+3); ctx.stroke();
    ctx.fillStyle='#8E9AAB'; ctx.fillRect(endX-6,YT-24,8,YB-YT+48);
    // 막힌 끝(꼭지 + 마개)
    ctx.fillStyle='#B8C2CF'; ctx.fillRect(TIP-40,(YT+YB)/2-12,40,24);
    ctx.fillStyle='#FF9500'; rr(ctx,TIP-58,(YT+YB)/2-20,22,40,6); ctx.fill();
    text(ctx,'막음',TIP-47,(YT+YB)/2+46,15,800,'#C46A00','center');
    // 눈금
    for(var m=0;m<=vmax;m+= (vmax>30?10:2)){
      var x=px(m); ctx.strokeStyle='#636366'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(x,YT-3); ctx.lineTo(x,YT-16); ctx.stroke();
      text(ctx,String(m),x,YT-22,15,700,'#636366','center');
    }
    text(ctx,'mL',px(vmax)+26,YT-22,15,800,'#636366','left');
    // 공기 기둥 길이와 밑면
    if(!showP){
      ctx.strokeStyle=RED; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(TIP,YB+26); ctx.lineTo(X1,YB+26); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(TIP,YB+18); ctx.lineTo(TIP,YB+34); ctx.moveTo(X1,YB+18); ctx.lineTo(X1,YB+34); ctx.stroke();
      text(ctx,'공기가 차지하는 길이',(TIP+X1)/2,YB+56,18,800,RED,'center');
    }
    // 손으로 누르는 힘
    var push=P(sim.vx)-P(vmax);
    if(push>0.5 && !opt.presets){ var L=Math.min(130,push*(unit==='kPa'?1.1:40)); arrow(ctx,X1+ROD+18+L+20,(YT+YB)/2,-1,0,L,'#FF9500',1,8); text(ctx,'손으로 누르는 힘',X1+ROD+40,YB+56,17,800,'#C46A00','left'); }
    if(opt.presets){ var pp=P(sim.v); for(var a=0;a<Math.round(pp);a++){ arrow(ctx,X1+ROD+80,(YT+YB)/2-40+a*26,-1,0,50,OUTBLUE,1,6); } text(ctx,'바깥에서 누르는 압력',X1+ROD+10,YB+56,17,800,OUTBLUE,'right'); }
    // 읽기
    if(opt.gauge!==false){
      var rx=24, ry=40;
      ctx.fillStyle='#fff'; rr(ctx,rx,ry,170,96,14); ctx.fill(); ctx.strokeStyle=LINE; ctx.lineWidth=1.5; rr(ctx,rx,ry,170,96,14); ctx.stroke();
      text(ctx,'부피',rx+16,ry+30,17,700,MUTED); text(ctx,(Math.round(sim.vx*10)/10)+' mL',rx+16,ry+72,30,800,BLUE);
      if(!showP){
        ctx.fillStyle='#fff'; rr(ctx,rx,ry+300,170,96,14); ctx.fill(); ctx.strokeStyle=LINE; rr(ctx,rx,ry+300,170,96,14); ctx.stroke();
        text(ctx,'압력',rx+16,ry+330,17,700,MUTED);
        var pv=P(sim.vx); text(ctx,(unit==='kPa'?Math.round(pv):(Math.round(pv*10)/10))+' '+unit,rx+16,ry+372,30,800,RED);
        // 압력계를 막힌 끝에 연결
        ctx.strokeStyle='#B8C2CF'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(TIP-58,(YT+YB)/2); ctx.lineTo(rx+100,(YT+YB)/2); ctx.lineTo(rx+100,ry+300); ctx.stroke();
      }
    }
    if(showP){
      sim.arr.draw(ctx,sim.t,24);
      var r=sim.rate.get(sim.t);
      var bx=24, by=340;
      ctx.fillStyle='#fff'; rr(ctx,bx,by,170,96,14); ctx.fill(); ctx.strokeStyle=LINE; ctx.lineWidth=1.5; rr(ctx,bx,by,170,96,14); ctx.stroke();
      text(ctx,'피스톤에 1초에',bx+16,by+26,16,700,MUTED); text(ctx,'부딪히는 횟수',bx+16,by+46,16,700,MUTED);
      text(ctx,'약 '+r.toFixed(1)+'번',bx+16,by+84,28,800,RED);
      text(ctx,'입자 수',870,70,17,700,MUTED,'center'); text(ctx,sim.parts.length+'개',870,104,28,800,INK,'center');
    }
  }
  sim.reset=reset;
  reset(); draw();
  return sim;
}

/* =====================================================================
   ⑦ 감압 용기 속 풍선 — 안과 밖의 압력이 같아질 때까지
   ===================================================================== */
function jar(host, opt){
  opt=opt||{};
  var W=1000,H=460, g=setup(host,W,H), ctx=g.ctx;
  var JX0=260,JY0=70,JX1=740,JY1=430, CX=500, CY=262;
  var NIN=16, AJ=(JX1-JX0)*(JY1-JY0);
  var sim={speed:0.5,t:0,parts:[],r:120,nOut:34,arr:new Arrows(),fly:[],valveX:CX};
  var RMIN=70, RMAX=172;
  function nOutNow(){ var n=0; sim.parts.forEach(function(p){ if(p.reg===1 && !p.fly) n++; }); return n; }
  function pin(){ return NIN/(Math.PI*sim.r*sim.r); }
  function pout(){ return nOutNow()/(AJ-Math.PI*sim.r*sim.r); }
  btn(g.ctrl,'공기 빼기',function(){ pump(-6); });
  btn(g.ctrl,'공기 넣기',function(){ pump(6); });
  spacer(g.ctrl); speedSeg(g.ctrl,sim); btn(g.ctrl,'처음부터',reset);
  function eqR(n){ var a=AJ*NIN/(NIN+Math.max(0,n)); return Math.max(RMIN,Math.min(RMAX,Math.sqrt(a/Math.PI))); }
  function reset(){
    sim.parts=[]; sim.r=eqR(34);
    // 안쪽
    var t=0, n=NIN; while(n>0&&t<4000){ t++; var a=Math.random()*6.283, d=Math.random()*(sim.r-R-8); var x=CX+Math.cos(a)*d, y=CY+Math.sin(a)*d; if(sim.parts.some(function(q){return Math.hypot(q.x-x,q.y-y)<2*R+2;})&&t<3000) continue; sim.parts.push(particle(x,y,0)); n--; }
    addOut(34);
  }
  function addOut(n){ var t=0; while(n>0&&t<6000){ t++; var x=JX0+R+2+Math.random()*(JX1-JX0-2*R-4), y=JY0+R+2+Math.random()*(JY1-JY0-2*R-4);
      if(Math.hypot(x-CX,y-CY)<sim.r+R+4) continue; if(sim.parts.some(function(q){return Math.hypot(q.x-x,q.y-y)<2*R+2;})&&t<5000) continue; sim.parts.push(particle(x,y,1)); n--; } }
  function pump(d){
    if(d<0){ // 마개 쪽에서 가까운 바깥 입자부터 빼낸다
      var outs=sim.parts.filter(function(p){ return p.reg===1 && !p.fly; }).sort(function(a,b){ return Math.hypot(a.x-sim.valveX,a.y-JY0)-Math.hypot(b.x-sim.valveX,b.y-JY0); });
      outs.slice(0,Math.min(-d,Math.max(0,outs.length-2))).forEach(function(p){ p.fly='out'; });
    } else {
      if(nOutNow()>60) return;
      for(var i=0;i<d;i++){ var p=particle(sim.valveX+(Math.random()-0.5)*20, JY0-40-i*16, 1); p.fly='in'; sim.parts.push(p); }
    }
  }
  sim.tick=function(rdt){
    var dt=rdt*sim.speed; sim.t+=dt;
    // 풍선 크기: 안팎 압력 차이만큼 천천히 변한다
    var diff=pin()-pout();
    sim.r += diff*4e5*dt; sim.r=Math.max(RMIN,Math.min(RMAX,sim.r));
    move(sim.parts,dt);
    for(var i=sim.parts.length-1;i>=0;i--){ var p=sim.parts[i];
      if(p.fly==='out'){ var dx=sim.valveX-p.x, dy=JY0-30-p.y, d=Math.hypot(dx,dy); if(d<8){ sim.parts.splice(i,1); continue; } var s=Math.min(d,380*rdt); p.x+=dx/d*s; p.y+=dy/d*s; continue; }
      if(p.fly==='in'){ var tx=sim.valveX, ty=JY0+R+6; var dx2=tx-p.x, dy2=ty-p.y, d2=Math.hypot(dx2,dy2); if(d2<6){ p.fly=false; var a=Math.PI*(0.2+0.6*Math.random()); p.vx=Math.cos(a)*V; p.vy=Math.sin(a)*V; continue; } var s2=Math.min(d2,300*rdt); p.x+=dx2/d2*s2; p.y+=dy2/d2*s2; continue; }
      var dx3=p.x-CX, dy3=p.y-CY, dd=Math.hypot(dx3,dy3)||1e-6, nx=dx3/dd, ny=dy3/dd;
      if(p.reg===0){ var lim=sim.r-6-R; if(dd>lim){ p.x=CX+nx*lim; p.y=CY+ny*lim; if(p.vx*nx+p.vy*ny>0){ var vn=p.vx*nx+p.vy*ny; p.vx-=2*vn*nx; p.vy-=2*vn*ny; sim.arr.add(CX+nx*(sim.r-6),CY+ny*(sim.r-6),nx,ny,sim.t,RED);} } }
      else { var lo=sim.r+6+R; if(dd<lo){ p.x=CX+nx*lo; p.y=CY+ny*lo; if(p.vx*nx+p.vy*ny<0){ var vn2=p.vx*nx+p.vy*ny; p.vx-=2*vn2*nx; p.vy-=2*vn2*ny; sim.arr.add(CX+nx*(sim.r+6),CY+ny*(sim.r+6),-nx,-ny,sim.t,OUTBLUE);} }
        boxWalls(p,JX0,JY0,JX1,JY1); }
    }
    pairs(sim.parts);
    draw();
  };
  function draw(){
    bg(ctx,W,H);
    ctx.fillStyle='#F4F7FB'; rr(ctx,JX0,JY0,JX1-JX0,JY1-JY0,20); ctx.fill();
    sim.parts.forEach(function(p){ if(p.reg===1) drawP(ctx,p,'#8E8E93'); });
    // 풍선
    ctx.fillStyle='rgba(52,199,89,0.18)'; ctx.beginPath(); ctx.arc(CX,CY,sim.r,0,6.283); ctx.fill();
    sim.parts.forEach(function(p){ if(p.reg===0) drawP(ctx,p); });
    ctx.strokeStyle='#34C759'; ctx.lineWidth=10; ctx.beginPath(); ctx.arc(CX,CY,sim.r,0,6.283); ctx.stroke();
    ctx.fillStyle='#34C759'; ctx.beginPath(); ctx.moveTo(CX-10,CY+sim.r+16); ctx.lineTo(CX+10,CY+sim.r+16); ctx.lineTo(CX,CY+sim.r+2); ctx.closePath(); ctx.fill();
    // 용기
    ctx.strokeStyle='#8E9AAB'; ctx.lineWidth=10; rr(ctx,JX0-5,JY0-5,JX1-JX0+10,JY1-JY0+10,22); ctx.stroke();
    ctx.fillStyle='#636366'; rr(ctx,sim.valveX-22,JY0-24,44,20,6); ctx.fill();
    sim.parts.forEach(function(p){ if(p.fly) drawP(ctx,p,'#8E8E93'); });
    sim.arr.draw(ctx,sim.t,24);
    text(ctx,'감압 용기',JX0+14,JY0-14,17,800,'#636366');
    // 막대
    var a=pin(), b=pout(), M=Math.max(a,b,1e-9)*1.25;
    var bx=24, bw=210;
    text(ctx,'풍선 속 공기',bx,96,19,800,RED); meter(ctx,bx,104,bw,'안에서 미는 힘',a,M,RED);
    text(ctx,'용기 속 공기',bx,214,19,800,'#636366'); meter(ctx,bx,222,bw,'밖에서 미는 힘',b,M,OUTBLUE);
    var same=Math.abs(a-b)/Math.max(a,b)<0.06;
    ctx.fillStyle= same ? '#E8F7EC' : '#FFF4E5'; rr(ctx,bx,322,bw,58,12); ctx.fill();
    text(ctx, same ? '같다 → 풍선이 멈춤' : (a>b ? '안이 더 세다 → 커짐' : '밖이 더 세다 → 작아짐'), bx+bw/2, 358, 18, 800, same?'#1E7F3A':'#B25E00','center');
    // 오른쪽 읽기
    text(ctx,'용기 속 공기 입자',870,110,17,700,MUTED,'center'); text(ctx,nOutNow()+'개',870,146,30,800,'#636366','center');
    text(ctx,'풍선 속 공기 입자',870,220,17,700,MUTED,'center'); text(ctx,NIN+'개',870,256,30,800,INK,'center');
  }
  reset(); draw();
  sim.pin=pin; sim.pout=pout;
  return sim;
}

/* =====================================================================
   단서 ① 바닷속 깊이와 물이 누르는 압력
   ===================================================================== */
function depth(host){
  var W=1000,H=480, g=setup(host,W,H), ctx=g.ctx;
  var SURF=70, BOT=450, MAXD=30, X=430;
  var sim={d:30,dx:30,t:0};
  function y(d){ return SURF+40+(BOT-SURF-110)*d/MAXD; }
  btn(g.ctrl,'▲ 위로 10 m',function(){ sim.d=Math.max(0,sim.d-10); });
  btn(g.ctrl,'▼ 아래로 10 m',function(){ sim.d=Math.min(MAXD,sim.d+10); });
  spacer(g.ctrl);
  g.cv.addEventListener('pointerdown',function(e){ var r=g.cv.getBoundingClientRect(), yy=(e.clientY-r.top)/r.height*H; var d=(yy-SURF-40)/(BOT-SURF-110)*MAXD; sim.d=Math.max(0,Math.min(MAXD,Math.round(d/5)*5)); });
  sim.tick=function(rdt){ sim.t+=rdt; sim.dx+=(sim.d-sim.dx)*Math.min(1,rdt*3); if(Math.abs(sim.dx-sim.d)<0.02) sim.dx=sim.d; draw(); };
  function P(d){ return 1+d/10; }
  function draw(){
    ctx.clearRect(0,0,W,H);
    ctx.fillStyle='#EAF4FF'; ctx.fillRect(0,0,W,SURF);
    var gr=ctx.createLinearGradient(0,SURF,0,H); gr.addColorStop(0,'#5AB8F0'); gr.addColorStop(1,'#0B3D6E'); ctx.fillStyle=gr; ctx.fillRect(0,SURF,W,H-SURF);
    ctx.strokeStyle='#fff'; ctx.lineWidth=3; ctx.beginPath(); for(var x=0;x<=W;x+=20){ ctx.lineTo(x,SURF+Math.sin(x/30+sim.t*2)*3); } ctx.stroke();
    text(ctx,'수면',20,SURF-14,18,800,'#0B4A8B');
    // 깊이 눈금
    for(var d=0;d<=MAXD;d+=10){ var yy=y(d); ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(110,yy); ctx.lineTo(150,yy); ctx.stroke(); text(ctx,d+' m',100,yy+6,18,800,'#fff','right'); }
    // 측정기
    var yy2=y(sim.dx), p=P(sim.dx);
    var n=8, len=16+p*11;
    for(var i=0;i<n;i++){ var a=i/n*6.283; arrow(ctx,X+Math.cos(a)*(34+len),yy2+Math.sin(a)*(34+len),-Math.cos(a),-Math.sin(a),len,'#FFFFFF',0.95,5); }
    ctx.fillStyle='#FFFFFF'; ctx.beginPath(); ctx.arc(X,yy2,30,0,6.283); ctx.fill(); ctx.strokeStyle='#0B4A8B'; ctx.lineWidth=4; ctx.stroke();
    ctx.save(); ctx.translate(X,yy2); ctx.rotate(-2.3+ (p-1)/3*3.2); ctx.strokeStyle=RED; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-22); ctx.stroke(); ctx.restore();
    text(ctx,'압력계',X+34+len+60,yy2-18,17,800,'#fff','left');
    // 읽기
    var rx=640;
    ctx.fillStyle='rgba(255,255,255,0.95)'; rr(ctx,rx,110,320,250,18); ctx.fill();
    text(ctx,'깊이',rx+24,152,19,700,MUTED); text(ctx,Math.round(sim.dx)+' m',rx+24,196,36,800,'#0B4A8B');
    text(ctx,'물이 누르는 압력',rx+24,246,19,700,MUTED); text(ctx,(Math.round(P(sim.dx)*10)/10)+' 기압',rx+24,294,36,800,RED);
    text(ctx,'(수면의 공기가 누르는 1 기압 포함)',rx+24,336,15,700,MUTED);
  }
  draw();
  return sim;
}

/* =====================================================================
   단서 ③ 상자 크기와 벽에 부딪히는 횟수 (10초 동안 세기)
   ===================================================================== */
function count(host){
  var W=1000,H=440, g=setup(host,W,H), ctx=g.ctx;
  var sim={speed:1,t:0,parts:[],size:'S',arr:new Arrows(),counting:false,c:0,ct:0,res:{S:null,L:null}};
  var SZ={S:[400,200,600,400],L:[230,40,770,400]};
  var curB=SZ.S.slice();
  var lab;
  seg(g.ctrl,[['작은 상자','S'],['큰 상자','L']],'S',function(v){ sim.size=v; sim.counting=false; sim.c=0; sim.ct=0; });
  btn(g.ctrl,'10초 동안 세기',function(){ sim.counting=true; sim.c=0; sim.ct=0; });
  spacer(g.ctrl);
  seg(g.ctrl, [['느리게',0.5],['보통',1],['빠르게',1.8]], 1, function(v){ sim.speed=v; });
  function reset(){ sim.parts=[]; seedBox(sim.parts,12,curB[0],curB[1],curB[2],curB[3]); }
  sim.tick=function(rdt){
    var dt=rdt*sim.speed;
    var tg=SZ[sim.size]; for(var i=0;i<4;i++) curB[i]+=(tg[i]-curB[i])*Math.min(1,rdt*3);
    var settled=Math.abs(curB[0]-tg[0])<1;
    sim.t+=dt;
    move(sim.parts,dt);
    sim.parts.forEach(function(p){ boxWalls(p,curB[0],curB[1],curB[2],curB[3],function(w,x,y,nx,ny){ sim.arr.add(x,y,nx,ny,sim.t); if(sim.counting) sim.c++; }); });
    pairs(sim.parts);
    if(sim.counting){ sim.ct+=dt; if(sim.ct>=10){ sim.ct=10; sim.counting=false; sim.res[sim.size]=sim.c; } }
    draw();
  };
  function draw(){
    bg(ctx,W,H);
    ctx.fillStyle='rgba(0,102,204,0.05)'; rr(ctx,curB[0],curB[1],curB[2]-curB[0],curB[3]-curB[1],14); ctx.fill();
    sim.parts.forEach(function(p){ drawP(ctx,p); });
    ctx.strokeStyle='#8E9AAB'; ctx.lineWidth=10; rr(ctx,curB[0]-5,curB[1]-5,curB[2]-curB[0]+10,curB[3]-curB[1]+10,16); ctx.stroke();
    sim.arr.draw(ctx,sim.t,24);
    text(ctx,'입자 수',110,90,18,700,MUTED,'center'); text(ctx,sim.parts.length+'개',110,126,30,800,INK,'center');
    text(ctx,'벽에 부딪힌 횟수',890,90,18,700,MUTED,'center');
    text(ctx,sim.c+'번',890,132,36,800,RED,'center');
    text(ctx,(sim.counting? '세는 중 '+sim.ct.toFixed(1)+'초' : (sim.ct>=10?'10초 끝':'')),890,166,17,800,MUTED,'center');
    text(ctx,'작은 상자: '+(sim.res.S==null?'—':sim.res.S+'번'),890,300,18,800,INK,'center');
    text(ctx,'큰 상자: '+(sim.res.L==null?'—':sim.res.L+'번'),890,334,18,800,INK,'center');
  }
  reset(); draw();
  return sim;
}

return {press:press, box:box, volume:volume, fill:fill, syringe:syringe, jar:jar, depth:depth, count:count, FONT:FONT};
})();
</script>
<script>
(function(){
var host=document.getElementById('host');
var sim=GAS.fill(host);
var prev=performance.now(), on=true;
document.addEventListener('visibilitychange',function(){ on=!document.hidden; prev=performance.now(); });
function loop(now){ var dt=Math.min(0.05,(now-prev)/1000); prev=now; if(on) sim.tick(dt); requestAnimationFrame(loop); }
requestAnimationFrame(loop);
})();
</script>
