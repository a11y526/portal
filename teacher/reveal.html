<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>순위 발표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/design.css">
<link rel="stylesheet" href="../assets/css/site.css">
</head>
<body>
<main class="wrap reveal-wrap">
  <div id="app">
    <!-- 준비 -->
    <section class="reveal-ready" id="ready">
      <div class="ready-top">
        <a class="icon-btn glass lift" href="index.html" aria-label="관리로 돌아가기">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
        </a>
      </div>
      <div class="ready-body rise">
        <span class="glass pill ready-chip" id="ready-class"></span>
        <h1 class="ready-title" id="ready-title">순위 발표</h1>
        <p class="ready-info num" id="ready-info"></p>
        <p class="ready-warn hidden" id="ready-warn"></p>
        <div class="ready-actions">
          <button class="btn btn-primary btn-big press ready-start hidden" id="start" type="button">순위 발표</button>
          <button class="btn btn-danger press ready-cancel hidden" id="unreveal" type="button">발표 취소</button>
        </div>
        <div class="ready-classes hidden" id="ready-classes"></div>
      </div>
    </section>

    <!-- 무대 -->
    <section class="stage hidden" id="stage" aria-live="polite">
      <div class="stage-dim" aria-hidden="true"></div>
      <div class="stage-inner">
        <p class="stage-label" id="stage-label"></p>
        <div class="podium" id="podium"></div>
        <p class="stage-empty hidden" id="stage-empty">통과한 모둠이 없어요</p>
        <ol class="rest hidden" id="rest"></ol>
      </div>
      <div class="stage-ctrl">
        <button class="stage-btn press" id="home" type="button">처음으로</button>
        <button class="stage-btn stage-next press" id="next" type="button">
          다음
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
        </button>
      </div>
    </section>
  </div>
</main>
<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.js"></script>
<script type="module" src="../assets/js/pages/reveal.js"></script>
</body>
</html>
