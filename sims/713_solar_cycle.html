<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>713 흑점 수의 주기적인 변화</title>
<style>
:root{--p:#0066CC;--ink:#1D1D1F;--mut:#6E6E73;--line:#E3E3E8;--pearl:#F5F5F7;
  --font:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;overflow:hidden;font-size:17px}
button{font:700 16px var(--font);color:var(--p);background:#fff;border:1.5px solid var(--p);border-radius:999px;padding:6px 14px;min-height:42px;cursor:pointer;touch-action:manipulation;white-space:nowrap}
button:active{background:#E8F1FB}
button:disabled{opacity:.35;cursor:not-allowed;background:#fff}
button.on{background:var(--p);color:#fff}
.tabs{display:flex;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap;align-items:center}
.tabs button{border-color:#D1D1D6;color:#515154}
.tabs button.on{background:var(--p);border-color:var(--p);color:#fff}
.tabs button .ck{display:inline-block;margin-left:6px;color:#34C759;font-weight:800;visibility:hidden}
.tabs button.done .ck{visibility:visible}
.tabs button.on .ck{color:#fff}
.tabs .tip{margin-left:auto;font-size:15px;font-weight:700;color:var(--mut)}
.stage{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;position:relative}
.stage svg{display:block;max-width:100%;max-height:100%;width:100%;height:100%}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);flex:none}
.seg{display:inline-flex;border:1.5px solid #D1D1D6;border-radius:999px;overflow:hidden;background:#fff}
.seg button{border:0;border-radius:0;color:#515154;padding:6px 12px}
.seg button.on{background:var(--p);color:#fff}
.st{margin-left:auto;font-size:15px;font-weight:700;color:var(--mut)}
.lab{font-size:15px;font-weight:700;color:var(--mut)}
input[type=range]{accent-color:var(--p);height:32px;width:220px;touch-action:none}
svg text{font-family:var(--font)}
.pane{display:none;flex:1;min-height:0;flex-direction:column}
.pane.on{display:flex}
body.ws .playbtn{display:none}
.gap{font:800 19px var(--font);width:46px;height:34px;box-sizing:border-box;text-align:center;border:2px solid var(--p);border-radius:8px;color:var(--ink);background:#fff;padding:0;outline:none}
.gap::placeholder{color:#9EC3EA}
.gap:focus{box-shadow:0 0 0 3px #CFE3F8}
.gap.ok{border-color:#34C759;background:#EAF8EE;color:#1E7A3A}
.gap.bad{border-color:#FF3B30;background:#FFF0EF;animation:sh .3s}
@keyframes sh{25%{transform:translateX(-3px)}75%{transform:translateX(3px)}}
.row{flex:1;min-height:0;display:flex;gap:10px;padding:8px}
.row .stage{padding:0}
#side{flex:0 0 250px;display:flex;flex-direction:column;gap:8px;justify-content:center;padding:4px 6px}
#side p{margin:0}
#sun{width:96px;height:96px}
#t1{font-size:21px;font-weight:800;line-height:1.4}
#t1.fin{color:var(--p)}
#t2{font-size:16px;font-weight:600;color:var(--mut);line-height:1.5}
#pred{display:none;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px;font-size:18px;font-weight:700}
#pred.on{display:flex}
#pmsg{font-size:16px;color:var(--p)}
.btns{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.btns button{min-height:36px;padding:4px 12px;font-size:14px}
.pred{display:inline-flex;gap:6px;align-items:center}
.pred button{border-color:#D1D1D6;color:#1D1D1F}
.pred button.on{background:var(--p);border-color:var(--p);color:#fff}
</style>
</head>
<body>
<div class="row">
<div class="stage" id="st"></div>
<aside id="side">
  <svg id="sun" viewBox="0 0 120 120" aria-hidden="true"></svg>
  <p id="t1"></p><p id="t2"></p>
  <div id="pred"><p class="pq">2024년 다음으로 태양 활동이 활발한 시기는?</p>
    <p><input id="pin" class="gap" style="width:88px" inputmode="numeric" maxlength="4" aria-label="다음 태양 활동이 활발한 시기"> 년</p><p id="pmsg"></p></div>
  <div class="btns"><button id="fillall">모두 채우기</button><button id="rs">처음부터</button></div>
</aside>
</div>
<script>/* 시뮬레이션 공통: 부모 창 신호, 단계형 움직임, 쪽 활성 */
var KIT=(function(){
'use strict';
var NS='http://www.w3.org/2000/svg';
var WS=/ws=/.test(location.hash);           /* 포털 학습지 안: 재생 버튼 없이 ◀ ▶로만 */
if(WS)document.body.classList.add('ws');
var RED=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tell(d){if(window.parent!==window)window.parent.postMessage(d,'*');}
var active=true;
addEventListener('message',function(e){var d=e.data||{};if(d.type==='active'){active=!!d.on;if(active)kick();}});
/* 수업자료 안에서는 방향키를 부모(쪽 넘기기)로 넘긴다 */
addEventListener('keydown',function(e){if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(['ArrowRight','ArrowLeft','PageDown','PageUp',' ','Escape','a','A','f','F'].indexOf(e.key)>=0){tell({type:'simkey',key:e.key,shift:e.shiftKey});}});
function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function T(p,x,y,s,a){var o={x:x,y:y,'font-size':20,fill:'#1D1D1F','font-weight':700};for(var k in a)o[k]=a[k];var e=el('text',o,p);e.textContent=s;return e;}
var ease=function(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
var cl=function(t){return t<0?0:t>1?1:t;};
var seg=function(t,a,b){return ease(cl((t-a)/(b-a)));};
/* 단계형 움직임: steps = 단계별 길이(ms), render(p) */
var list=[],raf=0,last=0;
function motion(bar,steps,render,onEnd){
  bar.innerHTML='<span class="seg"><button data-s="0.6">느리게</button><button data-s="1">보통</button><button class="on" data-s="1.8">빠르게</button></span>'+
    '<button data-a="prev">◀</button><button class="playbtn" data-a="play">재생</button><button data-a="next">▶</button><button data-a="reset">처음부터</button><span class="st"></span>';
  var m={p:0,target:0,playing:false,speed:1.8,steps:steps,N:steps.length,render:render,bar:bar,onEnd:onEnd,ended:false,visible:true};
  bar.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;b.blur();
    if(b.dataset.s){m.speed=+b.dataset.s;[].forEach.call(bar.querySelectorAll('[data-s]'),function(x){x.classList.toggle('on',x===b);});return;}
    var a=b.dataset.a;if(a==='prev')prev(m);else if(a==='next')next(m);else if(a==='play')toggle(m);else if(a==='reset'){m.playing=false;m.p=m.target=0;draw(m);}});
  list.push(m);draw(m);return m;}
function draw(m){m.render(m.p);var st=m.bar.querySelector('.st');st.textContent=Math.min(m.N,Math.floor(m.p+1e-6))+' / '+m.N+'단계';
  var pb=m.bar.querySelector('[data-a="play"]');pb.textContent=m.playing?'일시정지':(m.p>=m.N?'다시 재생':'재생');
  m.bar.querySelector('[data-a="prev"]').disabled=m.playing||m.p<=0;m.bar.querySelector('[data-a="next"]').disabled=m.playing||m.p>=m.N;
  if(m.p>=m.N&&!m.ended){m.ended=true;if(m.onEnd)m.onEnd();}}
function play(m){m.playing=true;if(RED){m.p=m.target;m.playing=false;draw(m);return;}kick();draw(m);}
function next(m){if(m.playing)return;if(m.p<m.target){play(m);return;}if(m.p<m.N){m.target=Math.floor(m.p+1e-6)+1;play(m);}}
function prev(m){if(m.playing)return;m.p=m.target=Math.max(0,Math.ceil(m.p-1e-6)-1);draw(m);}
function toggle(m){if(m.playing){m.playing=false;draw(m);return;}if(m.p>=m.N)m.p=0;m.target=m.N;play(m);}
function goto(m,t){m.target=Math.max(m.target,t);if(m.p<m.target)play(m);}
var tickers=[];
function kick(){if(!raf){last=0;raf=requestAnimationFrame(loop);}}
function loop(now){raf=0;if(!active)return;var dt=last?Math.min(50,now-last):16;last=now;var any=false;
  list.forEach(function(m){if(!m.playing||!m.visible)return;var i=Math.min(Math.floor(m.p),m.N-1);m.p+=dt*m.speed/m.steps[i];
    if(m.p>=m.target){m.p=m.target;m.playing=false;}draw(m);if(m.playing)any=true;});
  tickers.forEach(function(f){if(f(dt))any=true;});
  if(any)raf=requestAnimationFrame(loop);}
function ticker(f){tickers.push(f);}
return {el:el,T:T,ease:ease,cl:cl,seg:seg,tell:tell,motion:motion,next:next,goto:goto,kick:kick,ticker:ticker,WS:WS,RED:RED};
})();
</script>
