<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="리모컨">
<meta name="theme-color" content="#EDF1F7">
<title>리모컨</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/design.css">
<link rel="stylesheet" href="../assets/css/site.css">
</head>
<body>
<main class="wrap rm-wrap">
  <div id="app" class="rm-app">
    <header class="rm-top">
      <h1>리모컨</h1>
      <span class="rm-conn" id="conn">연결 중</span>
    </header>
    <p class="rm-title" id="title"></p>

    <div class="glass rm-off hidden" id="off">
      <strong>수업 모드가 열려 있지 않아요</strong>
    </div>

    <div id="ctl" class="rm-ctl hidden">
      <div class="rm-stats">
        <span class="glass rm-stat"><small>수업자료</small><b class="num" id="st-slide">-</b></span>
        <span class="glass rm-stat"><small>타이머</small><b class="num" id="st-timer">--:--</b></span>
        <span class="glass rm-stat hidden" id="st-sheet-box"><small>학습지 완료</small><b class="num" id="st-sheet">-</b></span>
      </div>

      <!-- 첫 답 창 -->
      <section class="glass-strong rm-card rm-first hidden" id="first">
        <div class="rm-first-h">
          <span class="chip" id="first-badge">첫 답</span>
          <strong id="first-name"></strong>
          <small class="muted" id="first-meta"></small>
        </div>
        <div class="rm-row" id="first-btns"></div>
      </section>

      <!-- 덮개가 닫혀 있을 때: 수업자료 -->
      <section class="rm-lesson" id="lesson">
        <div class="rm-pager">
          <button type="button" class="btn btn-line rm-big press" data-act="prev" id="prev">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
            이전
          </button>
          <button type="button" class="btn btn-primary rm-big press" data-act="next" id="next">
            다음
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
          </button>
        </div>
        <button type="button" class="btn btn-line btn-big press" data-act="answer" id="answer">답 보기 <kbd>A</kbd></button>
        <p class="rm-note hidden" id="other-origin">다른 사이트 수업자료라 쪽을 넘길 수 없어요</p>

        <div class="glass rm-card hidden" id="sheet">
          <h2>학습지</h2>
          <p class="rm-sub" id="sheet-line"></p>
          <div class="rm-row" id="sheet-btns"></div>
          <div class="rm-row">
            <button type="button" class="btn btn-line btn-small press" data-act="open-all" data-confirm="학습지 남은 쪽을 모두 열까요?">남은 쪽 모두 열기 <kbd>W</kbd></button>
            <button type="button" class="btn btn-line btn-small press" data-act="rewind" data-confirm="학습지를 지금 쪽까지로 되돌릴까요? 뒤 쪽은 다시 잠겨요">지금 쪽까지로 <kbd>⇧W</kbd></button>
          </div>
        </div>
      </section>

      <!-- 덮개가 열려 있을 때: 탭 -->
      <section class="glass rm-card hidden" id="cover">
        <h2>모둠활동</h2>
        <div class="rm-tabs" id="tabs">
          <button type="button" class="btn btn-line press" data-act="groups">모둠 <kbd>1</kbd></button>
          <button type="button" class="btn btn-line press" data-act="board">게시판 <kbd>2</kbd></button>
          <button type="button" class="btn btn-line press" data-act="reveal">순위 발표 <kbd>3</kbd></button>
          <button type="button" class="btn btn-line press" data-act="quizshow">퀴즈 쇼 <kbd>4</kbd></button>
        </div>
        <button type="button" class="btn btn-primary btn-big press hidden" data-act="embed-next" id="embed-next">다음</button>
      </section>

      <div class="rm-row">
        <button type="button" class="btn btn-line press rm-grow" data-act="cover" id="cover-btn">모둠활동 열기 <kbd>G</kbd></button>
        <button type="button" class="btn btn-line press" data-act="full" id="full-btn">전체 화면 <kbd>F</kbd></button>
      </div>

      <section class="glass rm-card" id="timer">
        <h2>타이머</h2>
        <div class="rm-timer">
          <button type="button" class="btn btn-line press rm-round" data-act="timer-minus" id="t-minus" aria-label="1분 줄이기">−</button>
          <b class="num rm-time" id="t-time">--:--</b>
          <button type="button" class="btn btn-line press rm-round" data-act="timer-plus" id="t-plus" aria-label="1분 늘리기">+</button>
        </div>
        <div class="rm-row">
          <button type="button" class="btn btn-primary press rm-grow" data-act="timer" id="t-go">시작 <kbd>T</kbd></button>
          <button type="button" class="btn btn-line press" data-act="timer-reset">초기화</button>
        </div>
      </section>
    </div>

    <a class="check-admin" href="index.html">관리</a>
  </div>
</main>
<script type="module" src="../assets/js/pages/remote.js"></script>
</body>
</html>
