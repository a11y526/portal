*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;font-family:var(--font);color:#1D1D1F;word-break:keep-all}
.motion{height:100%;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:0}
.motion svg{display:block;flex:1;width:100%;min-height:0;border-radius:16px}
.mc{display:flex;flex-wrap:wrap;gap:8px;align-items:center;flex:none}
.sl-btn{font:700 16px var(--font);color:#0066CC;background:#fff;border:1.5px solid #0066CC;border-radius:999px;padding:6px 14px;cursor:pointer;min-height:44px;touch-action:manipulation}

.sl-seg{display:inline-flex;border:1.5px solid #D1D1D6;border-radius:999px;overflow:hidden;background:#fff}
.sl-seg .sl-btn{border:0;border-radius:0;color:#515154;padding:6px 13px}
.sl-seg .sl-btn.on{background:#0066CC;color:#fff}
.mc .st{margin-left:auto;font-size:15px;font-weight:700;color:#6E6E73}
svg text{font-family:var(--font)}

<script>
/* 수업자료 lessons/713.html의 움직임과 같은 코드 — 재생 중에는 다음 단계로 넘어가지 않는다 */
(function(){
'use strict';
const NS='http://www.w3.org/2000/svg';
const ID='m4';
const RED=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* 포털 학습지 칸 잠금: 학습지 안(iframe)이면 시작({type:'sim:gate'})·단계·끝(sim:done)을 부모 창에 알린다 */
const tell=d=>{if(window.parent!==window)window.parent.postMessage(d,'*');};
const A=window.L713_ASSETS||{};
const ASSET=k=>A[k]||'';
const motions={};let raf=0,last=0;
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const cl=t=>t<0?0:t>1?1:t;
const seg=(t,a,b)=>ease(cl((t-a)/(b-a)));
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
function T(p,x,y,str,a){const e=el('text',Object.assign({x,y,'font-size':18,fill:'#1D1D1F','font-weight':700},a||{}),p);e.textContent=str;return e;}
function pill(p,x,y,str,fs,col,anchor){const g=el('g',{},p);const w=str.length*fs*.92+fs*1.2;const x0=anchor==='end'?x-w:anchor==='start'?x:x-w/2;
  el('rect',{x:x0,y:y-fs*1.05,width:w,height:fs*1.5,rx:fs*.75,fill:col||'#0066CC',opacity:.94},g);T(g,x0+w/2,y,str,{'text-anchor':'middle','font-size':fs,fill:'#fff'});return g;}
function makeMotion(id,vb,steps,build){
  const box=document.getElementById(id);
  const svg=el('svg',{viewBox:vb,role:'img'},box);
  const bar=document.createElement('div');bar.className='mc';
  bar.innerHTML=`<span class="sl-seg"><button class="sl-btn" data-s="0.6">느리게</button><button class="sl-btn on" data-s="1">보통</button><button class="sl-btn" data-s="1.8">빠르게</button></span>
   <button class="sl-btn" data-a="prev">◀</button><button class="sl-btn" data-a="play">재생</button><button class="sl-btn" data-a="next">▶</button><button class="sl-btn" data-a="reset">처음부터</button><span class="st"></span>`;
  box.appendChild(bar);
  const m={p:0,target:0,playing:false,speed:1,steps,svg,bar,N:steps.length};
  m.render=build(svg,m);
  bar.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.dataset.x)return;b.blur();
    if(b.dataset.s){m.speed=+b.dataset.s;bar.querySelectorAll('[data-s]').forEach(x=>x.classList.toggle('on',x===b));return;}
    ({prev:()=>prev(m),next:()=>next(m),play:()=>toggle(m),reset:()=>{m.playing=false;m.p=m.target=0;draw(m);}})[b.dataset.a]();});
  motions[id]=m;tell({type:'sim:gate'});draw(m);return m;}
function draw(m){m.render(m.p);const n=Math.min(m.N,Math.floor(m.p+1e-6));m.bar.querySelector('.st').textContent=`${n} / ${m.N}단계`;
  if(n!==m.told){m.told=n;tell({type:'sim:progress',n:m.sent?m.N:n,total:m.N});}
  if(n>=m.N&&!m.sent){m.sent=true;tell({type:'sim:done'});}
  m.bar.querySelector('[data-a="play"]').textContent=m.playing?'일시정지':(m.p>=m.N?'다시 재생':'재생');
  m.bar.querySelector('[data-a="prev"]').disabled=m.playing||m.p<=0;m.bar.querySelector('[data-a="next"]').disabled=m.playing||m.p>=m.N;}
function play(m){m.playing=true;if(RED){m.p=m.target;m.playing=false;draw(m);return;}if(!raf){last=0;raf=requestAnimationFrame(loop);}draw(m);}
/* 재생 중에는 단계를 넘기거나 건너뛸 수 없다 — 멈춘 단계는 이어서 재생 */
function next(m){if(m.playing)return;if(m.p<m.target){play(m);return;}if(m.p<m.N){m.target=Math.floor(m.p+1e-6)+1;play(m);}}
function prev(m){if(m.playing)return;m.p=m.target=Math.max(0,Math.ceil(m.p-1e-6)-1);draw(m);}
function toggle(m){if(m.playing){m.playing=false;draw(m);return;}if(m.p>=m.N){m.p=0;}m.target=m.N;play(m);}
function curMotion(){return motions[ID]||null;}
function loop(now){const m=curMotion();if(!m||!m.playing){raf=0;return;}
  const dt=last?Math.min(50,now-last):16;last=now;
  const i=Math.min(Math.floor(m.p),m.N-1);m.p+=dt*m.speed/m.steps[i];
  if(m.p>=m.target){m.p=m.target;m.playing=false;}
  draw(m);raf=m.playing?requestAnimationFrame(loop):0;}
function img(p,k,x,y,w,h,a){return el('image',Object.assign({href:ASSET(k),x,y,width:w,height:h,preserveAspectRatio:'none'},a||{}),p);}
function sunGrad(defs,id){const g=el('radialGradient',{id},defs);[['0','#FFF1B0'],['.6','#FFAA33'],['1','#F05A1A']].forEach(a=>el('stop',{offset:a[0],'stop-color':a[1]},g));}
/* 흑점 확대 사진 속 지구를 가리는 조각(옆 쌀알 무늬로 덮음) */
function zoomDisc(p,defs,id,cx,cy,r){const k=r/289;const c=el('clipPath',{id:id+'c'},defs);el('circle',{cx,cy,r},c);
  const g=el('g',{'clip-path':`url(#${id}c)`},p);const x0=cx-289*k,y0=cy-289*k;
  img(g,'zoom',x0,y0,578*k,578*k);
  const pc=el('clipPath',{id:id+'p'},defs);el('circle',{cx:x0+461*k,cy:y0+444*k,r:44*k},pc);
  const pg=el('g',{'clip-path':`url(#${id}p)`},g);img(pg,'zoom',x0+130*k,y0,578*k,578*k);return g;}


function eclipse(host,cor,id,onCover){
  var s=el('svg',{viewBox:'0 0 787 654',role:'img','aria-label':'검은 원으로 광구를 가려 태양의 대기 관찰하기'},host);
  var d=el('defs',{},s);
  var rg=el('radialGradient',{id:id+'sun'},d);[['0','#FFFFFF'],['.7','#FFF8DF'],['1','#FFE08A']].forEach(function(a){el('stop',{offset:a[0],'stop-color':a[1]},rg);});
  var gg=el('radialGradient',{id:id+'glow'},d);[['0','#FFFFFF','1'],['.45','#FFF6D0','.95'],['1','#FFF6D0','0']].forEach(function(a){el('stop',{offset:a[0],'stop-color':a[1],'stop-opacity':a[2]},gg);});
  var bl=el('filter',{id:id+'bl',x:'-20%',y:'-20%',width:'140%',height:'140%'},d);el('feGaussianBlur',{stdDeviation:3},bl);
  var c=el('clipPath',{id:id+'c'},d);el('rect',{x:0,y:0,width:787,height:654,rx:18},c);
  var r=el('g',{'clip-path':'url(#'+id+'c)'},s);
  el('rect',{x:0,y:0,width:787,height:654,fill:'#000'},r);
  var co=el('image',{href:cor,x:0,y:0,width:787,height:654,preserveAspectRatio:'none'},r);
  /* 사진 속 채층은 가장자리 일부만 붉게 보여서, 붉은 고리를 덧그려 색을 분명히 한다 */
  var ch=el('g',{},r);
  el('circle',{cx:371,cy:328,r:216,fill:'none',stroke:'#FF2D55','stroke-width':16,filter:'url(#'+id+'bl)'},ch);
  el('circle',{cx:371,cy:328,r:213,fill:'none',stroke:'#FF4F73','stroke-width':6},ch);
  var glow=el('circle',{cx:371,cy:328,r:520,fill:'url(#'+id+'glow)'},r);
  el('circle',{cx:371,cy:328,r:208,fill:'url(#'+id+'sun)'},r);
  var MX0=-30,MY0=330,mx=MX0,my=MY0;
  var mg=el('g',{style:'cursor:grab;touch-action:none'},r);
  var mo=el('circle',{cx:0,cy:0,r:211,fill:'#000'},mg);
  var edge=el('circle',{cx:0,cy:0,r:211,fill:'none',stroke:'#8E8E93','stroke-width':3,'stroke-dasharray':'10 8'},mg);
  var hint=T(mg,115,12,'끌어 보자 ▶',{'text-anchor':'middle',fill:'#fff','font-size':30});
  function call(x1,y1,x2,y2,str,anc){var g=el('g',{style:'transition:opacity .6s;opacity:0'},r);
    el('line',{x1:x1,y1:y1,x2:x2,y2:y2,stroke:'#fff','stroke-width':3},g);
    T(g,x2+(anc==='end'?-10:10),y2+10,str,{'text-anchor':anc||'start',fill:'#fff','font-size':34});return g;}
  var lc=call(180,180,80,80,'코로나'),lh=call(222,480,120,590,'채층','end');
  lh.querySelector('text').setAttribute('x',30);lh.querySelector('text').setAttribute('text-anchor','start');
  var covered=false;
  function draw(){
    mg.setAttribute('transform','translate('+mx+' '+my+')');
    var dd=Math.sqrt((mx-371)*(mx-371)+(my-328)*(my-328));
    /* 광구가 조금이라도 드러나 있으면 강한 빛에 대기가 묻힌다 */
    glow.setAttribute('opacity',cl((dd-4)/26));
    co.setAttribute('opacity',.04+.96*(1-cl(dd/30)));
    ch.setAttribute('opacity',1-cl(dd/10));
    var cv=dd<1;edge.setAttribute('opacity',cv?0:1);hint.setAttribute('opacity',cv||Math.abs(mx-MX0)>40?0:1);
    lc.style.opacity=cv?1:0;lh.style.opacity=cv?1:0;
    if(cv!==covered){covered=cv;if(onCover)onCover(cv);}}
  function pt(e){var p=s.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(s.getScreenCTM().inverse());}
  var drag=null;
  mg.addEventListener('pointerdown',function(e){var p=pt(e);drag={x:p.x-mx,y:p.y-my};mg.setPointerCapture(e.pointerId);mg.style.cursor='grabbing';e.preventDefault();});
  mg.addEventListener('pointermove',function(e){if(!drag)return;var p=pt(e);
    mx=Math.max(-150,Math.min(937,p.x-drag.x));my=Math.max(-100,Math.min(754,p.y-drag.y));
    if(Math.abs(mx-371)<40&&Math.abs(my-328)<40){mx=371;my=328;}draw();});
  /* 놓았을 때 가까우면 광구에 딱 맞춘다 */
  function up(){drag=null;mg.style.cursor='grab';if(Math.abs(mx-371)<70&&Math.abs(my-328)<70){mx=371;my=328;draw();}}
  mg.addEventListener('pointerup',up);mg.addEventListener('pointercancel',up);
  draw();
  return {svg:s,root:r,reset:function(){mx=MX0;my=MY0;draw();}};
}
(function(){const box=document.getElementById('m4');tell({type:'sim:gate'});let sent=false;const E=eclipse(box,ASSET('corona'),'e4',cv=>{if(cv&&!sent){sent=true;tell({type:'sim:done'});}});
  const bar=document.createElement('div');bar.className='mc';bar.innerHTML='<button class="sl-btn">처음 위치로</button>';box.appendChild(bar);
  bar.querySelector('button').onclick=e=>{E.reset();e.target.blur();};})();


})();
</script>
