<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>상점 신규 꾸미기 시안</title>
<style>
  :root {
    --bg: #EDF1F7;
    --ink: #0B1220;
    --ink-2: #3E4756;
    --accent: #2457E6;
    --accent-hover: #1A43B8;
    --accent-tint: rgba(36,87,230,.10);
    --gold: #D19A00;
    --r-xl: 36px; --r-lg: 28px; --r-md: 22px; --r-sm: 14px; --r-pill: 999px;
    --glass-bg: rgba(255,255,255,.68);
    --glass-strong-bg: rgba(255,255,255,.84);
    --glass-border: rgba(255,255,255,.85);
    --shadow: 0 12px 32px rgba(28,39,76,.10);
    --shadow-strong: 0 18px 40px rgba(28,39,76,.14);
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    overflow-x: hidden;
  }
  .num { font-variant-numeric: tabular-nums; }
  .glass {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.95);
  }
  .glass-strong {
    background: var(--glass-strong-bg);
    border: 1px solid rgba(255,255,255,.92);
    box-shadow: var(--shadow-strong), inset 0 1px 0 #fff;
  }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    min-height: 38px; padding: 0 14px; border: 0; border-radius: var(--r-pill);
    font: inherit; font-size: 13.5px; font-weight: 700; cursor: pointer;
    transition: transform .15s;
  }
  .btn:active { transform: scale(.97); }
  .btn-primary { background: var(--accent); color: #fff; box-shadow: 0 8px 20px rgba(36,87,230,.3); }
  .btn-line { background: rgba(255,255,255,.8); color: var(--ink); border: 1px solid rgba(78,88,104,.22); }
  .chip { display: inline-flex; align-items: center; padding: 4px 11px; border-radius: var(--r-pill); font-size: 12px; font-weight: 800; background: var(--accent-tint); color: var(--accent); }
  .tag-off { display: inline-flex; align-items: center; padding: 4px 11px; border-radius: var(--r-pill); font-size: 12px; font-weight: 700; background: rgba(78,88,104,.12); color: var(--ink-2); }

  .s-wrap { max-width: 1140px; margin: 0 auto; padding: 28px 20px 72px; display: flex; flex-direction: column; gap: 24px; }
  .s-top { display: flex; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; gap: 12px; }
  .s-top h1 { margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -.03em; }
  .s-top p { margin: 4px 0 0; font-size: 14px; color: var(--ink-2); }

  /* 조합 스튜디오 */
  .studio { border-radius: var(--r-lg); padding: 22px 24px; display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 24px; align-items: center; }
  .studio-stage { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .studio-av { width: 200px; height: 200px; display: grid; place-items: center; }
  .studio-sizes { display: flex; align-items: flex-end; gap: 12px; }
  .studio-sizes figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; font-weight: 700; color: var(--ink-2); }
  .studio-ctrl { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .studio-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
  .studio-head h2 { margin: 0; font-size: 18px; font-weight: 900; }
  .studio-picks { display: grid; grid-template-columns: repeat(auto-fill, minmax(145px, 1fr)); gap: 8px; }
  .pick-col { display: flex; flex-direction: column; gap: 4px; background: rgba(255,255,255,.65); padding: 8px 10px; border-radius: 14px; border: 1px solid rgba(78,88,104,.15); }
  .pick-col label { font-size: 12px; font-weight: 900; color: var(--ink-2); display: flex; align-items: center; gap: 5px; }
  .pick-col label .new-dot { padding: 1px 6px; border-radius: 999px; background: var(--accent-tint); color: var(--accent); font-size: 10px; }
  .pick-col select { height: 34px; border-radius: 9px; border: 1px solid rgba(78,88,104,.22); background: #fff; padding: 0 6px; font: inherit; font-size: 12.5px; font-weight: 700; color: var(--ink); }

  /* 탭 & 그리드 */
  .cat-bar { display: flex; flex-wrap: wrap; gap: 6px; }
  .cls-tab { min-height: 38px; padding: 0 14px; border-radius: var(--r-pill); border: 1px solid rgba(78,88,104,.2); background: rgba(255,255,255,.7); font: inherit; font-size: 13.5px; font-weight: 800; color: var(--ink); cursor: pointer; }
  .cls-tab.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .cat-sec { display: flex; flex-direction: column; gap: 12px; }
  .cat-head { display: flex; align-items: center; gap: 10px; }
  .cat-head h2 { margin: 0; font-size: 20px; font-weight: 900; letter-spacing: -.02em; }
  .s-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 14px; }
  .s-card { position: relative; overflow: hidden; border-radius: 24px; padding: 16px 12px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; cursor: pointer; border: 2px solid rgba(78,88,104,.16); transition: transform .2s var(--ease), box-shadow .2s; }
  .s-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-strong); }
  .s-card.r-rare { border-color: rgba(36,87,230,.55); }
  .s-card.r-legend { border-color: var(--gold); isolation: isolate; }
  @keyframes shine-x { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }
  .s-card.r-legend::after { content: ""; position: absolute; inset: 0; z-index: -1; pointer-events: none;
    background: linear-gradient(110deg, transparent 20%, rgba(255,255,255,.75) 50%, transparent 80%);
    transform: translateX(-100%); animation: shine-x 3.2s ease-in-out infinite; }
  .s-card.is-on { outline: 3px solid var(--accent); outline-offset: -2px; background: rgba(255,255,255,.95); }
  .shop-rarity { position: absolute; top: 8px; right: 8px; padding: 2px 8px; border-radius: var(--r-pill); font-size: 11px; font-weight: 900; background: var(--accent-tint); color: var(--accent); }
  .r-legend .shop-rarity { background: rgba(209,154,0,.18); color: #8A6400; }
  .s-name { font-size: 15px; font-weight: 900; }
  .s-desc { font-size: 12px; color: var(--ink-2); text-align: center; line-height: 1.38; min-height: 2.7em; }
  .s-meta { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; font-weight: 800; color: var(--ink); }
  .s-sizes { display: flex; align-items: flex-end; gap: 8px; padding-top: 6px; border-top: 1px dashed rgba(78,88,104,.18); width: 100%; justify-content: center; }

  /* 캐릭터 기본 & 신규 부품 모션 */
  .av { transform-origin: center bottom; }
  .av g { transform-box: fill-box; transform-origin: center bottom; }
  @keyframes av-breathe { 0%,100% { transform: translateY(0) scaleY(1); } 50% { transform: translateY(-1.2%) scaleY(1.01); } }
  .av-live { animation: av-breathe 3s ease-in-out infinite; }

  @keyframes fx-spin     { to { transform: rotate(360deg); } }
  @keyframes fx-spin-rev { to { transform: rotate(-360deg); } }
  @keyframes fx-float    { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4.5px); } }
  @keyframes fx-pulse    { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.16); } }
  @keyframes fx-flame    { 0%, 100% { transform: scaleY(1) skewX(0deg); } 50% { transform: scaleY(1.09) skewX(-3deg); } }
  @keyframes fx-twinkle  { 0%, 100% { opacity: .35; transform: scale(.82); } 50% { opacity: 1; transform: scale(1.18); } }
  @keyframes fx-rise     { 0% { opacity: 0; transform: translateY(5px) scale(.8); } 35% { opacity: 1; } 100% { opacity: 0; transform: translateY(-12px) scale(1.1); } }
  @keyframes fx-meteor   { 0% { opacity: 0; transform: translate(6px, -6px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translate(-10px, 10px); } }
  @keyframes fx-wave     { 0% { opacity: .95; transform: scale(.75); } 100% { opacity: 0; transform: scale(1.35); } }
  @keyframes fx-wobble   { 0%, 100% { transform: rotate(-6deg); } 50% { transform: rotate(8deg); } }
  @keyframes fx-scan     { 0%, 100% { transform: translateY(-3px); opacity: .55; } 50% { transform: translateY(3px); opacity: 1; } }

  .av-live .fx-spin      { transform-origin: center; animation: fx-spin 9s linear infinite; }
  .av-live .fx-spin-slow { transform-origin: center; animation: fx-spin 16s linear infinite; }
  .av-live .fx-spin-rev  { transform-origin: center; animation: fx-spin-rev 9s linear infinite; }
  .av-live .fx-float     { transform-origin: center; animation: fx-float 2.4s ease-in-out infinite; animation-delay: var(--d, 0s); }
  .av-live .fx-pulse     { transform-origin: center; animation: fx-pulse 1.5s ease-in-out infinite; animation-delay: var(--d, 0s); }
  .av-live .fx-flame     { transform-origin: center bottom; animation: fx-flame 1.1s ease-in-out infinite; animation-delay: var(--d, 0s); }
  .av-live .fx-twinkle   { transform-origin: center; animation: fx-twinkle 1.6s ease-in-out infinite; animation-delay: var(--d, 0s); }
  .av-live .fx-rise      { transform-origin: center; animation: fx-rise 2.4s ease-in infinite; animation-delay: var(--d, 0s); }
  .av-live .fx-meteor    { transform-origin: center; animation: fx-meteor 2.4s ease-in-out infinite; animation-delay: var(--d, 0s); }
  .av-live .fx-wave      { transform-origin: center; animation: fx-wave 1.8s ease-out infinite; animation-delay: var(--d, 0s); }
  .av-live .fx-wobble    { transform-origin: center; animation: fx-wobble 1.4s ease-in-out infinite; animation-delay: var(--d, 0s); }
  .av-live .fx-scan      { transform-origin: center; animation: fx-scan 2s ease-in-out infinite; }

  .lite .av, .lite .av g, .lite .s-card.r-legend::after { animation: none !important; }

  @media (max-width: 720px) {
    .studio { grid-template-columns: 1fr; justify-items: center; }
  }
</style>
</head>
<body>
<main class="s-wrap">
  <header class="s-top">
    <div>
      <h1>상점 신규 꾸미기 시안</h1>
      <p>카드를 클릭하면 위 캐릭터에 즉시 착용되며, 200px · 96px · 48px · 40px 크기별 모습을 함께 확인합니다.</p>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button type="button" class="btn btn-line" id="btn-lite">저사양(.lite) 비교</button>
      <button type="button" class="btn btn-primary" id="btn-rand">무작위 화려한 조합</button>
    </div>
  </header>

  <section class="studio glass-strong">
    <div class="studio-stage">
      <div class="studio-av" id="studio-av"></div>
      <div class="studio-sizes" id="studio-sizes"></div>
    </div>
    <div class="studio-ctrl">
      <div class="studio-head">
        <h2>9개 슬롯 동시 조합 테스트</h2>
        <button type="button" class="btn btn-line" id="btn-reset">기본값으로</button>
      </div>
      <div class="studio-picks" id="studio-picks"></div>
    </div>
  </section>

  <nav class="cat-bar" id="cat-bar"></nav>
  <div id="sections" style="display:flex;flex-direction:column;gap:28px"></div>
</main>

<script>
  const INK = '#15171C';
  const PAPER = '#fff';
  const PALETTE = {
    accent: '#2457E6',
    sky:    '#6EA8FF',
    gold:   '#D19A00',
    goldL:  '#FFE07D',
    mint:   '#0F8A5F',
    mintL:  '#6FE3C8',
    violet: '#6D4FD8',
    violetL:'#B79CFF',
    coral:  '#C2410C',
    coralL: '#FF7A45',
  };

  let seq = 0;
  const lite = () => document.documentElement.classList.contains('lite');

  function makeKit(size) {
    const id = 'av' + (++seq).toString(36);
    const cellPx = lite() ? 4.2 : Math.min(4.2, Math.max(2.4, size / 50));
    return {
      id,
      cell: (cellPx * 120) / size,
      sw: Math.max(2.4, (1.3 * 120) / size),
      detail: size >= 64,
      ink: INK,
      paper: PAPER,
      ...PALETTE,
      L: `url(#${id}-l)`,
      M: `url(#${id}-m)`,
      D: `url(#${id}-d)`,
    };
  }

  function patterns(k) {
    const c = +k.cell.toFixed(3);
    const dot = (name, r) =>
      `<pattern id="${k.id}-${name}" patternUnits="userSpaceOnUse" width="${c}" height="${c}" patternTransform="rotate(45)">` +
      `<rect width="${c}" height="${c}" fill="${PAPER}"/>` +
      `<circle cx="${c / 2}" cy="${c / 2}" r="${(c * r).toFixed(3)}" fill="${INK}"/></pattern>`;
    return dot('l', k.detail ? 0.17 : 0.11) + dot('m', 0.3) + dot('d', 0.48);
  }

  const sw = (k, w = 1) => `stroke="${INK}" stroke-width="${(k.sw * w).toFixed(2)}"`;
  const line = (k, d, w = 1) => `<path d="${d}" fill="none" stroke="${k.ink}" stroke-width="${(k.sw * w).toFixed(2)}"/>`;
  const shape = (k, d, fill, w = 1) => `<path d="${d}" fill="${fill}" stroke="${k.ink}" stroke-width="${(k.sw * w).toFixed(2)}"/>`;
  const spark = (x, y, r, fill, cls = '', delay = 0) =>
    `<path ${cls ? `class="${cls}" style="--d:${delay}s"` : ''} d="M${x} ${y - r} Q${x} ${y} ${x + r} ${y} Q${x} ${y} ${x} ${y + r} Q${x} ${y} ${x - r} ${y} Q${x} ${y} ${x} ${y - r} Z" fill="${fill}"/>`;
  const star5 = (x, y, R, r) => 'M' + Array.from({ length: 10 }, (_, i) => {
    const a = -Math.PI / 2 + (i * Math.PI) / 5, d = i % 2 ? r : R;
    return `${(x + d * Math.cos(a)).toFixed(2)} ${(y + d * Math.sin(a)).toFixed(2)}`;
  }).join(' L') + ' Z';
  const blob = (k, circles, fill) =>
    `<g fill="${k.ink}" stroke="${k.ink}" stroke-width="${(k.sw * 2).toFixed(2)}">` +
    circles.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}"/>`).join('') +
    `</g><g fill="${fill}">` +
    circles.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r}"/>`).join('') +
    `</g>`;
  const FLAT = 'transform-box:view-box;transform-origin:0 0';
  const BG_BASE = (k) => `<circle cx="60" cy="60" r="58" fill="${k.L}" opacity=".5"/>`;
  const TEE = 'M18 124 C18 102 30 91.5 47 88 C51 94.5 69 94.5 73 88 C90 91.5 102 102 102 124 Z';

  const BASE_DEFAULTS = {
    face: {
      face_round: {
        name: '둥근',
        d: 'M60 29.5 C74 29.5 85 40.5 85 54 C85 67.5 74 78.5 60 78.5 C46 78.5 35 67.5 35 54 C35 40.5 46 29.5 60 29.5 Z',
        ears: [[35.5, 57], [84.5, 57]],
      }
    },
    hair: {
      hair_short: {
        name: '짧은',
        front: (k) =>
          shape(k, 'M34.5 57 C31 37 42 21.5 60 21.5 C78 21.5 89 37 85.5 57 C84 50 82.5 45.5 79 42.5 C75 44 70 44 66.5 41 C63 43.5 57 44 53 40.5 C49 43.5 43 44 39.5 42.5 C37 46 35.5 51 34.5 57 Z', k.D) +
          (k.detail ? line(k, 'M61 25 C57 29 54.5 33 53.5 37.5 M72 27.5 C70 31.5 68.5 35 67 38.5', 0.6) : ''),
      }
    },
    eyes: {
      eyes_round: {
        name: '동그란',
        draw: (k) => [50, 70].map((x) =>
          `<ellipse cx="${x}" cy="55" rx="4.8" ry="5.8" fill="${k.ink}"/>` +
          (k.detail ? `<circle cx="${x - 1.6}" cy="52.9" r="1.7" fill="${k.paper}"/><circle cx="${x + 1.7}" cy="57.3" r=".8" fill="${k.paper}"/>` : '')).join(''),
      }
    },
    mouth: {
      mouth_smile: {
        name: '미소',
        draw: (k) => line(k, 'M54.5 66 Q60 71.5 65.5 66', 1),
      }
    },
    outfit: {
      outfit_tee: {
        name: '티셔츠',
        draw: (k) =>
          shape(k, TEE, k.M) +
          shape(k, 'M47 88 C51 94.5 69 94.5 73 88 L70.8 87.4 C67.5 91.6 52.5 91.6 49.2 87.4 Z', k.paper, 0.7),
      }
    },
    acc: {
      acc_none: { name: '없음' }
    },
    bg: {
      bg_circle: { name: '연한 원', draw: (k) => BG_BASE(k) }
    }
  };

  const NEW_PARTS = {
    hair: {
      hair_flame: {
        name: '플라즈마 불꽃 머리', tier: 'legend', price: 300, lv: 5,
        desc: '하프톤 불꽃 헤어 안쪽에 코랄·금빛 플라즈마 코어가 일렁입니다',
        front: (k) =>
          `<g class="fx-flame">` +
          shape(k, 'M34 55 C30 41 33 29 39 23 L35 13 L46 18 L51 6 L59 15 L65 4 L71 16 L82 10 L79 22 C86 28 89 40 86 55 C83 46 79 41 74 39 C68 42 63 41 60 37 C56 41 50 42 45 39 C40 41 37 46 34 55 Z', k.D) +
          shape(k, 'M43 32 L42 20 L51 25 L56 13 L62 22 L67 12 L72 24 L78 19 L76 32 C70 35 50 35 43 32 Z', k.coralL, 0.75) +
          (k.detail ? `<path d="M50 30 L55 18 L60 26 L65 17 L69 30 Z" fill="${k.gold}"/>` : '') +
          `</g>` +
          spark(33, 18, k.detail ? 3.5 : 4.5, k.gold, 'fx-twinkle', 0.1) +
          spark(86, 16, k.detail ? 3.5 : 4.5, k.coralL, 'fx-twinkle', 0.5),
      },
      hair_zero_g: {
        name: '무중력 우주 머리', tier: 'rare', price: 90, lv: 1,
        desc: '무중력 공간처럼 둥실 떠오르는 머리결과 파란 별빛 입자',
        ears: false,
        back: (k) =>
          `<g class="fx-float">` +
          shape(k, 'M30 56 C22 42 20 24 29 14 C34 22 37 28 38 34 C42 18 52 12 60 12 C68 12 78 18 82 34 C83 28 86 22 91 14 C100 24 98 42 90 56 L95 76 C88 78 83 72 81 64 L39 64 C37 72 32 78 25 76 Z', k.D) +
          `</g>`,
        front: (k) =>
          shape(k, 'M34.5 54 C33 34 44 23 60 23 C76 23 87 34 85.5 54 C83 46 79 41 74 39 C68 42 52 42 46 39 C41 41 37 46 34.5 54 Z', k.D) +
          `<circle class="fx-twinkle" style="--d:.1s" cx="27" cy="24" r="2.2" fill="${k.sky}" ${sw(k, 0.5)}/>` +
          `<circle class="fx-twinkle" style="--d:.6s" cx="93" cy="24" r="2.2" fill="${k.sky}" ${sw(k, 0.5)}/>` +
          spark(60, 16, k.detail ? 4 : 5, k.accent, 'fx-twinkle', 0.3),
      },
      hair_neon: {
        name: '사이버 네온 브릿지', tier: 'rare', price: 100, lv: 1,
        desc: '샤프한 비대칭 컷 사이로 민트·블루 네온 브릿지가 빛납니다',
        front: (k) =>
          shape(k, 'M34 56 C31 36 42 21 60 21 C78 21 89 36 86 56 C84 48 81 42 76 39 L71 45 L67 38 L56 46 L53 38 C45 40 38 46 34 56 Z', k.D) +
          `<g class="fx-twinkle">` +
          shape(k, 'M46 27 L55 25 L51 35 L58 34 L48 45 L50 36 L44 37 Z', k.mintL, 0.7) +
          shape(k, 'M66 25 L74 28 L69 36 L75 37 L65 45 L67 37 L63 36 Z', k.sky, 0.7) +
          `</g>`,
      },
      hair_cloud: {
        name: '구름 솜사탕 머리', tier: 'rare', price: 110, lv: 1,
        desc: '몽글몽글한 밝은 망점 구름 헤어를 따라 별사탕 방울이 통통 튑니다',
        ears: false,
        front: (k) =>
          blob(k, [
            [35, 50, 7], [34, 39, 8.5], [41, 29, 9.5], [52, 23, 10], [65, 23, 10],
            [77, 28, 9.5], [85, 38, 8.5], [85, 50, 7], [46, 36, 7.5], [58, 34, 8], [71, 36, 7.5]
          ], k.L) +
          `<g class="fx-float" style="--d:0s"><circle cx="28" cy="27" r="3.4" fill="${k.violetL}" ${sw(k, 0.7)}/></g>` +
          `<g class="fx-float" style="--d:.5s"><circle cx="91" cy="26" r="3.4" fill="${k.goldL}" ${sw(k, 0.7)}/></g>` +
          `<g class="fx-float" style="--d:1s"><circle cx="60" cy="12" r="3" fill="${k.sky}" ${sw(k, 0.7)}/></g>`,
      },
      hair_volt: {
        name: '번개 삐죽 머리', tier: 'legend', price: 270, lv: 4,
        desc: '초전도 에너지로 솟은 머리카락 주위에 황금 스파크가 찌릿거립니다',

  function drawFace(k, f, ears) {
    let s = '';
    if (ears) {
      s += f.ears.map(([x, y]) =>
        `<ellipse cx="${x}" cy="${y}" rx="4.6" ry="6" fill="${k.L}" ${sw(k)}/>` +
        (k.detail ? `<path d="M${x + (x < 60 ? 1 : -1)} ${y - 2.5} q${x < 60 ? -2 : 2} 2.5 0 5" fill="none" ${sw(k, 0.5)}/>` : '')
      ).join('');
    }
    s += `<clipPath id="${k.id}-fc"><path d="${f.d}"/></clipPath>`;
    s += `<path d="${f.d}" fill="${k.M}"/>`;
    s += `<g clip-path="url(#${k.id}-fc)"><path d="${f.d}" fill="${k.L}" transform="translate(-4.5 -4)"/></g>`;
    if (k.detail) {
      const hatch = (cx) => [0, 1, 2].map((i) => {
        const x = cx - 3.2 + i * 2.8;
        return `M${x.toFixed(1)} 65.4 L${(x + 1.6).toFixed(1)} 62`;
      }).join(' ');
      s += `<path d="${hatch(43)} ${hatch(77)}" fill="none" ${sw(k, 0.5)}/>`;
    }
    s += `<path d="${f.d}" fill="none" ${sw(k)}/>`;
    return s;
  }

  function renderAvatarSVG(av, size = 96, { live = false } = {}) {
    const a = { ...DEFAULTS, ...av };
    const k = makeKit(size);
    const P = (slot) => ALL_PARTS[slot]?.[a[slot]] || ALL_PARTS[slot]?.[DEFAULTS[slot]];
    const face = P('face'), hair = P('hair'), hat = P('hat'), eyes = P('eyes'), mouth = P('mouth');
    const outfit = P('outfit'), acc = P('acc'), pet = P('pet'), aura = P('aura'), bg = P('bg');
    const call = (fn) => (fn ? fn(k) : '');
    const clip = `M-30 -40 H150 V60 H118 A58 58 0 0 1 2 60 H-30 Z`;

    return `<svg class="av${live ? ' av-live' : ''}" viewBox="0 0 120 120" width="${size}" height="${size}" overflow="visible" stroke-linejoin="round" stroke-linecap="round">` +
      `<defs>${patterns(k)}<clipPath id="${k.id}-clip"><path d="${clip}"/></clipPath></defs>` +
      `<g class="av-bg">${call(bg.draw)}</g>` +
      `<g class="av-aura">${call(aura.draw)}</g>` +
      `<g clip-path="url(#${k.id}-clip)">` +
        `<g class="av-body">${call(outfit.behind)}${drawNeck(k)}${call(outfit.draw)}${acc.layer === 'body' ? call(acc.draw) : ''}</g>` +
      `</g>` +
      `<g class="av-head">` +
        call(hair.back) +
        drawFace(k, face, hair.ears !== false) +
        `<g class="av-eyes">${call(eyes.draw)}</g>` +
        call(mouth.draw) +
        call(hair.front) +
        (acc.layer !== 'body' ? call(acc.draw) : '') +
        call(hat.draw) +
      `</g>` +
      `<g class="av-pet" style="${FLAT}" transform="translate(97 33) scale(1.5) translate(-101 -32)">${call(pet.draw)}</g>` +
      `</svg>`;
  }

    document.getElementById('studio-av').innerHTML = renderAvatarSVG(current, 196, { live: true });
    document.getElementById('studio-sizes').innerHTML = [96, 48, 40].map((sz) =>
      `<figure>${renderAvatarSVG(current, sz, { live: false })}<figcaption>${sz}px</figcaption></figure>`
    ).join('');

    document.getElementById('studio-picks').innerHTML = SLOT_INFO.map(([slot, label, isNew]) => {
      const entries = Object.entries(NEW_PARTS[slot]).filter(([id]) => !id.endsWith('_none'));
      const defId = DEFAULTS[slot];
      const defName = ALL_PARTS[slot][defId]?.name || '기본';
      return `
        <div class="pick-col">
          <label>${label}${isNew ? '<span class="new-dot">신규</span>' : ''}</label>
          <select data-slot="${slot}">
            <option value="${defId}" ${current[slot] === defId ? 'selected' : ''}>기본 (${defName})</option>
            ${entries.map(([id, it]) => `<option value="${id}" ${current[slot] === id ? 'selected' : ''}>[${TIER_NAME[it.tier]}] ${it.name}</option>`).join('')}
          </select>
        </div>`;
    }).join('');

    document.querySelectorAll('.s-card[data-slot]').forEach((card) => {
      card.classList.toggle('is-on', current[card.dataset.slot] === card.dataset.id);
    });
  }

  function renderCatalog() {
    document.getElementById('cat-bar').innerHTML =
      `<button type="button" class="cls-tab ${filterCat === 'all' ? 'on' : ''}" data-cat="all">전체 보기 (${Object.values(NEW_PARTS).reduce((n, g) => n + Object.keys(g).filter((id) => !id.endsWith('_none')).length, 0)}종)</button>` +
      SLOT_INFO.map(([slot, label, isNew]) =>
        `<button type="button" class="cls-tab ${filterCat === slot ? 'on' : ''}" data-cat="${slot}">${label}${isNew ? ' ★' : ''}</button>`
      ).join('');

    const visibleSlots = filterCat === 'all' ? SLOT_INFO : SLOT_INFO.filter(([s]) => s === filterCat);
    document.getElementById('sections').innerHTML = visibleSlots.map(([slot, label, isNew]) => {
      const items = Object.entries(NEW_PARTS[slot]).filter(([id]) => !id.endsWith('_none'));
      return `
        <section class="cat-sec">
          <div class="cat-head">
            <h2>${label}</h2>
            ${isNew ? '<span class="chip">신규 추가 항목</span>' : `<span class="tag-off">기존 항목 · 신규 ${items.length}종</span>`}
          </div>
          <div class="s-grid">
            ${items.map(([id, it]) => {
              const sampleAv = { ...DEFAULTS, [slot]: id };
              return `
                <article class="s-card glass r-${it.tier} ${current[slot] === id ? 'is-on' : ''}" data-slot="${slot}" data-id="${id}">
                  ${it.tier !== 'common' ? `<span class="shop-rarity">${TIER_NAME[it.tier]}${it.lv > 1 ? ` · Lv.${it.lv}` : ''}</span>` : ''}
                  ${renderAvatarSVG(sampleAv, 148, { live: true })}
                  <div class="s-name">${it.name}</div>
                  ${it.merged ? `<span class="chip">통합 · ${it.merged}</span>` : ''}
                  <div class="s-desc">${it.desc}</div>
                  <div class="s-meta">${SILVER_ICON}<b class="num">${it.price}</b> 은화</div>
                  <div class="s-sizes">
                    ${renderAvatarSVG(sampleAv, 72)}${renderAvatarSVG(sampleAv, 48)}${renderAvatarSVG(sampleAv, 40)}
                  </div>
                </article>`;
            }).join('')}
          </div>
        </section>`;
    }).join('');
  }

  document.getElementById('studio-picks').addEventListener('change', (e) => {
    const sel = e.target.closest('select[data-slot]');
    if (!sel) return;
    current[sel.dataset.slot] = sel.value;
    updateStudio();
  });

  document.getElementById('sections').addEventListener('click', (e) => {
    const card = e.target.closest('.s-card[data-slot]');
    if (!card) return;
    const { slot, id } = card.dataset;
    current[slot] = current[slot] === id ? DEFAULTS[slot] : id;
    updateStudio();
  });

  document.getElementById('cat-bar').addEventListener('click', (e) => {
    const btn = e.target.closest('[data-cat]');
    if (!btn) return;
    filterCat = btn.dataset.cat;
    renderCatalog();
  });

  document.getElementById('btn-reset').addEventListener('click', () => {
    current = { ...DEFAULTS };
    updateStudio();
  });

  document.getElementById('btn-rand').addEventListener('click', () => {
    SLOT_INFO.forEach(([slot]) => {
      const keys = Object.keys(NEW_PARTS[slot]).filter((k) => !k.endsWith('_none'));
      current[slot] = keys[Math.floor(Math.random() * keys.length)];
    });
    updateStudio();
  });

  document.getElementById('btn-lite').addEventListener('click', (e) => {
    const on = document.documentElement.classList.toggle('lite');
    e.currentTarget.textContent = on ? '저사양(.lite) 켜짐 · 다시 누르면 일반' : '저사양(.lite) 비교';
    updateStudio();
    renderCatalog();
  });

  renderCatalog();
  updateStudio();
</script>
</body>
</html>
