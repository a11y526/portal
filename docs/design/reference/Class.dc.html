<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>반 페이지</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2457E6}a:hover{color:#1A43B8}
.glass{background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.8);box-shadow:0 12px 32px rgba(28,39,76,.10),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 1px rgba(255,255,255,.4)}
.glass-strong{background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(28px) saturate(200%);backdrop-filter:blur(28px) saturate(200%);border:1px solid rgba(255,255,255,.9);box-shadow:0 18px 40px rgba(28,39,76,.14),inset 0 1px 0 #fff}
.orb{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none}
.lift{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.lift:hover{transform:translateY(-3px);box-shadow:0 20px 40px rgba(28,39,76,.16),inset 0 1px 0 #fff}
.press{transition:transform .15s}
.press:active{transform:scale(.97)}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.rise{animation:rise .6s cubic-bezier(.2,.8,.2,1) both}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin 1.1s linear infinite}
@keyframes pop{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
.pop{animation:pop .6s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes fall{0%{transform:translateY(-10px) rotate(0);opacity:0}15%{opacity:1}100%{transform:translateY(150px) rotate(320deg);opacity:0}}
.bit{position:absolute;top:0;width:8px;height:12px;border-radius:2px;animation:fall 2.2s ease-in infinite}
@keyframes breathe{0%,100%{opacity:.55}50%{opacity:1}}
.breathe{animation:breathe 1.8s ease-in-out infinite}
input:focus{outline:3px solid rgba(36,87,230,.35);outline-offset:1px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="position: relative; min-height: 1000px; overflow: hidden; background: #EDF1F7; font-family: 'Noto Sans KR', sans-serif; color: #0B1220">
<div class="orb" aria-hidden="true" style="width: 560px; height: 560px; left: -180px; top: -200px; background: #6EA8FF; opacity: .5"></div>
<div class="orb" aria-hidden="true" style="width: 480px; height: 480px; right: -160px; top: 260px; background: #B79CFF; opacity: .45"></div>
<div class="orb" aria-hidden="true" style="width: 440px; height: 440px; left: 20%; bottom: -240px; background: #6FE3C8; opacity: .45"></div>

<div style="position: relative; max-width: 1200px; margin: 0 auto; padding: 32px 24px 64px; display: flex; flex-direction: column; gap: 24px">

<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap">
<div style="display: flex; align-items: center; gap: 14px; flex-wrap: wrap">
<a href="Main.dc.html" class="glass lift" aria-label="반 선택으로 돌아가기" style="display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; border-radius: 999px; color: #0B1220">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"></path><path d="M11 6l-6 6 6 6"></path></svg>
</a>
<h1 style="margin: 0; font-size: 36px; font-weight: 900; letter-spacing: -0.03em">1학년 8반</h1>
<span class="glass" style="padding: 8px 16px; border-radius: 999px; font-size: 15px; font-weight: 500; color: #4E5868">523차시 · [차시 제목]</span>
</div>
<a href="Rank.dc.html" class="glass lift" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; text-decoration: none; color: #0B1220; font-weight: 500; font-size: 15px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0z"></path></svg>
이번 달 순위</a>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start">

<section class="glass rise" style="flex: 999 1 560px; min-width: 0; border-radius: 32px; padding: 20px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 8px 0">
<h2 style="margin: 0; font-size: 20px; font-weight: 700">오늘의 패들렛</h2>
<a href="#" style="font-size: 15px; font-weight: 500; text-decoration: none">새 탭에서 열기 ↗</a>
</div>
<div style="height: 640px; border-radius: 22px; background: rgba(255,255,255,.45); border: 1.5px dashed rgba(78,88,104,.35); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; color: #4E5868">
<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="2"></rect><rect x="14" y="3" width="7" height="5" rx="2"></rect><rect x="14" y="12" width="7" height="9" rx="2"></rect><rect x="3" y="16" width="7" height="5" rx="2"></rect></svg>
<span style="font-size: 16px; font-weight: 500">[패들렛 보드가 이 자리에 들어감]</span>
</div>
</section>

<div style="flex: 1 1 340px; min-width: 0; display: flex; flex-direction: column; gap: 20px">

<section class="glass-strong rise" style="animation-delay: .08s; position: relative; overflow: hidden; border-radius: 32px; padding: 24px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; align-items: center; justify-content: space-between">
<h2 style="margin: 0; font-size: 26px; font-weight: 900; letter-spacing: -0.02em">우리 모둠 · 3모둠</h2>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 8px">
<span style="padding: 6px 12px; border-radius: 999px; background: rgba(36,87,230,.10); font-size: 14px; font-weight: 500">중력고양이</span>
<span style="padding: 6px 12px; border-radius: 999px; background: rgba(36,87,230,.10); font-size: 14px; font-weight: 500">별빛탐험가</span>
<span style="padding: 6px 12px; border-radius: 999px; background: rgba(36,87,230,.10); font-size: 14px; font-weight: 500">부력오리</span>
<span style="padding: 6px 12px; border-radius: 999px; background: rgba(36,87,230,.10); font-size: 14px; font-weight: 500">우주먼지</span>
</div>

<sc-if value="{{isIdle}}" hint-placeholder-val="{{true}}">
<div style="display: flex; flex-direction: column; gap: 12px">
<label for="code1" style="font-size: 14px; font-weight: 700; color: #4E5868">내 코드 6자리</label>
<input id="code1" type="password" inputmode="numeric" maxlength="6" placeholder="● ● ● ● ● ●" style="height: 56px; border-radius: 18px; border: 1px solid rgba(78,88,104,.25); background: rgba(255,255,255,.8); padding: 0 18px; font-size: 22px; letter-spacing: .3em; font-family: inherit; color: #0B1220">
<button type="button" class="press" onClick="{{submit}}" style="height: 60px; border: 0; border-radius: 999px; background: #2457E6; color: #fff; font-family: inherit; font-size: 20px; font-weight: 900; cursor: pointer; box-shadow: 0 10px 24px rgba(36,87,230,.35), inset 0 1px 0 rgba(255,255,255,.35)">다 했어요</button>
</div>
</sc-if>

<sc-if value="{{isPending}}" hint-placeholder-val="{{false}}">
<div style="display: flex; align-items: center; gap: 16px; padding: 18px; border-radius: 22px; background: rgba(255,196,77,.22)">
<div class="spin" aria-hidden="true" style="flex: none; width: 44px; height: 44px; border-radius: 999px; border: 4px solid rgba(138,83,0,.18); border-top-color: #8A5300"></div>
<div style="display: flex; flex-direction: column; gap: 2px">
<span class="breathe" style="font-size: 20px; font-weight: 900; color: #8A5300">선생님이 확인하는 중</span>
<span style="font-size: 14px; color: #6B4A12">10:42 제출 · 중력고양이</span>
</div>
</div>
</sc-if>

<sc-if value="{{isReturned}}" hint-placeholder-val="{{false}}">
<div style="display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-direction: column; gap: 10px; padding: 18px; border-radius: 22px; background: rgba(255,122,69,.16)">
<div style="display: flex; align-items: center; gap: 10px">
<span class="pop" aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; border-radius: 999px; background: #C2410C; color: #fff; font-weight: 900">!</span>
<span style="font-size: 20px; font-weight: 900; color: #A23B0B">다시 확인해 주세요</span>
</div>
<div style="padding: 12px 14px; border-radius: 14px; background: rgba(255,255,255,.75); font-size: 16px; line-height: 1.5"><b style="font-weight: 700">선생님 메모</b> · 3번 사례에서 마찰력 방향을 다시 봐요</div>
</div>
<label for="code2" style="font-size: 14px; font-weight: 700; color: #4E5868">내 코드 6자리</label>
<input id="code2" type="password" inputmode="numeric" maxlength="6" placeholder="● ● ● ● ● ●" style="height: 56px; border-radius: 18px; border: 1px solid rgba(78,88,104,.25); background: rgba(255,255,255,.8); padding: 0 18px; font-size: 22px; letter-spacing: .3em; font-family: inherit; color: #0B1220">
<button type="button" class="press" onClick="{{submit}}" style="height: 60px; border: 0; border-radius: 999px; background: #2457E6; color: #fff; font-family: inherit; font-size: 20px; font-weight: 900; cursor: pointer; box-shadow: 0 10px 24px rgba(36,87,230,.35), inset 0 1px 0 rgba(255,255,255,.35)">고쳐서 다시 제출</button>
</div>
</sc-if>

<sc-if value="{{isPassed}}" hint-placeholder-val="{{false}}">
<div style="position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 28px 18px; border-radius: 22px; background: rgba(34,197,130,.16); overflow: hidden">
<span class="bit" aria-hidden="true" style="left: 12%; background: #2457E6; animation-delay: 0s"></span>
<span class="bit" aria-hidden="true" style="left: 28%; background: #F59E0B; animation-delay: .5s"></span>
<span class="bit" aria-hidden="true" style="left: 46%; background: #22C582; animation-delay: .2s"></span>
<span class="bit" aria-hidden="true" style="left: 64%; background: #B79CFF; animation-delay: .8s"></span>
<span class="bit" aria-hidden="true" style="left: 82%; background: #FF7A45; animation-delay: .35s"></span>
<span class="pop" aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 72px; height: 72px; border-radius: 999px; background: #0F8A5F; color: #fff; box-shadow: 0 10px 24px rgba(15,138,95,.35)">
<svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>
</span>
<span style="font-size: 30px; font-weight: 900; color: #0B6B47">통과!</span>
<span style="font-size: 15px; color: #23523F">순위는 수업 끝에 발표돼요</span>
</div>
</sc-if>
</section>

<section class="glass rise" style="animation-delay: .14s; border-radius: 28px; padding: 20px; display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0 0 4px 4px; font-size: 18px; font-weight: 700">시뮬레이션</h2>
<a href="#" class="lift" style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px; border-radius: 16px; background: rgba(255,255,255,.6); text-decoration: none; color: #0B1220; font-size: 16px; font-weight: 500">[시뮬레이션 이름 1]<span aria-hidden="true">↗</span></a>
<a href="#" class="lift" style="display: flex; align-items: center; justify-content: space-between; min-height: 52px; padding: 0 16px; border-radius: 16px; background: rgba(255,255,255,.6); text-decoration: none; color: #0B1220; font-size: 16px; font-weight: 500">[시뮬레이션 이름 2]<span aria-hidden="true">↗</span></a>
</section>

<section class="glass rise" style="animation-delay: .2s; border-radius: 28px; padding: 20px; display: flex; flex-direction: column; gap: 12px">
<h2 style="margin: 0 0 0 4px; font-size: 18px; font-weight: 700">모둠 현황</h2>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 16px; background: {{g.bg}}">
<span aria-hidden="true" style="width: 10px; height: 10px; border-radius: 999px; background: {{g.dot}}"></span>
<span style="font-size: 15px; font-weight: 700">{{g.name}}</span>
<span style="margin-left: auto; font-size: 13px; font-weight: 500; color: {{g.fg}}">{{g.label}}</span>
</div>
</sc-for>
</div>
</section>

</div>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"groupState":{"editor":"enum","options":["idle","pending","returned","passed"],"default":"idle","section":"시안"},"$preview":{"width":1280,"height":1000}}'>
class Component extends DCLogic {
componentDidUpdate(prev) {
if (prev.groupState !== this.props.groupState && this.state && this.state.clicked) {
this.setState({ clicked: false });
}
}
renderVals() {
var self = this;
var st = this.state || {};
var s = st.clicked ? st.s : (this.props.groupState ?? 'idle');
var look = {
idle: { label: '진행 중', bg: 'rgba(255,255,255,.55)', dot: '#9AA3B2', fg: '#4E5868' },
pending: { label: '검사 대기', bg: 'rgba(255,196,77,.22)', dot: '#D98E04', fg: '#8A5300' },
returned: { label: '다시 확인', bg: 'rgba(255,122,69,.16)', dot: '#C2410C', fg: '#A23B0B' },
passed: { label: '통과', bg: 'rgba(34,197,130,.16)', dot: '#0F8A5F', fg: '#0B6B47' }
};
var list = [['1모둠', 'passed'], ['2모둠', 'idle'], ['3모둠', s], ['4모둠', 'pending'], ['5모둠', 'idle'], ['6모둠', 'returned']];
return {
isIdle: s === 'idle',
isPending: s === 'pending',
isReturned: s === 'returned',
isPassed: s === 'passed',
submit: function () { self.setState({ clicked: true, s: 'pending' }); },
groups: list.map(function (g) {
var l = look[g[1]];
return { name: g[0], label: l.label, bg: l.bg, dot: l.dot, fg: l.fg };
})
};
}
}
</script>
</body>
</html>
