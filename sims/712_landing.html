<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>착륙할 땅이 없는 행성</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--font:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;font-family:var(--font);color:#1D1D1F;word-break:keep-all}
.wrap{height:100%;padding:10px;display:flex;flex-direction:column;gap:10px;min-height:0}
.wrap svg{display:block;flex:1;width:100%;min-height:0;border-radius:16px;touch-action:none;user-select:none;-webkit-user-select:none}
.mc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;flex:none}
.sl-btn{font:700 16px var(--font);color:#0066CC;background:#fff;border:1.5px solid #0066CC;border-radius:999px;padding:6px 12px;cursor:pointer;min-height:44px;touch-action:manipulation;position:relative}
.sl-btn:active{background:#E8F1FB}
.sl-btn.on{background:#0066CC;color:#fff}
.sl-btn .mk{position:absolute;top:-6px;right:-4px;min-width:20px;height:20px;border-radius:10px;font-size:13px;line-height:20px;color:#fff;padding:0 4px}
.mk.ok{background:#1E8E3E}.mk.no{background:#C5221F}
.mc .st{margin-left:auto;font-size:15px;font-weight:700;color:#6E6E73}
.mc .st.ok{color:#1E8E3E}
.how{flex:none;margin:0;padding:8px 12px;border-radius:12px;background:#F2F6FC;font-size:16px;line-height:1.5;color:#1D1D1F}
.how b{color:#0066CC}
svg text{font-family:var(--font)}
#probe{cursor:grab}
</style>
</head>
<body>
<div class="wrap">
  <p class="how"><b>①</b> 위에서 행성 고르기 → <b>②</b> 탐사선을 마우스로 잡고 아래로 끌었다가 놓기(또는 ↓ 키) → <b>③</b> 다른 행성으로 한 번 더<br>8개 중 <b>2개만</b> 내려 보면 답을 쓸 수 있어요.</p>
  <div class="mc" id="plist"></div>
  <svg id="s" viewBox="0 0 600 330" role="img" aria-label="탐사선 착륙"></svg>
  <div class="mc"><button class="sl-btn" id="again">탐사선 다시 올리기</button><span class="st" id="st"></span></div>
</div>
<script>
/* 행성을 고르고 탐사선을 끌어 내리면(놓으면 떨어진다) 땅이 있는 행성에는 착륙하고, 기체 행성에서는 계속 가라앉는다 */
(function(){
'use strict';
const NS='http://www.w3.org/2000/svg';
const RED=matchMedia('(prefers-reduced-motion: reduce)').matches;
const el=(t,a,p)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;};
function T(p,x,y,str,a){const e=el('text',Object.assign({x,y,'font-size':18,fill:'#fff','font-weight':700},a||{}),p);e.textContent=str;return e;}
/* 포털 학습지 칸 잠금: 아무 행성이나 2개 내려 보면 끝(sim:done) */
const tell=d=>{if(window.parent!==window)window.parent.postMessage(d,'*');};
const P=[['수성',0,'#A29D97','#7E7974'],['금성',0,'#DDBF86','#BC9A5E'],['지구',0,'#8B6A4F','#6E523C'],['화성',0,'#C4603A','#8F3F24'],
  ['목성',1,'#D6B48E','#A8734D'],['토성',1,'#E1C894','#B89A62'],['천왕성',1,'#A6DCE0','#86C2C8'],['해왕성',1,'#4E7FD0','#3A63AD']];
const tried={};let cur=2,done=false;
const svg=document.getElementById('s'),plist=document.getElementById('plist'),st=document.getElementById('st');
P.forEach((q,i)=>{const b=document.createElement('button');b.className='sl-btn';b.textContent=q[0];b.onclick=()=>pick(i);plist.appendChild(b);});
el('rect',{x:0,y:0,width:600,height:330,rx:14,fill:'#0F1420'},svg);
for(let i=0;i<50;i++)el('circle',{cx:(i*53)%600,cy:(i*37)%200,r:1,fill:'#fff',opacity:.5},svg);
const world=el('g',{},svg);
const pr=el('g',{id:'probe'},svg);
el('rect',{x:-26,y:-6,width:12,height:5,fill:'#5B8FD6'},pr);el('rect',{x:14,y:-6,width:12,height:5,fill:'#5B8FD6'},pr);
el('path',{d:'M-14,8 L-22,24 M14,8 L22,24 M-26,24 h8 M18,24 h8',stroke:'#E6E6EA','stroke-width':3,fill:'none'},pr);
el('rect',{x:-14,y:-12,width:28,height:22,rx:5,fill:'#E6E6EA'},pr);el('circle',{cx:0,cy:-1,r:6,fill:'#2997FF'},pr);
el('rect',{x:-40,y:-30,width:80,height:64,fill:'transparent'},pr);
const front=el('g',{},svg);
const deep=el('rect',{x:0,y:0,width:600,height:330,rx:14,fill:'#000',opacity:0,'pointer-events':'none'},svg);
const name=T(svg,16,30,'',{'font-size':20});
const hint=T(svg,336,66,'↓ 탐사선을 잡고 아래로 끌었다 놓기',{'font-size':17,fill:'#9FC6FF'});
const msg=el('g',{opacity:0},svg);const msgR=el('rect',{x:150,y:56,width:300,height:44,rx:22,fill:'#fff'},msg);const msgT=T(msg,300,85,'',{'text-anchor':'middle',fill:'#1D1D1F','font-size':18});
const X=300,Y0=60,GROUND=212;let y=Y0,vy=0,raf=0,drag=null,state='top';
function pick(i){cur=i;const q=P[i];
  plist.querySelectorAll('button').forEach((b,k)=>b.classList.toggle('on',k===i));
  world.innerHTML='';front.innerHTML='';name.textContent=q[0];
  if(!q[1]){el('path',{d:'M0,236 l30,-6 l25,4 l30,-8 l40,6 l35,-5 l30,7 l40,-4 l30,5 l32,-3 l40,5 l35,-6 l30,4 l40,-5 l30,6 l40,-4 l30,5 l33,-3 H600 V330 H0z',fill:q[2]},world);
    el('path',{d:'M0,272 l60,-4 l50,5 l70,-6 l60,5 l60,-3 l70,5 l60,-4 l70,6 l100,-4 V330 H0z',fill:q[3]},world);
    [[60,256,10],[170,286,12],[420,262,9],[520,292,11]].forEach(([x,yy,r])=>el('ellipse',{cx:x,cy:yy,rx:r,ry:r*.5,fill:q[3]},world));}
  else{for(let k=0;k<4;k++)el('rect',{x:0,y:200+k*34,width:600,height:40,fill:k%2?q[3]:q[2],opacity:.55+k*.1},world);
    el('path',{d:'M0,214 q50,-16 100,0 t100,0 t100,0 t100,0 t100,0 t100,0 V330 H0z',fill:q[2],opacity:.75},front);
    el('path',{d:'M0,262 q60,-14 120,0 t120,0 t120,0 t120,0 t120,0 V330 H0z',fill:q[3],opacity:.8},front);}
  reset();}
function reset(){cancelAnimationFrame(raf);raf=0;y=Y0;vy=0;state='top';msg.setAttribute('opacity',0);draw();}
function draw(){pr.setAttribute('transform',`translate(${X},${y})`);
  const gas=P[cur][1],d=Math.max(0,y-GROUND);pr.setAttribute('opacity',gas?Math.max(0,1-d/110):1);deep.setAttribute('opacity',gas?Math.min(.45,d/240):0);
  const n=Object.keys(tried).length;st.textContent=n>=2?`내려 본 행성 ${n}개 · 이제 답을 쓸 수 있어요`:`내려 본 행성 ${n} / 2개`;st.classList.toggle('ok',n>=2);
  hint.setAttribute('opacity',state==='top'?1:0);}
function say(s,w){msgT.textContent=s;msgR.setAttribute('width',w);msgR.setAttribute('x',300-w/2);msg.setAttribute('opacity',1);}
function finish(){const q=P[cur];state='end';tried[cur]=q[1]?'no':'ok';
  q[1]?say('땅이 없어요 — 기체 속으로 가라앉아요',360):say('단단한 땅에 착륙했어요 — 흙, 암석',340);
  const b=plist.children[cur];if(!b.querySelector('.mk')){const m=document.createElement('span');m.className='mk '+tried[cur];m.textContent=q[1]?'✕':'✓';b.appendChild(m);}
  const n=Object.keys(tried).length;tell({type:'sim:progress',n:Math.min(n,2),total:2});
  if(n>=2&&!done){done=true;tell({type:'sim:done'});}draw();}
/* 놓으면 떨어진다: 땅이 있으면 GROUND에 멈추고, 기체면 점점 느려지며 끝까지 가라앉는다 */
function fall(){if(RED){y=P[cur][1]?GROUND+120:GROUND;finish();return;}
  let last=0;const step=now=>{const dt=last?Math.min(40,now-last)/1000:.016;last=now;const gas=P[cur][1];
    if(gas&&y>GROUND-10){vy+= (70-vy)*Math.min(1,dt*3);}else vy+=520*dt;y+=vy*dt;
    if(!gas&&y>=GROUND){y=GROUND;draw();finish();return;}
    if(gas&&y>=GROUND+120){draw();finish();return;}
    draw();raf=requestAnimationFrame(step);};raf=requestAnimationFrame(step);}
function svgY(e){const r=svg.getBoundingClientRect();return (e.clientY-r.top)*330/r.height;}
pr.addEventListener('pointerdown',e=>{if(state!=='top'&&state!=='hold')return;e.preventDefault();try{pr.setPointerCapture(e.pointerId);}catch(_){}drag={o:svgY(e)-y,moved:false};state='hold';pr.style.cursor='grabbing';});
pr.addEventListener('pointermove',e=>{if(!drag)return;const ny=Math.max(Y0,Math.min(GROUND-4,svgY(e)-drag.o));if(Math.abs(ny-y)>1)drag.moved=true;y=ny;draw();});
const up=()=>{if(!drag)return;drag=null;pr.style.cursor='';state='fall';vy=0;fall();};
pr.addEventListener('pointerup',up);pr.addEventListener('pointercancel',up);
document.addEventListener('keydown',e=>{if(e.key==='ArrowDown'||e.key===' '){e.preventDefault();if(state==='top'){state='fall';fall();}}});
document.getElementById('again').onclick=reset;
/* 수업자료 안에서는 쪽 넘기기·답 보기 키를 수업자료로 넘긴다 */
if(window.parent!==window)document.addEventListener('keydown',e=>{if(['PageUp','PageDown','Home','End','Escape','a','A','g','G','f','F','ArrowLeft','ArrowRight'].includes(e.key)){e.preventDefault();window.parent.postMessage({type:'simkey',key:e.key,shift:e.shiftKey},'*');}});
tell({type:'sim:gate'});tell({type:'sim:progress',n:0,total:2});
pick(2);
})();
</script>
</body>
</html>
