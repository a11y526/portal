# 원래 포털(a11y526/science-portal)의 새 기능을 매일 받아 온다. 복사한 저장소(Fork)에서만 돈다.
# 서버(Supabase)는 한국 시간 2:00~2:05에 먼저 바뀌고(06_auto_update.sql), 이 일은 2:20에 사이트 파일을 받는다.
# site.js(내 서버 주소·담당 반)만 이 저장소 값을 남기고, 나머지는 원래 포털과 똑같이 맞춘다(직접 고친 파일은 원래대로).
name: 새 기능 받기
on:
  schedule:
    - cron: '20 17 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  sync:
    if: github.repository != 'a11y526/science-portal'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: 원래 저장소와 똑같이 맞추기
        env:
          GH_TOKEN: ${{ github.token }}
        # 맞추는 방법은 원래 포털의 install/stay-original.sh를 받아 쓴다(이 파일은 되도록 고치지 않는다)
        run: |
          curl -fsSL "https://raw.githubusercontent.com/a11y526/science-portal/main/install/stay-original.sh?t=$(date +%s)" -o "$RUNNER_TEMP/stay.sh"
          bash "$RUNNER_TEMP/stay.sh"
