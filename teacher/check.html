<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>검사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/design.css">
<link rel="stylesheet" href="../assets/css/site.css">
</head>
<body>
<main class="wrap check-wrap">
  <div id="app" class="check-app">
    <header class="check-top">
      <h1>검사</h1>
      <label class="class-pick glass press">
        <select id="cls" aria-label="반 선택"></select>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>
      </label>
      <span class="wait-badge num" id="wait">대기 0</span>
    </header>
    <p class="check-lesson" id="lesson"></p>

    <div class="check-list">
      <div class="glass check-note hidden" id="note"></div>
      <div class="pending-list" id="pending"></div>
      <div class="glass check-note hidden" id="no-pending">기다리는 제출이 없어요</div>

      <h2 class="done-h">처리함</h2>
      <div class="glass done-box" id="done"></div>
      <a class="check-admin" href="index.html">관리</a>
    </div>

    <div class="check-bottom">
      <a class="reveal-open press" id="reveal-link" href="reveal.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/><path d="M12 16v4"/></svg>
        순위 발표 화면 열기
      </a>
    </div>
  </div>
</main>
<script type="module" src="../assets/js/pages/check.js"></script>
</body>
</html>
