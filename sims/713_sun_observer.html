<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>713 태양 관측 위성 자료</title>
<style>
:root{--p:#0066CC;--ink:#1D1D1F;--mut:#6E6E73;--line:#E3E3E8;--pearl:#F5F5F7;--ok:#1E8E3E;
  --font:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font-family:var(--font);word-break:keep-all;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;overflow:hidden;padding:8px;gap:8px}
button{font:700 16px var(--font);color:var(--p);background:#fff;border:1.5px solid var(--p);border-radius:999px;padding:6px 14px;min-height:42px;cursor:pointer;touch-action:manipulation}
button:active{background:#E8F1FB}
button:disabled{opacity:.35;cursor:not-allowed;background:#fff}
svg text{font-family:var(--font)}
.how{flex:none;margin:0;padding:7px 12px;border-radius:12px;background:#F2F6FC;font-size:16px;line-height:1.5;display:flex;flex-wrap:wrap;gap:2px 14px}
.how span{color:#8A94A6;font-weight:600}
.how span b{color:inherit}
.how span.now{color:var(--ink)}
.how span.now b{color:var(--p)}
.how span.done{color:var(--ok)}
.how span.done::after{content:" ✓";font-weight:800}
.row{flex:1;min-height:0;display:flex;gap:10px}
.stage{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px}
.stage svg{display:block;flex:1;width:100%;min-height:0;touch-action:none;user-select:none;-webkit-user-select:none}
.ctrl{flex:none;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:16px;font-weight:700}
.ctrl input[type=range]{accent-color:var(--p);width:220px;height:32px;touch-action:none}
.ctrl .st{margin-left:auto;font-size:15px;color:var(--mut)}
#qs{flex:0 0 clamp(236px,31%,300px);display:flex;flex-direction:column;gap:10px;overflow:auto;padding:2px 2px 4px}
.q{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;transition:border-color .2s,opacity .2s}
.q p{margin:0;font-size:16.5px;font-weight:700;line-height:1.45}
.q .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--p);color:#fff;font-size:13px;margin-right:6px;vertical-align:2px}
.q .tag{display:inline-block;font-size:12.5px;font-weight:800;color:#8A5300;background:rgba(255,196,77,.3);border-radius:999px;padding:1px 8px;margin-right:6px;vertical-align:2px}
.q .opts{display:flex;flex-wrap:wrap;gap:6px}
.q .opts button{border-color:#C7C7CC;color:var(--ink);font-size:15px;min-height:38px;padding:4px 12px;font-weight:600}
.q .opts button.on{background:var(--p);border-color:var(--p);color:#fff}
.q .lock{font-size:14px;font-weight:700;color:var(--mut)}
.q.locked{opacity:.55}
.q.locked .opts{display:none}
.q:not(.locked) .lock{display:none}
.q.picked{border-color:#9EC3EA}
.sub{flex:none;display:flex;flex-direction:column;gap:6px;margin-top:auto}
.sub button{background:var(--p);color:#fff;font-size:17px;min-height:46px}
.sub button:disabled{background:#fff;color:var(--p)}
.sub .msg{font-size:14.5px;font-weight:700;color:var(--mut);text-align:center;min-height:21px}
.sub .msg.ok{color:var(--ok)}
@media (max-height:560px) and (min-width:601px){
  body{padding:6px;gap:6px}
  .how{font-size:14px;padding:5px 10px;gap:0 10px}
  #qs{gap:6px}
  .q{padding:6px 10px;gap:5px;border-radius:12px}
  .q p{font-size:14.5px}
  .q .opts{gap:4px}
  .q .opts button{font-size:14px;min-height:32px;padding:2px 10px}
  .q .lock{font-size:13px}
  .sub{gap:3px}
  .sub button{min-height:38px;font-size:16px}
  .sub .msg{font-size:13px;min-height:18px}
  button{min-height:36px}
}
@media (max-width:600px){
  body{overflow:auto;height:auto;min-height:100%}
  .row{flex-direction:column}
  .stage{flex:none;height:62vh;min-height:300px}
  #qs{flex:none;overflow:visible}
}
</style>
<script>
/* 공통: 조작 안내 줄(#how), 문항 칸(#qs)과 [제출] → 학습지 칸(.sim-in)으로 {type:'sim:answer', n, value} */
/* 점검용: ?raf=timer 이면 화면이 숨겨져도 움직임이 돈다 */
if(/raf=timer/.test(location.search))window.requestAnimationFrame=function(f){return setTimeout(function(){f(performance.now());},16);},window.cancelAnimationFrame=clearTimeout;
var Q=(function(){
'use strict';
var WS=/ws=/.test(location.hash);
var RED=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tell(d){if(window.parent!==window)window.parent.postMessage(d,'*');}
/* 수업자료 안에서는 쪽 넘기기·답 보기 키를 수업자료로 넘긴다 */
tell({type:'sim:gate'});
/* 안내 줄: steps = ['① <b>…</b> …', …], 지금 할 단계는 진하게, 끝낸 단계는 ✓ */
function how(steps){
  var box=document.getElementById('how'),done=steps.map(function(){return false;}),items=steps.map(function(s){var e=document.createElement('span');e.innerHTML=s;box.appendChild(e);return e;});
  function draw(){var cur=done.indexOf(false);items.forEach(function(e,i){e.className=done[i]?'done':i===cur?'now':'';});}
  draw();
  return {done:function(i,v){done[i]=v!==false;draw();},is:function(i){return done[i];},first:function(){return done.indexOf(false);},steps:steps};}
/* 문항: list = [{html, opts:[…], lock:'…'}], 고른 값은 보기 글 그대로 보낸다 */
function panel(list,o){
  o=o||{};
  var box=document.getElementById('qs'),Hw=o.how;
  var st=list.map(function(q,i){
    var d=document.createElement('div');d.className='q'+(q.lock?' locked':'');
    d.innerHTML='<p>'+q.html+'</p><div class="opts"></div><div class="lock">'+(q.lock||'')+'</div>';
    var ob=d.querySelector('.opts'),s={el:d,val:'',open:!q.lock,btns:[]};
    q.opts.forEach(function(t){var b=document.createElement('button');b.type='button';b.textContent=t;
      b.onclick=function(){b.blur();if(!s.open)return;s.val=s.val===t?'':t;s.btns.forEach(function(x){x.classList.toggle('on',x.textContent===s.val);});d.classList.toggle('picked',!!s.val);sent=false;sync();if(o.onPick)o.onPick(i,s.val);};
      ob.appendChild(b);s.btns.push(b);});
    box.appendChild(d);return s;});
  var sub=document.createElement('div');sub.className='sub';sub.innerHTML='<button type="button">제출</button><div class="msg"></div>';box.appendChild(sub);
  var sb=sub.querySelector('button'),msg=sub.querySelector('.msg'),sent=false;
  function sync(){
    var ready=st.every(function(s){return s.open&&s.val;});
    sb.disabled=!ready;msg.classList.toggle('ok',sent);
    if(sent){msg.textContent=WS?'학습지로 보냈어요':'제출했어요';return;}
    if(ready){msg.textContent='';return;}
    var k=Hw?Hw.first():-1;
    if(k>=0&&st.some(function(s){return !s.open;}))msg.textContent=(Hw.steps[k].match(/^[①-⑨]/)||[''])[0]+'부터 해 보세요';
    else msg.textContent='모든 문항을 골라 보세요';}
  sb.onclick=function(){sb.blur();if(sb.disabled)return;
    st.forEach(function(s,i){tell({type:'sim:answer',n:i+1,value:s.val});});tell({type:'sim:done'});sent=true;
    if(Hw)Hw.done(Hw.steps.length-1);sync();};
  sync();
  return {open:function(i){var s=st[i];if(s.open)return;s.open=true;s.el.classList.remove('locked');sync();},
    val:function(i){return st[i].val;},sync:sync};}
return {WS:WS,RED:RED,tell:tell,how:how,panel:panel};
})();
</script>

<style>
:root{--p:#0066CC;--ink:#1D1D1F;--mut:#6E6E73;--line:#E3E3E8;--pearl:#F5F5F7;
  --font:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;overflow:hidden;font-size:17px}
.main{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;border:1px solid var(--line);border-radius:14px;overflow:hidden}
@media (max-width:600px){.main{flex:none;height:70vh;min-height:340px}}
button{font:700 16px var(--font);color:var(--p);background:#fff;border:1.5px solid var(--p);border-radius:999px;padding:6px 14px;min-height:42px;cursor:pointer;touch-action:manipulation;white-space:nowrap}
button:active{background:#E8F1FB}
button:disabled{opacity:.35;cursor:not-allowed;background:#fff}
button.on{background:var(--p);color:#fff}
.tabs{display:flex;gap:8px;padding:8px 10px;border-bottom:1px solid var(--line);flex:none;flex-wrap:wrap;align-items:center}
.tabs button{border-color:#D1D1D6;color:#515154}
.tabs button.on{background:var(--p);border-color:var(--p);color:#fff}
.tabs button .ck{display:inline-block;margin-left:6px;color:#34C759;font-weight:800;visibility:hidden}
.tabs button.done .ck{visibility:visible}
.tabs button.on .ck{color:#fff}
.tabs .tip{margin-left:auto;font-size:15px;font-weight:700;color:var(--mut)}
.stg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px;position:relative}
.stg svg{display:block;max-width:100%;max-height:100%;width:100%;height:100%}
.ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 10px;border-top:1px solid var(--line);flex:none}
.seg{display:inline-flex;border:1.5px solid #D1D1D6;border-radius:999px;overflow:hidden;background:#fff}
.seg button{border:0;border-radius:0;color:#515154;padding:6px 12px}
.seg button.on{background:var(--p);color:#fff}
.st{margin-left:auto;font-size:15px;font-weight:700;color:var(--mut)}
.lab{font-size:15px;font-weight:700;color:var(--mut)}
input[type=range]{accent-color:var(--p);height:32px;width:220px;touch-action:none}
svg text{font-family:var(--font)}
.pane{display:none;flex:1;min-height:0;flex-direction:column}
.pane.on{display:flex}
body.ws .playbtn{display:none}

.zoomrow input[type=range]{width:260px}
</style>
</head>
<body>
<p class="how" id="how"></p>
<div class="row"><div class="main">
<div class="tabs" id="tabs">
  <button data-t="0" class="on">1. 광구 관찰<span class="ck">✓</span></button>
  <button data-t="1">2. 대기 관찰 (광구 가리기)<span class="ck">✓</span></button>
  <button data-t="2">3. 폭발 관찰 (자외선 비교)<span class="ck">✓</span></button>
  <span class="tip" id="tip"></span>
</div>

<div class="pane on" id="p0">
  <div class="stg" id="st0"></div>
  <div class="ctrl zoomrow">
    <span class="lab">확대</span><button id="zm">−</button><input type="range" id="zr" min="1" max="10" step="0.1" value="1"><button id="zp">+</button>

</div>

</div><aside id="qs"></aside></div>
<script>/* 시뮬레이션 공통: 부모 창 신호, 단계형 움직임, 쪽 활성 */
var KIT=(function(){
'use strict';
var NS='http://www.w3.org/2000/svg';
var WS=/ws=/.test(location.hash);           /* 포털 학습지 안: 재생 버튼 없이 ◀ ▶로만 */
if(WS)document.body.classList.add('ws');
var RED=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tell(d){if(window.parent!==window)window.parent.postMessage(d,'*');}
var active=true;
addEventListener('message',function(e){var d=e.data||{};if(d.type==='active'){active=!!d.on;if(active)kick();}});
/* 수업자료 안에서는 방향키를 부모(쪽 넘기기)로 넘긴다 */
addEventListener('keydown',function(e){if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(['ArrowRight','ArrowLeft','PageDown','PageUp',' ','Escape','a','A','f','F'].indexOf(e.key)>=0){tell({type:'simkey',key:e.key,shift:e.shiftKey});}});
function el(t,a,p){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e;}
function T(p,x,y,s,a){var o={x:x,y:y,'font-size':20,fill:'#1D1D1F','font-weight':700};for(var k in a)o[k]=a[k];var e=el('text',o,p);e.textContent=s;return e;}
var ease=function(t){return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;};
var cl=function(t){return t<0?0:t>1?1:t;};
var seg=function(t,a,b){return ease(cl((t-a)/(b-a)));};
/* 단계형 움직임: steps = 단계별 길이(ms), render(p) */
var list=[],raf=0,last=0;
function motion(bar,steps,render,onEnd){
  bar.innerHTML='<span class="seg"><button data-s="0.6">느리게</button><button data-s="1">보통</button><button class="on" data-s="1.8">빠르게</button></span>'+
    '<button data-a="prev">◀</button><button class="playbtn" data-a="play">재생</button><button data-a="next">▶</button><button data-a="reset">처음부터</button><span class="st"></span>';
  var m={p:0,target:0,playing:false,speed:1.8,steps:steps,N:steps.length,render:render,bar:bar,onEnd:onEnd,ended:false,visible:true};
  bar.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;b.blur();
    if(b.dataset.s){m.speed=+b.dataset.s;[].forEach.call(bar.querySelectorAll('[data-s]'),function(x){x.classList.toggle('on',x===b);});return;}
    var a=b.dataset.a;if(a==='prev')prev(m);else if(a==='next')next(m);else if(a==='play')toggle(m);else if(a==='reset'){m.playing=false;m.p=m.target=0;draw(m);}});
  list.push(m);draw(m);return m;}
function draw(m){m.render(m.p);var st=m.bar.querySelector('.st');st.textContent=Math.min(m.N,Math.floor(m.p+1e-6))+' / '+m.N+'단계';
  var pb=m.bar.querySelector('[data-a="play"]');pb.textContent=m.playing?'일시정지':(m.p>=m.N?'다시 재생':'재생');
  m.bar.querySelector('[data-a="prev"]').disabled=m.playing||m.p<=0;m.bar.querySelector('[data-a="next"]').disabled=m.playing||m.p>=m.N;
  if(m.p>=m.N&&!m.ended){m.ended=true;if(m.onEnd)m.onEnd();}}
function play(m){m.playing=true;if(RED){m.p=m.target;m.playing=false;draw(m);return;}kick();draw(m);}
function next(m){if(m.playing)return;if(m.p<m.target){play(m);return;}if(m.p<m.N){m.target=Math.floor(m.p+1e-6)+1;play(m);}}
function prev(m){if(m.playing)return;m.p=m.target=Math.max(0,Math.ceil(m.p-1e-6)-1);draw(m);}
function toggle(m){if(m.playing){m.playing=false;draw(m);return;}if(m.p>=m.N)m.p=0;m.target=m.N;play(m);}
function goto(m,t){m.target=Math.max(m.target,t);if(m.p<m.target)play(m);}
var tickers=[];
function kick(){if(!raf){last=0;raf=requestAnimationFrame(loop);}}
function loop(now){raf=0;if(!active)return;var dt=last?Math.min(50,now-last):16;last=now;var any=false;
  list.forEach(function(m){if(!m.playing||!m.visible)return;var i=Math.min(Math.floor(m.p),m.N-1);m.p+=dt*m.speed/m.steps[i];
    if(m.p>=m.target){m.p=m.target;m.playing=false;}draw(m);if(m.playing)any=true;});
  tickers.forEach(function(f){if(f(dt))any=true;});
  if(any)raf=requestAnimationFrame(loop);}
function ticker(f){tickers.push(f);}
return {el:el,T:T,ease:ease,cl:cl,seg:seg,tell:tell,motion:motion,next:next,goto:goto,kick:kick,ticker:ticker,WS:WS,RED:RED};
})();
</script>
