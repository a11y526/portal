<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>반 페이지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/design.css">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<div class="net-badge glass-strong hidden" id="net" role="status">연결 확인 중</div>
<main class="wrap class-wrap">
  <div class="class-top">
    <div class="left">
      <a href="index.html" class="icon-btn glass lift" aria-label="반 선택으로 돌아가기">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
      </a>
      <h1 class="class-title" id="title"></h1>
      <span class="glass pill lesson-chip hidden" id="lesson"></span>
    </div>
    <nav class="top-links" aria-label="마이페이지와 순위">
      <a class="nav-link glass lift" href="me.html" id="me-link">마이페이지</a>
      <a class="nav-link glass lift" href="rank.html">이번 달 순위</a>
    </nav>
  </div>

  <!-- [개인 학습지](오늘 차시에 학습지가 있을 때만) [모둠활동] [게시판] -->
  <nav class="class-tabs glass" id="tabs" role="tablist" aria-label="오늘 수업">
    <button type="button" class="class-tab press hidden" role="tab" data-tab="sheet" id="tab-sheet" aria-controls="sheet" aria-selected="false">개인 학습지</button>
    <button type="button" class="class-tab press" role="tab" data-tab="group" id="tab-group" aria-controls="group-tab" aria-selected="true">모둠활동</button>
    <button type="button" class="class-tab press" role="tab" data-tab="mats" id="tab-mats" aria-controls="mats" aria-selected="false">게시판</button>
    <button type="button" class="class-tab press hidden" role="tab" data-tab="qs" id="tab-qs" aria-controls="qs-tab" aria-selected="false">퀴즈 쇼</button>
  </nav>

  <!-- 퀴즈 쇼: 선생님이 이 반에 열었을 때만 탭이 보인다. 탭을 열 때 quizshow.html을 안에 띄운다 -->
  <section class="qs-tab-box glass-strong hidden" id="qs-tab" role="tabpanel" aria-labelledby="tab-qs"></section>

  <!-- 반 게시판: 선생님이 섹션을 짜고 올린 자료 (로그인한 학생만) -->
  <section class="board-card glass hidden" id="mats" role="tabpanel" aria-labelledby="tab-mats">
    <div class="state-box is-idle login-need hidden" id="mats-login">
      <span class="state-title">로그인하면 볼 수 있어요</span>
      <a class="btn btn-primary press" href="index.html">로그인</a>
    </div>
    <div class="post-board" id="mats-board"><div class="skeleton board-empty"></div></div>
  </section>

  <!-- 개인 학습지: 수업자료 쪽에 맞춰 한 쪽씩 (게시판은 그리지 않는다) -->
  <section class="ws-card glass-strong hidden" id="sheet" role="tabpanel" aria-labelledby="tab-sheet">
    <header class="ws-head">
      <div class="ws-where">
        <span class="ws-slide num" id="ws-slide"></span>
        <h2 id="ws-h"></h2>
      </div>
      <span class="chip ws-chip hidden" id="ws-chip">완료</span>
    </header>
    <p class="ws-group hidden" id="ws-group"></p>
    <div class="state-box is-idle login-need hidden" id="ws-login">
      <span class="state-title">로그인하면 쓸 수 있어요</span>
      <a class="btn btn-primary press" href="index.html">로그인</a>
    </div>
    <div class="ws-page" id="ws-page" aria-live="polite"></div>
    <nav class="ws-nav" aria-label="학습지 쪽">
      <button type="button" class="icon-btn glass press" id="ws-prev" aria-label="앞 쪽">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      </button>
      <div class="ws-dots" id="ws-dots"></div>
      <button type="button" class="icon-btn glass press" id="ws-next" aria-label="다음 쪽">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>
      </button>
    </nav>
    <div class="ws-foot" id="ws-foot"></div>
  </section>

  <div class="class-body" id="group-tab" role="tabpanel" aria-labelledby="tab-group">
    <!-- 퀴즈 배틀: 선생님이 열었을 때만 -->
    <section class="qb-entry glass-strong pop hidden" id="quiz-card" aria-labelledby="quiz-h">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg>
      <div class="qb-entry-main">
        <b id="quiz-h">퀴즈 배틀</b>
        <span class="muted" id="quiz-s"></span>
      </div>
      <a class="btn btn-primary btn-big press" id="quiz-go" href="quiz.html">들어가기</a>
    </section>
    <section class="board-card glass rise" aria-labelledby="board-h">
      <div class="board-head">
        <h2 id="board-h">모둠 게시판</h2>
        <span class="board-note muted" id="board-note"></span>
      </div>
      <div class="post-board" id="post-board"><div class="skeleton board-empty"></div></div>
    </section>

    <div class="side hidden" id="side">
      <section class="group-card glass-strong rise hidden" style="--d:.08s" id="mine" aria-labelledby="mine-h">
        <div class="group-head">
          <h2 id="mine-h">우리 모둠</h2>
          <span class="mine-num muted hidden" id="num-change"></span>
        </div>
        <div class="mates hidden" id="mine-mates" aria-label="모둠원"></div>
        <div id="mine-body" aria-live="polite"></div>
      </section>

      <section class="sim-card glass rise hidden" style="--d:.14s" id="sims" aria-labelledby="sims-h">
        <h2 id="sims-h">시뮬레이션</h2>
        <div id="sim-list" style="display:flex;flex-direction:column;gap:10px"></div>
      </section>

      <section class="status-card glass rise hidden" style="--d:.2s" id="groups" aria-labelledby="groups-h">
        <h2 id="groups-h">모둠 현황</h2>
        <div class="group-grid" id="group-grid"></div>
      </section>
    </div>
  </div>
  <!-- 게시판 글쓰기 -->
  <dialog class="sheet" id="compose" aria-labelledby="compose-h">
    <form class="card glass-strong compose" id="compose-form" method="dialog">
      <h2 id="compose-h">글쓰기</h2>
      <input class="input" name="title" maxlength="60" placeholder="제목" aria-label="제목" autocomplete="off">
      <textarea class="input compose-body" name="body" maxlength="2000" rows="5" placeholder="내용" aria-label="내용"></textarea>
      <div class="compose-photo hidden" id="compose-photo">
        <img alt="올릴 사진" id="compose-img">
        <button type="button" class="btn btn-line btn-small" id="compose-unphoto">사진 빼기</button>
      </div>
      <input class="input" name="link" type="text" maxlength="500" placeholder="링크 (https://…)" aria-label="링크" autocomplete="off" inputmode="url">
      <div class="compose-acts">
        <label class="btn btn-line press compose-pick">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="15" rx="3"/><circle cx="12" cy="12.5" r="3.5"/><path d="M8 5l1.5-2h5L16 5"/></svg>
          <span>사진</span>
          <input type="file" accept="image/*" id="compose-file" hidden>
        </label>
        <span class="compose-gap"></span>
        <button type="button" class="btn btn-line press" id="compose-cancel">취소</button>
        <button type="submit" class="btn btn-primary press" id="compose-go">게시</button>
      </div>
    </form>
  </dialog>
  <!-- 학습지 완료 (모든 쪽을 제출했을 때) -->
  <div class="wsdone hidden" id="wsdone" role="dialog" aria-modal="true" aria-labelledby="wsdone-h">
    <div class="wsdone-fx" id="wsdone-fx" aria-hidden="true"></div>
    <div class="wsdone-card glass-strong">
      <div class="wsdone-sheet">
        <div class="wsdone-tiles" id="wsdone-tiles" aria-hidden="true"></div>
        <div class="wsdone-stamp" aria-hidden="true"><span>완료</span></div>
      </div>
      <span class="wsdone-t" id="wsdone-t"></span>
      <h2 class="wsdone-h" id="wsdone-h">학습지 완료!</h2>
      <div class="wsdone-gain" id="wsdone-gain">
        <span class="wsdone-chip"><b class="num" id="wsdone-xp">0</b> XP</span>
        <span class="wsdone-chip is-coin"><b class="num" id="wsdone-co">0</b> 코인</span>
      </div>
      <button type="button" class="btn btn-primary btn-big press" id="wsdone-ok">확인</button>
    </div>
  </div>
  <!-- 레벨업 -->
  <div class="lvup hidden" id="lvup" role="dialog" aria-modal="true" aria-labelledby="lvup-h">
    <div class="lvup-box">
      <div class="lvup-rays" aria-hidden="true"><svg class="rays" viewBox="0 0 200 200">
        <g fill="#FFC48A"><path d="M100 100 L96 0 L104 0 Z"/><path d="M100 100 L196 96 L196 104 Z"/><path d="M100 100 L104 200 L96 200 Z"/><path d="M100 100 L4 104 L4 96 Z"/><path d="M100 100 L168 26 L174 32 Z"/><path d="M100 100 L174 168 L168 174 Z"/><path d="M100 100 L32 174 L26 168 Z"/><path d="M100 100 L26 32 L32 26 Z"/></g>
      </svg></div>
      <div class="lvup-card glass-strong">
        <div class="lvup-av" id="lvup-av"></div>
        <span class="lvup-h" id="lvup-h">레벨 업!</span>
        <span class="lvup-n num" id="lvup-n"></span>
        <span class="lvup-s" id="lvup-s"></span>
        <button type="button" class="btn btn-primary btn-big press" id="lvup-ok">확인</button>
      </div>
    </div>
  </div>
</main>
<script type="module" src="assets/js/pages/class.js"></script>
</body>
</html>
