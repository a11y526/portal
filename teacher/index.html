<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/css/design.css">
<link rel="stylesheet" href="../assets/css/site.css">
</head>
<body>
<main class="wrap admin-wrap">
  <!-- 관리 (로그인과 교사 확인은 gate.js) -->
  <div id="v-admin" style="display:flex;flex-direction:column;gap:24px">
    <div class="admin-top">
      <h1>관리</h1>
      <div class="row-actions">
        <a class="nav-link glass lift" href="groups.html">모둠 편성</a>
        <a class="nav-link glass lift" href="check.html">검사</a>
        <a class="nav-link glass lift" href="../index.html" target="_blank" rel="noopener">학생 화면</a>
        <button class="btn btn-line" type="button" data-logout>로그아웃</button>
      </div>
    </div>

    <section class="card glass rise" aria-labelledby="h-today">
      <h2 id="h-today">오늘 보드</h2>
      <div class="today-list" id="today-list"></div>
    </section>

    <form class="card glass rise" style="--d:.06s" id="create" aria-labelledby="h-create">
      <h2 id="h-create">보드 만들기</h2>
      <div class="grid-2">
        <label class="field"><span>차시</span><input class="input" name="lesson_code" placeholder="523" required></label>
        <label class="field"><span>제목</span><input class="input" name="title"></label>
      </div>

      <div class="field">
        <span>시뮬레이션 링크</span>
        <div class="sim-rows" data-sims></div>
        <div><button type="button" class="btn btn-line btn-small" data-add-sim>+ 링크 추가</button></div>
      </div>

      <div class="field">
        <span>반별 패들렛 주소</span>
        <div class="padlet-rows" id="padlet-rows"></div>
        <div><button type="button" class="btn btn-line btn-small" id="copy-first">첫 주소를 모든 반에 복사</button></div>
      </div>

      <label class="check"><input type="checkbox" name="set_today" checked> 만들고 바로 오늘 보드로 지정</label>
      <div><button class="btn btn-primary" type="submit">보드 만들기</button></div>
    </form>

    <section class="card glass rise" style="--d:.12s" aria-labelledby="h-boards">
      <h2 id="h-boards">보드 목록</h2>
      <div class="board-groups" id="board-groups"></div>
    </section>

    <section class="card glass rise" style="--d:.18s" aria-labelledby="h-roster">
      <h2 id="h-roster">명단과 코드</h2>
      <form class="roster-size" id="roster-size">
        <span class="roster-size-label">반별 마지막 번호</span>
        <div class="roster-size-grid" id="roster-size-grid"></div>
        <div><button class="btn btn-line btn-small" type="submit">명단 저장</button></div>
      </form>
      <div class="cls-tabs" id="roster-tabs" role="tablist" aria-label="반"></div>
      <div class="row-actions">
        <button type="button" class="btn btn-primary btn-small" id="issue-missing">코드 없는 학생 발급</button>
        <button type="button" class="btn btn-line btn-small" id="issue-all">반 전체 다시 발급</button>
        <span class="muted roster-count num" id="roster-count"></span>
      </div>
      <div class="roster" id="roster-list"></div>

    </section>

    <section class="card glass rise" style="--d:.24s" aria-labelledby="h-presets">
      <h2 id="h-presets">빠른 피드백 버튼</h2>
      <div class="preset-list" id="preset-list"></div>
      <form class="preset-add" id="preset-form">
        <input class="input" name="text" maxlength="30" required aria-label="새 피드백 버튼 문구">
        <button class="btn btn-line" type="submit">추가</button>
      </form>
    </section>
  </div>

  <!-- 발급한 코드 (이 창에서만 볼 수 있음) -->
  <dialog class="sheet" id="codes-dlg">
    <div class="card glass-strong">
      <h2 id="codes-title">코드</h2>
      <p class="muted" style="margin:0">이 창을 닫으면 코드를 다시 볼 수 없어요</p>
      <div class="codes-preview num" id="codes-preview"></div>
      <div class="row-actions">
        <button class="btn btn-primary" type="button" id="codes-print">A4로 인쇄</button>
        <button class="btn btn-line" type="button" id="codes-close">닫기</button>
      </div>
    </div>
  </dialog>

  <!-- 보드 수정 -->
  <dialog class="sheet" id="edit">
    <form class="card glass-strong" method="dialog" id="edit-form">
      <h2 id="edit-title">보드 수정</h2>
      <div class="grid-2">
        <label class="field"><span>차시</span><input class="input" name="lesson_code" required></label>
        <label class="field"><span>제목</span><input class="input" name="title"></label>
      </div>
      <label class="field"><span>패들렛 주소</span><input class="input" name="padlet"></label>
      <div class="hint muted" id="edit-hint" style="font-size:13px;word-break:break-all"></div>
      <div class="field">
        <span>시뮬레이션 링크</span>
        <div class="sim-rows" data-sims></div>
        <div><button type="button" class="btn btn-line btn-small" data-add-sim>+ 링크 추가</button></div>
      </div>
      <div class="row-actions">
        <button class="btn btn-primary" type="submit" value="save">저장</button>
        <button class="btn btn-line" type="button" id="edit-cancel">취소</button>
      </div>
    </form>
  </dialog>
</main>
<div class="print-sheet" id="print-sheet" aria-hidden="true"></div>
<script type="module" src="../assets/js/pages/teacher.js"></script>
</body>
</html>
