<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>입구 - 반 선택</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2457E6}a:hover{color:#1A43B8}
.glass{background:rgba(255,255,255,.55);-webkit-backdrop-filter:blur(24px) saturate(180%);backdrop-filter:blur(24px) saturate(180%);border:1px solid rgba(255,255,255,.8);box-shadow:0 12px 32px rgba(28,39,76,.10),inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 1px rgba(255,255,255,.4)}
.glass-strong{background:rgba(255,255,255,.72);-webkit-backdrop-filter:blur(28px) saturate(200%);backdrop-filter:blur(28px) saturate(200%);border:1px solid rgba(255,255,255,.9);box-shadow:0 18px 40px rgba(28,39,76,.14),inset 0 1px 0 #fff}
.orb{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none}
.lift{transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.lift:hover{transform:translateY(-4px) scale(1.02);box-shadow:0 20px 40px rgba(28,39,76,.16),inset 0 1px 0 #fff}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.rise{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(40px,-30px)}}
.drift{animation:drift 16s ease-in-out infinite}
.drift2{animation:drift 20s ease-in-out infinite reverse}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="position: relative; min-height: 820px; overflow: hidden; background: #EDF1F7; font-family: 'Noto Sans KR', sans-serif; color: #0B1220">
<div class="orb drift" aria-hidden="true" style="width: 520px; height: 520px; left: -140px; top: -160px; background: #6EA8FF; opacity: .55"></div>
<div class="orb drift2" aria-hidden="true" style="width: 460px; height: 460px; right: -120px; top: 120px; background: #B79CFF; opacity: .5"></div>
<div class="orb drift" aria-hidden="true" style="width: 420px; height: 420px; left: 30%; bottom: -220px; background: #6FE3C8; opacity: .5"></div>

<div style="position: relative; max-width: 1040px; margin: 0 auto; padding: 48px 24px 72px; display: flex; flex-direction: column; gap: 40px">
<div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px">
<div class="glass" style="display: inline-flex; align-items: center; gap: 10px; padding: 10px 18px; border-radius: 999px; font-weight: 700; font-size: 16px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#2457E6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6"></path><path d="M10 3v6L4.5 18.5A1.7 1.7 0 0 0 6 21h12a1.7 1.7 0 0 0 1.5-2.5L14 9V3"></path><path d="M7 15h10"></path></svg>
1학년 과학
</div>
<div style="display: flex; gap: 10px; flex-wrap: wrap">
<a href="Rank.dc.html" class="glass lift" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; text-decoration: none; color: #0B1220; font-weight: 500; font-size: 15px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 21h8"></path><path d="M12 17v4"></path><path d="M7 4h10v5a5 5 0 0 1-10 0z"></path><path d="M17 5h3v2a3 3 0 0 1-3 3"></path><path d="M7 5H4v2a3 3 0 0 0 3 3"></path></svg>
이번 달 순위</a>
<a href="Me.dc.html" class="glass lift" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 18px; border-radius: 999px; text-decoration: none; color: #0B1220; font-weight: 500; font-size: 15px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0 1 16 0"></path></svg>
내 기록</a>
</div>
</div>

<h1 class="rise" style="margin: 8px 0 0; font-size: 60px; line-height: 1.1; font-weight: 900; letter-spacing: -0.03em">몇 반인가요?</h1>

<a href="Class.dc.html" class="glass-strong lift rise" style="animation-delay: .08s; display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 24px 28px; border-radius: 28px; text-decoration: none; color: #0B1220; flex-wrap: wrap">
<div style="display: flex; flex-direction: column; gap: 4px">
<span style="font-size: 14px; font-weight: 500; color: #4E5868">지난번에 들어간 반</span>
<span style="font-size: 30px; font-weight: 900; letter-spacing: -0.02em">8반 · 오늘 수업 바로 가기</span>
</div>
<span style="display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; border-radius: 999px; background: #2457E6; color: #fff">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path></svg>
</span>
</a>

<div style="display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 16px">
<sc-for list="{{classes}}" as="c" hint-placeholder-count="7">
<a href="Class.dc.html" class="glass lift rise" style="animation-delay: {{c.delay}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; height: 140px; border-radius: 28px; text-decoration: none; color: #0B1220">
<span style="font-size: 52px; font-weight: 900; letter-spacing: -0.04em; line-height: 1">{{c.num}}</span>
<span style="font-size: 16px; font-weight: 700; color: #4E5868">반</span>
</a>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":820}}'>
class Component extends DCLogic {
renderVals() {
var nums = [6, 7, 8, 9, 10, 11, 12];
return {
classes: nums.map(function (n, i) { return { num: String(n), delay: (0.14 + i * 0.05).toFixed(2) + 's' }; })
};
}
}
</script>
</body>
</html>
