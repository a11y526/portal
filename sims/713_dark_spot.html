<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>713 태양의 검은 점과 뿜어져 나오는 물질</title>
<style>
:root{--p:#0066CC;--ink:#1D1D1F;--mut:#6E6E73;--line:#E3E3E8;--pearl:#F5F5F7;--ok:#1E8E3E;
  --font:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#fff;color:var(--ink);font-family:var(--font);word-break:keep-all;-webkit-tap-highlight-color:transparent}
body{display:flex;flex-direction:column;overflow:hidden;padding:8px;gap:8px}
button{font:700 16px var(--font);color:var(--p);background:#fff;border:1.5px solid var(--p);border-radius:999px;padding:6px 14px;min-height:42px;cursor:pointer;touch-action:manipulation}
button:active{background:#E8F1FB}
button:disabled{opacity:.35;cursor:not-allowed;background:#fff}
svg text{font-family:var(--font)}
.how{flex:none;margin:0;padding:7px 12px;border-radius:12px;background:#F2F6FC;font-size:16px;line-height:1.5;display:flex;flex-wrap:wrap;gap:2px 14px}
.how span{color:#8A94A6;font-weight:600}
.how span b{color:inherit}
.how span.now{color:var(--ink)}
.how span.now b{color:var(--p)}
.how span.done{color:var(--ok)}
.how span.done::after{content:" ✓";font-weight:800}
.row{flex:1;min-height:0;display:flex;gap:10px}
.stage{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column;gap:8px}
.stage svg{display:block;flex:1;width:100%;min-height:0;touch-action:none;user-select:none;-webkit-user-select:none}
.ctrl{flex:none;display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;font-size:16px;font-weight:700}
.ctrl input[type=range]{accent-color:var(--p);width:220px;height:32px;touch-action:none}
.ctrl .st{margin-left:auto;font-size:15px;color:var(--mut)}
#qs{flex:0 0 clamp(236px,31%,300px);display:flex;flex-direction:column;gap:10px;overflow:auto;padding:2px 2px 4px}
.q{border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;gap:7px;transition:border-color .2s,opacity .2s}
.q p{margin:0;font-size:16.5px;font-weight:700;line-height:1.45}
.q .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--p);color:#fff;font-size:13px;margin-right:6px;vertical-align:2px}
.q .tag{display:inline-block;font-size:12.5px;font-weight:800;color:#8A5300;background:rgba(255,196,77,.3);border-radius:999px;padding:1px 8px;margin-right:6px;vertical-align:2px}
.q .opts{display:flex;flex-wrap:wrap;gap:6px}
.q .opts button{border-color:#C7C7CC;color:var(--ink);font-size:15px;min-height:38px;padding:4px 12px;font-weight:600}
.q .opts button.on{background:var(--p);border-color:var(--p);color:#fff}
.q .lock{font-size:14px;font-weight:700;color:var(--mut)}
.q.locked{opacity:.55}
.q.locked .opts{display:none}
.q:not(.locked) .lock{display:none}
.q.picked{border-color:#9EC3EA}
.sub{flex:none;display:flex;flex-direction:column;gap:6px;margin-top:auto}
.sub button{background:var(--p);color:#fff;font-size:17px;min-height:46px}
.sub button:disabled{background:#fff;color:var(--p)}
.sub .msg{font-size:14.5px;font-weight:700;color:var(--mut);text-align:center;min-height:21px}
.sub .msg.ok{color:var(--ok)}
@media (max-height:560px) and (min-width:601px){
  body{padding:6px;gap:6px}
  .how{font-size:14px;padding:5px 10px;gap:0 10px}
  #qs{gap:6px}
  .q{padding:6px 10px;gap:5px;border-radius:12px}
  .q p{font-size:14.5px}
  .q .opts{gap:4px}
  .q .opts button{font-size:14px;min-height:32px;padding:2px 10px}
  .q .lock{font-size:13px}
  .sub{gap:3px}
  .sub button{min-height:38px;font-size:16px}
  .sub .msg{font-size:13px;min-height:18px}
  button{min-height:36px}
}
@media (max-width:600px){
  body{overflow:auto;height:auto;min-height:100%}
  .row{flex-direction:column}
  .stage{flex:none;height:62vh;min-height:300px}
  #qs{flex:none;overflow:visible}
}
</style>
<script>
/* 공통: 조작 안내 줄(#how), 문항 칸(#qs)과 [제출] → 학습지 칸(.sim-in)으로 {type:'sim:answer', n, value} */
/* 점검용: ?raf=timer 이면 화면이 숨겨져도 움직임이 돈다 */
if(/raf=timer/.test(location.search))window.requestAnimationFrame=function(f){return setTimeout(function(){f(performance.now());},16);},window.cancelAnimationFrame=clearTimeout;
var Q=(function(){
'use strict';
var WS=/ws=/.test(location.hash);
var RED=matchMedia('(prefers-reduced-motion: reduce)').matches;
function tell(d){if(window.parent!==window)window.parent.postMessage(d,'*');}
/* 수업자료 안에서는 쪽 넘기기·답 보기 키를 수업자료로 넘긴다 */
addEventListener('keydown',function(e){if(/INPUT|TEXTAREA/.test(e.target.tagName))return;
  if(['ArrowRight','ArrowLeft','PageDown','PageUp',' ','Escape','a','A','f','F'].indexOf(e.key)>=0)tell({type:'simkey',key:e.key,shift:e.shiftKey});});
tell({type:'sim:gate'});
/* 안내 줄: steps = ['① <b>…</b> …', …], 지금 할 단계는 진하게, 끝낸 단계는 ✓ */
function how(steps){
  var box=document.getElementById('how'),done=steps.map(function(){return false;}),items=steps.map(function(s){var e=document.createElement('span');e.innerHTML=s;box.appendChild(e);return e;});
  function draw(){var cur=done.indexOf(false);items.forEach(function(e,i){e.className=done[i]?'done':i===cur?'now':'';});}
  draw();
  return {done:function(i,v){done[i]=v!==false;draw();},is:function(i){return done[i];},first:function(){return done.indexOf(false);},steps:steps};}
/* 문항: list = [{html, opts:[…], lock:'…'}], 고른 값은 보기 글 그대로 보낸다 */
function panel(list,o){
  o=o||{};
  var box=document.getElementById('qs'),Hw=o.how;
  var st=list.map(function(q,i){
    var d=document.createElement('div');d.className='q'+(q.lock?' locked':'');
    d.innerHTML='<p>'+q.html+'</p><div class="opts"></div><div class="lock">'+(q.lock||'')+'</div>';
    var ob=d.querySelector('.opts'),s={el:d,val:'',open:!q.lock,btns:[]};
    q.opts.forEach(function(t){var b=document.createElement('button');b.type='button';b.textContent=t;
      b.onclick=function(){b.blur();if(!s.open)return;s.val=s.val===t?'':t;s.btns.forEach(function(x){x.classList.toggle('on',x.textContent===s.val);});d.classList.toggle('picked',!!s.val);sent=false;sync();if(o.onPick)o.onPick(i,s.val);};
      ob.appendChild(b);s.btns.push(b);});
    box.appendChild(d);return s;});
  var sub=document.createElement('div');sub.className='sub';sub.innerHTML='<button type="button">제출</button><div class="msg"></div>';box.appendChild(sub);
  var sb=sub.querySelector('button'),msg=sub.querySelector('.msg'),sent=false;
  function sync(){
    var ready=st.every(function(s){return s.open&&s.val;});
    sb.disabled=!ready;msg.classList.toggle('ok',sent);
    if(sent){msg.textContent=WS?'학습지로 보냈어요':'제출했어요';return;}
    if(ready){msg.textContent='';return;}
    var k=Hw?Hw.first():-1;
    if(k>=0&&st.some(function(s){return !s.open;}))msg.textContent=(Hw.steps[k].match(/^[①-⑨]/)||[''])[0]+'부터 해 보세요';
    else msg.textContent='모든 문항을 골라 보세요';}
  sb.onclick=function(){sb.blur();if(sb.disabled)return;
    st.forEach(function(s,i){tell({type:'sim:answer',n:i+1,value:s.val});});tell({type:'sim:done'});sent=true;
    if(Hw)Hw.done(Hw.steps.length-1);sync();};
  sync();
  return {open:function(i){var s=st[i];if(s.open)return;s.open=true;s.el.classList.remove('locked');sync();},
    val:function(i){return st[i].val;},sync:sync};}
return {WS:WS,RED:RED,tell:tell,how:how,panel:panel};
})();
</script>

</head>
<body>
<p class="how" id="how"></p>
<div class="row">
  <div class="stage"><svg id="s" viewBox="0 0 800 500" role="img" aria-label="태양 사진: 검은 점과 가장자리를 눌러 보기"></svg></div>
  <aside id="qs"></aside>
</div>

function startBurst(a){burst={a,x:C[0]+Math.cos(a)*R,y:C[1]+Math.sin(a)*R};t0=performance.now();
  if(!H.is(1)){H.done(1);P.open(1);}P.sync();kick();}
function kick(){if(!raf)raf=requestAnimationFrame(frame);}
function frame(now){raf=0;
  const ph=now/1000;
  /* 아직 안 누른 곳은 깜빡임 */
  pulse.forEach((c,i)=>{c.setAttribute('opacity',picked<0&&!Q.RED?.35+.35*Math.sin(ph*4+i):0);c.setAttribute('stroke',i===picked?'#fff':'#4FC3FF');});
  if(picked>=0)pulse[picked].setAttribute('opacity',1);
  rim.setAttribute('opacity',burst||Q.RED?0:(H.is(0)?.3+.3*Math.sin(ph*4):0));
  if(burst){
    const t=(now-t0)/1000,{a,x,y}=burst;
    const g=Math.min(1,t/1.2),nx=Math.cos(a),ny=Math.sin(a),tx=-ny,ty=nx;
    const h=26+70*g,w=34;
    const dpath=`M${x-tx*w} ${y-ty*w} C${x-tx*w+nx*h*1.3} ${y-ty*w+ny*h*1.3} ${x+tx*w+nx*h*1.3} ${y+ty*w+ny*h*1.3} ${x+tx*w} ${y+ty*w}`;
    loop.setAttribute('d',dpath);loop2.setAttribute('d',dpath);loop.setAttribute('opacity',.85);loop2.setAttribute('opacity',.9);
    /* 입자: 솟은 꼭대기에서 지구로 */
    const sx=x+nx*h,sy=y+ny*h,cx=(sx+E[0])/2-20,cy=Math.max(sy,E[1])+40;
    parts.forEach(p=>{const u=((t-1)/2.6+p.dl)%1;if(t<1){p.e.setAttribute('opacity',0);return;}
      const q=1-u,px=q*q*sx+2*q*u*cx+u*u*E[0],py=q*q*sy+2*q*u*cy+u*u*E[1];
      p.e.setAttribute('cx',px+p.sp*14*Math.sin(u*Math.PI));p.e.setAttribute('cy',py+p.sp*14*Math.cos(u*Math.PI));
      p.e.setAttribute('opacity',u<.9?.95:.95*(1-(u-.9)/.1));});
  }
  if(!Q.RED)raf=requestAnimationFrame(frame);
}
if(Q.RED)setInterval(()=>frame(performance.now()),400);
kick();
})();
</script>
