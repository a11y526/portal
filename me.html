<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마이페이지</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/design.css">
<link rel="stylesheet" href="assets/css/site.css">
</head>
<body>
<main class="wrap me-wrap">
  <div class="page-top">
    <a href="index.html" class="icon-btn glass lift" aria-label="처음으로">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5"/><path d="M11 6l-6 6 6 6"/></svg>
    </a>
    <a href="rank.html" class="nav-link glass lift">이번 달 순위</a>
  </div>

  <!-- 마이페이지 -->
  <div class="me-body hidden" id="me">
    <section class="glass-strong me-hero rise">
      <div class="me-avatar" id="hero-av"></div>
      <div class="me-main">
        <div class="me-name-row">
          <h1 class="me-name" id="nick"></h1>
          <span class="chip" id="cls-chip"></span>
        </div>
        <div class="nick-line">
          <span class="tag hidden" id="nick-state"></span>
          <button type="button" class="link-btn" id="nick-open"></button>
        </div>
        <form class="nick-form hidden" id="nick-form" autocomplete="off">
          <input class="input" id="nick-in" maxlength="8" aria-label="새 닉네임" placeholder="2~8자 · 한글, 영문, 숫자">
          <button class="btn btn-primary" type="submit">신청</button>
          <button class="btn btn-line" type="button" id="nick-cancel">취소</button>
        </form>
        <div class="me-level">
          <div class="lv-ring">
            <svg width="112" height="112" viewBox="0 0 136 136" aria-hidden="true">
              <circle cx="68" cy="68" r="54" fill="none" stroke="rgba(36,87,230,.12)" stroke-width="12"/>
              <circle class="lv-arc" id="lv-arc" cx="68" cy="68" r="54" fill="none" stroke="#2457E6" stroke-width="12" stroke-linecap="round" stroke-dasharray="339.3" stroke-dashoffset="339.3"/>
            </svg>
            <div class="lv-text"><span>레벨</span><b class="num" id="lv">1</b></div>
          </div>
          <div class="lv-bar-wrap">
            <div class="lv-bar-head"><span id="lv-next"></span><b class="num" id="lv-left"></b></div>
            <div class="xp-track"><div class="xp-fill" id="xp-fill"></div></div>
          </div>
        </div>
      </div>
    </section>

    <div class="stat-grid">
      <div class="stat glass rise" style="--d:.1s">
        <span class="stat-k">이번 달 XP</span>
        <span class="stat-v num" id="month-xp">0</span>
        <span class="stat-s" id="month-rank"></span>
      </div>
      <div class="stat glass rise" style="--d:.16s">
        <span class="stat-k">누적 XP</span>
        <span class="stat-v num" id="total-xp">0</span>
        <span class="stat-s muted">레벨은 줄지 않아요</span>
      </div>
      <div class="stat glass rise" style="--d:.22s">
        <span class="stat-k">코인</span>
        <span class="stat-v">
          <svg width="28" height="28" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" fill="#F2B705"/><circle cx="12" cy="12" r="6.5" fill="none" stroke="#B88600" stroke-width="1.6"/></svg>
          <span class="num" id="coins">0</span>
        </span>
      </div>
    </div>

    <section class="glass me-card rise" style="--d:.28s" aria-labelledby="wear-h">
      <div class="me-card-head">
        <h2 id="wear-h">꾸미기</h2>
        <div class="row-actions">
          <button type="button" class="btn btn-line btn-small hidden" id="wear-undo">되돌리기</button>
          <button type="button" class="btn btn-primary btn-small" id="wear-save" disabled>저장</button>
        </div>
      </div>
      <div class="cls-tabs" id="slot-tabs" role="tablist" aria-label="부품"></div>
      <div class="wear-grid" id="wear-grid" role="radiogroup" data-still></div>
    </section>

    <section class="glass me-card rise" style="--d:.34s" aria-labelledby="hist-h">
      <h2 id="hist-h">받은 기록</h2>
      <div class="hist" id="hist"></div>
    </section>
  </div>

  <!-- 레벨업 -->
  <div class="lvup hidden" id="lvup" role="dialog" aria-modal="true" aria-labelledby="lvup-h">
    <div class="lvup-box">
      <div class="lvup-rays" aria-hidden="true"><svg class="rays" viewBox="0 0 200 200">
        <g fill="#FFC48A"><path d="M100 100 L96 0 L104 0 Z"/><path d="M100 100 L196 96 L196 104 Z"/><path d="M100 100 L104 200 L96 200 Z"/><path d="M100 100 L4 104 L4 96 Z"/><path d="M100 100 L168 26 L174 32 Z"/><path d="M100 100 L174 168 L168 174 Z"/><path d="M100 100 L32 174 L26 168 Z"/><path d="M100 100 L26 32 L32 26 Z"/></g>
      </svg></div>
      <div class="lvup-card glass-strong">
        <div class="lvup-av" id="lvup-av"></div>
        <span class="lvup-h" id="lvup-h">레벨 업!</span>
        <span class="lvup-n num" id="lvup-n"></span>
        <span class="lvup-s" id="lvup-s"></span>
        <button type="button" class="btn btn-primary btn-big press" id="lvup-ok">확인</button>
      </div>
    </div>
  </div>
</main>
<script defer src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.js"></script>
<script type="module" src="assets/js/pages/me.js"></script>
</body>
</html>
